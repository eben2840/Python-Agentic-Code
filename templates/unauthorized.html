<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>careIT Vibe — Access Restricted</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #ffffff;
      --surface:  #ffffff;
      --border:   #cbd5e1;
      --text:     #0f172a;
      --muted:    #64748b;
      --accent:   #334155;
      --accent-m: rgba(51, 65, 85, 0.12);
      --shadow:   0 10px 15px -3px rgba(0, 0, 0, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:       #0a0a0f;
        --surface:  #111118;
        --border:   #1e1e2a;
        --text:     #f8fafc;
        --muted:    #64748b;
        --accent:   #818cf8;
        --accent-m: rgba(129, 140, 248, 0.15);
        --shadow:   0 10px 15px -3px rgba(0, 0, 0, 0.6);
      }
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .header {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1rem;
      gap: 0.6rem;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .brand-text {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 56px);
      padding: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 3rem 2.5rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-m);
      margin-bottom: 1.5rem;
    }

    .icon-wrap svg {
      width: 24px;
      height: 24px;
      stroke: var(--accent);
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      background: var(--accent-m);
      border-radius: 9999px;
      padding: 0.3rem 0.8rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header class="header">
    <span class="brand-dot"></span>
    <span class="brand-text">careIT Vibe</span>
  </header>

  <div class="page">
    <div class="card">

      <div class="icon-wrap">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <h1>Access Restricted</h1>
      <p>Please use the CareIT Vibe App.</p>

      <div class="divider"></div>

      <span class="badge">
        <span class="badge-dot"></span>
        Authorization: Failed
      </span>

    </div>
  </div>

</body>
</html>
