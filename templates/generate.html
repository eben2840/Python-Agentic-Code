{% extends 'base.html' %}
{% set active_nav = 'generate' %}

{% block title %}CareIT Vibe | Generate Idea{% endblock %}

{% block content %}
<div class="content-header">
  <div class="header-actions">
    <button class="btn btn-primary" id="create-task-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Schedule Task
    </button>
  </div>
</div>
<div class="content-body idea-page">
  <div class="idea-generator-container">

    {% if error %}
    <div class="idea-result-section">
      <p style="color:red;">{{ error }}</p>
    </div>
    {% endif %}

    {% if generated_idea %}
    <div class="idea-result-section">
      <div class="idea-result-header">
        <button type="submit" form="generate-idea-form" id="regenerate-idea-btn" class="btn btn-ghost btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
          Regenerate
        </button>
        <a href="{{ url_for('web.generate') }}" class="btn btn-ghost btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New Idea
        </a>
      </div>
      <div class="idea-content idea-result">{{ generated_idea }}</div>
      <div class="idea-actions">
        <button class="btn btn-primary" id="use-idea-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Edit and Continue
        </button>
      </div>
    </div>
    {% endif %}

    <div id="idea-loading" class="idea-loading hidden">
      <div class="loading-spinner"></div>
    </div>

    <div class="idea-form-section">
      <div class="form-group">
        <form id="generate-idea-form" method="POST" action="{{ url_for('web.generate_idea_form') }}" onsubmit="document.getElementById('idea-loading').classList.remove('hidden')">
          <div class="idea-prompt-shell">
            <div class="idea-prompt-topbar">
              <button type="button" class="idea-chip" aria-label="Selected tool Computer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="12" rx="2"/>
                  <line x1="8" y1="20" x2="16" y2="20"/>
                  <line x1="12" y1="16" x2="12" y2="20"/>
                </svg>
                <span>Models</span>
              </button>
            </div>
            <textarea
              id="idea-prompt"
              name="prompt"
              class="idea-prompt-field"
              rows="2"
              placeholder="eg..A medication titration calculator based on current labs"
            >{{ idea_prompt or '' }}</textarea>
            <div class="idea-prompt-toolbar">
              <div class="idea-prompt-left">
                <button type="button" class="idea-toolbar-icon" aria-label="Add attachment">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                  </svg>
                </button>
              </div>
              <div class="idea-prompt-right">
                <button type="submit" class="btn-generate-idea-shell" id="generate-idea-btn" aria-label="Generate idea">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="3" x2="12" y2="21"/>
                    <path d="M18 9a6 6 0 0 1 0 6"/>
                    <path d="M6 9a6 6 0 0 0 0 6"/>
                    <path d="M22 12a10 10 0 0 1-2.93 7.07"/>
                    <path d="M2 12a10 10 0 0 0 2.93 7.07"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  {% if generated_idea %}
  window.app.currentIdea = {
    prompt:  {{ idea_prompt | tojson }},
    content: {{ generated_idea | tojson }},
    title:   ''
  };
  {% endif %}
</script>
{% endblock %}
