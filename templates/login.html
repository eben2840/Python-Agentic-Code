<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f6f6;
      color: #111;
    }
    main {
      width: 100%;
      max-width: 360px;
      margin: 80px auto;
      padding: 24px;
      background: #fff;
      border: 1px solid #ddd;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 22px;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #bbb;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      border: 0;
      background: #111;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .error {
      margin: 0 0 14px;
      color: #b00020;
      font-size: 14px;
    }
  </style>
</head>
<body>
<main>
  <h1>Admin Login</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Login</button>
  </form>
</main>
</body>
</html>
