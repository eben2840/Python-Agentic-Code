<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk & Pain Assessment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-shield-alt text-primary me-3" style="font-size: 1.5rem;"></i>
                        <h1 class="mb-0">Risk & Pain Assessment</h1>
                    </div>
                    <p class="text-muted mb-0">Comprehensive risk stratification and pain evaluation for all patients</p>
                </div>
            </div>
        </div>

        <div id="assessmentContainer" class="row">
            <!-- Patient assessments will be rendered here -->
        </div>

        <div id="noDataMessage" class="row d-none">
            <div class="col-12">
                <div class="no-data-card text-center">
                    <i class="fas fa-clipboard-list text-muted mb-3" style="font-size: 2rem;"></i>
                    <h3 class="text-muted">No Assessment Data Available</h3>
                    <p class="text-muted">No patient data found for risk and pain assessment.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
