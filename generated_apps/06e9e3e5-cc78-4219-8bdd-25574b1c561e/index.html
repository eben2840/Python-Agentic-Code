<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="dashboard-title">
                    <i class="fas fa-hospital text-primary me-3"></i>
                    Healthcare Dashboard
                </h1>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row mb-4" id="summaryCards">
            <!-- Cards will be populated by JavaScript -->
        </div>

        <!-- Ward and Room Structure -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-building me-2"></i>Ward & Room Occupancy</h3>
                    </div>
                    <div class="card-body">
                        <div id="wardRoomStructure" class="ward-room-container">
                            <!-- Ward and room data will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patients and Conditions -->
        <div class="row">
            <div class="col-12">
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-users me-2"></i>Patients & Conditions</h3>
                    </div>
                    <div class="card-body">
                        <div id="patientsGrid" class="patients-grid">
                            <!-- Patient data will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
