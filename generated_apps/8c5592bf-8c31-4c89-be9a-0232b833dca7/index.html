<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER Ward Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="dashboard-header">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-hospital-alt text-danger me-3" style="font-size: 2rem;"></i>
                        <div>
                            <h1 class="mb-0">Emergency Room Dashboard</h1>
                            <p class="text-muted mb-0">Real-time patient monitoring</p>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-card">
                            <i class="fas fa-users text-primary"></i>
                            <div>
                                <div class="stat-number" id="totalPatients">0</div>
                                <div class="stat-label">Total Patients</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-exclamation-triangle text-warning"></i>
                            <div>
                                <div class="stat-number" id="criticalPatients">0</div>
                                <div class="stat-label">Critical Cases</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-pills text-success"></i>
                            <div>
                                <div class="stat-number" id="activeTreatments">0</div>
                                <div class="stat-label">Active Treatments</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="filter-card">
                    <div class="d-flex flex-wrap align-items-center gap-3">
                        <div class="filter-group">
                            <label class="filter-label">Filter by Condition:</label>
                            <select class="form-select form-select-sm" id="conditionFilter">
                                <option value="">All Conditions</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Gender:</label>
                            <select class="form-select form-select-sm" id="genderFilter">
                                <option value="">All Genders</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Age Range:</label>
                            <select class="form-select form-select-sm" id="ageFilter">
                                <option value="">All Ages</option>
                                <option value="0-18">0-18 years</option>
                                <option value="19-35">19-35 years</option>
                                <option value="36-65">36-65 years</option>
                                <option value="65+">65+ years</option>
                            </select>
                        </div>
                        <button class="btn btn-outline-secondary btn-sm" id="clearFilters">
                            <i class="fas fa-times me-1"></i>Clear Filters
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient Grid -->
        <div class="row" id="patientGrid">
            <!-- Patient cards will be dynamically inserted here -->
        </div>

        <!-- No Data Message -->
        <div class="row d-none" id="noDataMessage">
            <div class="col-12">
                <div class="no-data-card">
                    <i class="fas fa-hospital text-muted mb-3" style="font-size: 3rem;"></i>
                    <h4 class="text-muted">No patients found</h4>
                    <p class="text-muted">No patients match the current filters or no data is available.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
