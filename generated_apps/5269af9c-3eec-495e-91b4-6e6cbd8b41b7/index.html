<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Vital Signs Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-heartbeat text-danger me-3 fs-4"></i>
                        <div>
                            <h1 class="mb-1">Vital Signs Dashboard</h1>
                            <p class="text-muted mb-0">Real-time monitoring of all patient vital signs</p>
                        </div>
                    </div>
                    <div class="stats-summary mt-3" id="statsContainer">
                        <!-- Stats will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Search and Filter -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="search-container">
                    <i class="fas fa-search text-muted"></i>
                    <input type="text" class="form-control" id="searchInput" placeholder="Search patients by name or vital sign...">
                </div>
            </div>
            <div class="col-md-6">
                <select class="form-select" id="filterSelect">
                    <option value="">All Vital Signs</option>
                    <option value="BP">Blood Pressure</option>
                    <option value="Temp">Temperature</option>
                    <option value="Glucose">Glucose</option>
                    <option value="Pain">Pain Scale</option>
                    <option value="Flow">Peak Flow</option>
                    <option value="Other">Other Measurements</option>
                </select>
            </div>
        </div>

        <!-- Patients Grid -->
        <div class="row" id="patientsContainer">
            <!-- Patient cards will be populated by JavaScript -->
        </div>

        <!-- No Data Message -->
        <div class="row" id="noDataMessage" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <i class="fas fa-chart-line text-muted mb-3"></i>
                    <h5 class="text-muted">No vital signs data available</h5>
                    <p class="text-muted mb-0">No patients found with vital signs matching your criteria.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
