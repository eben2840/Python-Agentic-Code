<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBAR Handover Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-clipboard-list text-primary me-3 fs-4"></i>
                        <h1 class="mb-0">SBAR Handover Summary</h1>
                    </div>
                    <div id="patient-header" class="patient-info">
                        <!-- Patient header will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Single Patient SBAR -->
                <div id="single-patient-sbar" class="d-none">
                    <div class="row g-4">
                        <!-- Situation -->
                        <div class="col-12 col-lg-6">
                            <div class="sbar-card situation-card">
                                <div class="sbar-header">
                                    <i class="fas fa-info-circle me-2"></i>
                                    <h3>Situation</h3>
                                </div>
                                <div id="situation-content" class="sbar-content">
                                    <!-- Populated by JavaScript -->
                                </div>
                            </div>
                        </div>

                        <!-- Background -->
                        <div class="col-12 col-lg-6">
                            <div class="sbar-card background-card">
                                <div class="sbar-header">
                                    <i class="fas fa-history me-2"></i>
                                    <h3>Background</h3>
                                </div>
                                <div id="background-content" class="sbar-content">
                                    <!-- Populated by JavaScript -->
                                </div>
                            </div>
                        </div>

                        <!-- Assessment -->
                        <div class="col-12 col-lg-6">
                            <div class="sbar-card assessment-card">
                                <div class="sbar-header">
                                    <i class="fas fa-stethoscope me-2"></i>
                                    <h3>Assessment</h3>
                                </div>
                                <div id="assessment-content" class="sbar-content">
                                    <!-- Populated by JavaScript -->
                                </div>
                            </div>
                        </div>

                        <!-- Recommendation -->
                        <div class="col-12 col-lg-6">
                            <div class="sbar-card recommendation-card">
                                <div class="sbar-header">
                                    <i class="fas fa-tasks me-2"></i>
                                    <h3>Recommendation</h3>
                                </div>
                                <div id="recommendation-content" class="sbar-content">
                                    <!-- Populated by JavaScript -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- All Patients Overview -->
                <div id="all-patients-overview" class="d-none">
                    <div class="alert alert-info mb-4">
                        <i class="fas fa-users me-2"></i>
                        <strong>Multi-Patient View:</strong> Select a specific patient to generate detailed SBAR handover summary.
                    </div>
                    
                    <div class="row">
                        <div class="col-12">
                            <div class="patients-grid">
                                <div id="patients-list" class="row g-3">
                                    <!-- Patient cards will be populated by JavaScript -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- No Data Message -->
                <div id="no-data-message" class="d-none">
                    <div class="alert alert-warning text-center">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        No patient data available for SBAR handover summary.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
