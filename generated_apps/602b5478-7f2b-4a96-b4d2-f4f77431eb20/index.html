<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Assessment Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="icon-circle me-3">
                                <i class="fas fa-clipboard-check text-teal"></i>
                            </div>
                            <div>
                                <h1 class="mb-1">Patient Assessment</h1>
                                <p class="text-muted mb-0" id="patientInfo">Loading patient information...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Assessment Form -->
                <form id="assessmentForm">
                    <div class="row">
                        <!-- Vital Signs -->
                        <div class="col-12 col-md-6 mb-4">
                            <div class="card h-100">
                                <div class="card-header">
                                    <h3><i class="fas fa-heartbeat text-danger me-2"></i>Vital Signs</h3>
                                </div>
                                <div class="card-body">
                                    <div class="row g-3">
                                        <div class="col-6">
                                            <label class="form-label">Blood Pressure</label>
                                            <div class="input-group">
                                                <input type="text" class="form-control" placeholder="120/80" name="bloodPressure">
                                                <span class="input-group-text">mmHg</span>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label">Heart Rate</label>
                                            <div class="input-group">
                                                <input type="number" class="form-control" placeholder="72" name="heartRate">
                                                <span class="input-group-text">bpm</span>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label">Temperature</label>
                                            <div class="input-group">
                                                <input type="number" class="form-control" placeholder="98.6" step="0.1" name="temperature">
                                                <span class="input-group-text">°F</span>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label">Oxygen Saturation</label>
                                            <div class="input-group">
                                                <input type="number" class="form-control" placeholder="98" name="oxygenSat">
                                                <span class="input-group-text">%</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Symptoms -->
                        <div class="col-12 col-md-6 mb-4">
                            <div class="card h-100">
                                <div class="card-header">
                                    <h3><i class="fas fa-stethoscope text-blue me-2"></i>Current Symptoms</h3>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label">Chief Complaint</label>
                                        <textarea class="form-control" rows="3" placeholder="Primary reason for visit..." name="chiefComplaint"></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Pain Level (0-10)</label>
                                        <input type="range" class="form-range" min="0" max="10" value="0" name="painLevel" id="painRange">
                                        <div class="d-flex justify-content-between">
                                            <small class="text-muted">No Pain</small>
                                            <span class="badge bg-light text-dark" id="painValue">0</span>
                                            <small class="text-muted">Severe</small>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Symptom Duration</label>
                                        <select class="form-select" name="symptomDuration">
                                            <option value="">Select duration...</option>
                                            <option value="hours">Hours</option>
                                            <option value="days">Days</option>
                                            <option value="weeks">Weeks</option>
                                            <option value="months">Months</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Physical Assessment -->
                        <div class="col-12 mb-4">
                            <div class="card">
                                <div class="card-header">
                                    <h3><i class="fas fa-user-md text-green me-2"></i>Physical Assessment</h3>
                                </div>
                                <div class="card-body">
                                    <div class="row g-3">
                                        <div class="col-12 col-md-4">
                                            <label class="form-label">General Appearance</label>
                                            <select class="form-select" name="appearance">
                                                <option value="">Select...</option>
                                                <option value="well-appearing">Well-appearing</option>
                                                <option value="ill-appearing">Ill-appearing</option>
                                                <option value="distressed">In distress</option>
                                                <option value="lethargic">Lethargic</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-4">
                                            <label class="form-label">Mental Status</label>
                                            <select class="form-select" name="mentalStatus">
                                                <option value="">Select...</option>
                                                <option value="alert">Alert & Oriented</option>
                                                <option value="confused">Confused</option>
                                                <option value="drowsy">Drowsy</option>
                                                <option value="unresponsive">Unresponsive</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-4">
                                            <label class="form-label">Mobility</label>
                                            <select class="form-select" name="mobility">
                                                <option value="">Select...</option>
                                                <option value="ambulatory">Ambulatory</option>
                                                <option value="assisted">Needs Assistance</option>
                                                <option value="wheelchair">Wheelchair</option>
                                                <option value="bedbound">Bedbound</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Assessment Notes -->
                        <div class="col-12 mb-4">
                            <div class="card">
                                <div class="card-header">
                                    <h3><i class="fas fa-notes-medical text-teal me-2"></i>Assessment Notes</h3>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label">Clinical Findings</label>
                                        <textarea class="form-control" rows="4" placeholder="Document clinical observations, examination findings..." name="clinicalFindings"></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Assessment Priority</label>
                                        <div class="d-flex gap-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="priority" value="routine" id="routine">
                                                <label class="form-check-label" for="routine">
                                                    <span class="badge bg-success-subtle text-success">Routine</span>
                                                </label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="priority" value="urgent" id="urgent">
                                                <label class="form-check-label" for="urgent">
                                                    <span class="badge bg-warning-subtle text-warning">Urgent</span>
                                                </label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="priority" value="critical" id="critical">
                                                <label class="form-check-label" for="critical">
                                                    <span class="badge bg-danger-subtle text-danger">Critical</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between">
                                        <button type="button" class="btn btn-outline-secondary">
                                            <i class="fas fa-save me-2"></i>Save Draft
                                        </button>
                                        <div>
                                            <button type="button" class="btn btn-outline-primary me-2">
                                                <i class="fas fa-eye me-2"></i>Preview
                                            </button>
                                            <button type="submit" class="btn btn-primary">
                                                <i class="fas fa-check me-2"></i>Complete Assessment
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
