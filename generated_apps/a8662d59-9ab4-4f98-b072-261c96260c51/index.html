<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Alert Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-2">
                        <i class="fas fa-exclamation-triangle text-danger me-3" style="font-size: 1.5rem;"></i>
                        <h1 class="mb-0">Emergency Alert Dashboard</h1>
                    </div>
                    <p class="text-muted mb-0">24-72 Hour Clinical Risk Assessment</p>
                    <div class="mt-3">
                        <span id="lastUpdated" class="badge bg-light text-dark">Last updated: Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="alert-summary-card">
                    <div class="row text-center">
                        <div class="col-md-3 col-6 mb-3 mb-md-0">
                            <div class="summary-item critical">
                                <i class="fas fa-skull-crossbones"></i>
                                <div class="count" id="criticalCount">0</div>
                                <div class="label">Critical</div>
                            </div>
                        </div>
                        <div class="col-md-3 col-6 mb-3 mb-md-0">
                            <div class="summary-item high">
                                <i class="fas fa-exclamation-circle"></i>
                                <div class="count" id="highCount">0</div>
                                <div class="label">High Risk</div>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="summary-item monitor">
                                <i class="fas fa-eye"></i>
                                <div class="count" id="monitorCount">0</div>
                                <div class="label">Monitor</div>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="summary-item stable">
                                <i class="fas fa-check-circle"></i>
                                <div class="count" id="stableCount">0</div>
                                <div class="label">Stable</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div id="alertsContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-3 text-muted">Analyzing patient data...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4" id="noAlertsMessage" style="display: none;">
            <div class="col-12">
                <div class="no-alerts-card">
                    <div class="text-center py-5">
                        <i class="fas fa-shield-alt text-success mb-3" style="font-size: 3rem;"></i>
                        <h3 class="text-success">No Active Emergencies</h3>
                        <p class="text-muted">All patients are currently stable with no urgent concerns identified for the next 24-72 hours.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
