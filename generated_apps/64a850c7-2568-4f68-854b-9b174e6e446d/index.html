<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Clinical Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Patient Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="patient-header">
                    <div class="d-flex align-items-center">
                        <div class="patient-avatar me-3">
                            <i class="fas fa-user-circle text-muted"></i>
                        </div>
                        <div>
                            <h4 class="patient-name mb-1" id="patientName">Loading...</h4>
                            <div class="patient-details text-muted">
                                <span id="patientGender">-</span> • 
                                <span id="patientAge">-</span> • 
                                ID: <span id="patientId">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="filter-section">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-filter text-primary me-2"></i>
                        <h6 class="mb-0 me-3">Filter Observations:</h6>
                        <select class="form-select form-select-sm" id="observationFilter" style="max-width: 300px;">
                            <option value="">All Observations</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Clinical Data Cards -->
        <div class="row g-4">
            <!-- Observations -->
            <div class="col-lg-6">
                <div class="clinical-card">
                    <div class="card-header">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-chart-line text-primary me-2"></i>
                            <h6 class="mb-0">Observations</h6>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="observationsContent">
                            <div class="loading-state">
                                <i class="fas fa-spinner fa-spin text-muted"></i>
                                <span class="ms-2 text-muted">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Medications -->
            <div class="col-lg-6">
                <div class="clinical-card">
                    <div class="card-header">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-pills text-warning me-2"></i>
                            <h6 class="mb-0">Medications</h6>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="medicationsContent">
                            <div class="loading-state">
                                <i class="fas fa-spinner fa-spin text-muted"></i>
                                <span class="ms-2 text-muted">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
