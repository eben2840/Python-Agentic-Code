<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Assessment & Admissions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-clipboard-check text-primary me-3" style="font-size: 2rem;"></i>
                        <div>
                            <h1 class="mb-1">Patient Assessment & Admissions</h1>
                            <p class="text-muted mb-0">Assessment form and admission records (Jan-Mar 2026)</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Assessment Form -->
            <div class="col-lg-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-stethoscope me-2 text-teal"></i>
                            Patient Assessment Form
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="assessmentForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="patientSelect" class="form-label">Select Patient</label>
                                    <select class="form-select" id="patientSelect" required>
                                        <option value="">Choose patient...</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="assessmentDate" class="form-label">Assessment Date</label>
                                    <input type="date" class="form-control" id="assessmentDate" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="chiefComplaint" class="form-label">Chief Complaint</label>
                                <textarea class="form-control" id="chiefComplaint" rows="2" placeholder="Primary reason for visit"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="bloodPressure" class="form-label">Blood Pressure</label>
                                    <input type="text" class="form-control" id="bloodPressure" placeholder="120/80">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="heartRate" class="form-label">Heart Rate</label>
                                    <input type="number" class="form-control" id="heartRate" placeholder="72">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="temperature" class="form-label">Temperature (°C)</label>
                                    <input type="number" step="0.1" class="form-control" id="temperature" placeholder="36.5">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="painScale" class="form-label">Pain Scale (0-10)</label>
                                    <select class="form-select" id="painScale">
                                        <option value="">Select...</option>
                                        <option value="0">0 - No pain</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6">6</option>
                                        <option value="7">7</option>
                                        <option value="8">8</option>
                                        <option value="9">9</option>
                                        <option value="10">10 - Worst pain</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="consciousnessLevel" class="form-label">Consciousness Level</label>
                                    <select class="form-select" id="consciousnessLevel">
                                        <option value="">Select...</option>
                                        <option value="alert">Alert</option>
                                        <option value="drowsy">Drowsy</option>
                                        <option value="confused">Confused</option>
                                        <option value="unconscious">Unconscious</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="clinicalNotes" class="form-label">Clinical Notes</label>
                                <textarea class="form-control" id="clinicalNotes" rows="3" placeholder="Assessment findings and observations"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="riskLevel" class="form-label">Risk Level</label>
                                <select class="form-select" id="riskLevel">
                                    <option value="">Select risk level...</option>
                                    <option value="low">Low Risk</option>
                                    <option value="moderate">Moderate Risk</option>
                                    <option value="high">High Risk</option>
                                    <option value="critical">Critical</option>
                                </select>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>Save Assessment
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Admissions List -->
            <div class="col-lg-6 mb-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-hospital me-2 text-blue"></i>
                            Admissions (Jan-Mar 2026)
                        </h5>
                        <span class="badge bg-primary" id="admissionCount">0</span>
                    </div>
                    <div class="card-body">
                        <div id="admissionsList">
                            <div class="text-center text-muted py-4">
                                <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                                <p>Loading admission records...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient Summary Cards -->
        <div class="row" id="patientSummaryCards">
            <!-- Dynamic patient cards will be inserted here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
