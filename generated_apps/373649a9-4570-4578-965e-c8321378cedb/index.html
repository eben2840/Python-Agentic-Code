<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT Patients Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center">
                        <div class="icon-wrapper me-3">
                            <i class="fas fa-stethoscope"></i>
                        </div>
                        <div>
                            <h1 class="mb-1">ENT Patients Dashboard</h1>
                            <p class="text-muted mb-0">Ear, Nose & Throat Specialty Patients</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Stats -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex align-items-center">
                        <div class="stat-icon me-3">
                            <i class="fas fa-users"></i>
                        </div>
                        <div>
                            <div class="stat-number" id="totalPatients">0</div>
                            <div class="stat-label">Total ENT Patients</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex align-items-center">
                        <div class="stat-icon me-3">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div>
                            <div class="stat-number" id="activeConditions">0</div>
                            <div class="stat-label">Active Conditions</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex align-items-center">
                        <div class="stat-icon me-3">
                            <i class="fas fa-pills"></i>
                        </div>
                        <div>
                            <div class="stat-number" id="activeMedications">0</div>
                            <div class="stat-label">Active Medications</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex align-items-center">
                        <div class="stat-icon me-3">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div>
                            <div class="stat-number" id="recentObservations">0</div>
                            <div class="stat-label">Recent Observations</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patients List -->
        <div class="row">
            <div class="col-12">
                <div class="patients-card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-list-ul me-2"></i>
                            ENT Patient Registry
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="patientsContainer">
                            <!-- Patients will be loaded here -->
                        </div>
                        <div id="noDataMessage" class="text-center py-5" style="display: none;">
                            <i class="fas fa-search text-muted mb-3" style="font-size: 3rem;"></i>
                            <h5 class="text-muted">No ENT patients found</h5>
                            <p class="text-muted">No patients with ENT-related conditions are currently in the system.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
