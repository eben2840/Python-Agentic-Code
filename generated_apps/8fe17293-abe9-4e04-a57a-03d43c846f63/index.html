<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagerungsplan - Patient Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-bed text-teal me-3 fs-4"></i>
                            <div>
                                <h1 class="h4 mb-1">Lagerungsplan</h1>
                                <p class="text-muted mb-0" id="patientInfo">Lade Patientendaten...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Single Patient View -->
        <div id="singlePatientView" class="d-none">
            <!-- Current Position Status -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="fas fa-clock text-blue me-2"></i>
                                Aktuelle Lagerung
                            </h5>
                            <div id="currentPosition" class="mt-3">
                                <div class="alert alert-info">
                                    <i class="fas fa-info-circle me-2"></i>
                                    Keine aktuellen Lagerungsdaten verfügbar
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Positioning Schedule -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="card-title mb-0">
                                    <i class="fas fa-calendar-alt text-green me-2"></i>
                                    Lagerungsplan
                                </h5>
                                <button class="btn btn-outline-primary btn-sm" id="addPositionBtn">
                                    <i class="fas fa-plus me-1"></i>
                                    Position hinzufügen
                                </button>
                            </div>
                            <div id="positioningSchedule">
                                <!-- Schedule will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Risk Assessment -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="fas fa-exclamation-triangle text-warning me-2"></i>
                                Risikobewertung
                            </h5>
                            <div id="riskAssessment">
                                <div class="text-muted">Keine Risikodaten verfügbar</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="fas fa-notes-medical text-teal me-2"></i>
                                Besondere Hinweise
                            </h5>
                            <div id="specialNotes">
                                <div class="text-muted">Keine besonderen Hinweise</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- All Patients View -->
        <div id="allPatientsView" class="d-none">
            <div class="row mb-3">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Alle Patienten - Lagerungsübersicht</h5>
                                <div class="d-flex gap-2">
                                    <select class="form-select form-select-sm" id="riskFilter" style="width: auto;">
                                        <option value="">Alle Risikostufen</option>
                                        <option value="high">Hohes Risiko</option>
                                        <option value="medium">Mittleres Risiko</option>
                                        <option value="low">Niedriges Risiko</option>
                                    </select>
                                    <select class="form-select form-select-sm" id="conditionFilter" style="width: auto;">
                                        <option value="">Alle Diagnosen</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row" id="patientsGrid">
                <!-- Patient cards will be populated by JavaScript -->
            </div>
        </div>

        <!-- Add Position Modal -->
        <div class="modal fade" id="addPositionModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="fas fa-bed me-2"></i>
                            Neue Lagerung hinzufügen
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="positionForm">
                            <div class="mb-3">
                                <label class="form-label">Lagerungsposition</label>
                                <select class="form-select" id="positionType" required>
                                    <option value="">Position wählen...</option>
                                    <option value="supine">Rückenlage</option>
                                    <option value="prone">Bauchlage</option>
                                    <option value="left-lateral">Linksseitenlage</option>
                                    <option value="right-lateral">Rechtsseitenlage</option>
                                    <option value="semi-fowler">Semi-Fowler</option>
                                    <option value="fowler">Fowler-Lagerung</option>
                                    <option value="trendelenburg">Trendelenburg</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Zeitpunkt</label>
                                <input type="datetime-local" class="form-control" id="positionTime" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Dauer (Minuten)</label>
                                <input type="number" class="form-control" id="positionDuration" min="15" max="480" value="120">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Hilfsmittel</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="pillows">
                                    <label class="form-check-label" for="pillows">Kissen</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="wedges">
                                    <label class="form-check-label" for="wedges">Lagerungskeile</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="mattress">
                                    <label class="form-check-label" for="mattress">Spezialmatratze</label>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Notizen</label>
                                <textarea class="form-control" id="positionNotes" rows="3"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                        <button type="button" class="btn btn-primary" id="savePositionBtn">
                            <i class="fas fa-save me-1"></i>
                            Speichern
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
