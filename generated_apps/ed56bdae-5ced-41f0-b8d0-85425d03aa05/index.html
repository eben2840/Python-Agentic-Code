<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Count Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body text-center py-4">
                        <div class="icon-large mb-3">
                            <i class="fas fa-hospital text-primary"></i>
                        </div>
                        <h1 class="h3 mb-2">Ward Count Dashboard</h1>
                        <p class="text-muted">Overview of hospital wards and patient distribution</p>
                    </div>
                </div>

                <!-- Ward Summary Card -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-auto">
                                <div class="icon-circle bg-primary-light">
                                    <i class="fas fa-building text-primary"></i>
                                </div>
                            </div>
                            <div class="col">
                                <h5 class="mb-1">Total Wards</h5>
                                <div class="ward-count-display">
                                    <span id="totalWards" class="h2 text-primary mb-0">0</span>
                                    <span class="text-muted ms-2">active wards</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ward Details -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-list-ul me-2"></i>
                            Ward Details
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="wardsList" class="row g-3">
                            <!-- Ward items will be populated here -->
                        </div>
                        <div id="noWardsMessage" class="text-center py-4 d-none">
                            <i class="fas fa-info-circle text-muted mb-2" style="font-size: 2rem;"></i>
                            <p class="text-muted mb-0">No ward data available</p>
                        </div>
                    </div>
                </div>

                <!-- Patient Distribution -->
                <div class="card mt-4">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-users me-2"></i>
                            Patient Distribution by Ward
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="patientDistribution" class="row g-3">
                            <!-- Patient distribution will be populated here -->
                        </div>
                        <div id="noPatientData" class="text-center py-4 d-none">
                            <i class="fas fa-user-slash text-muted mb-2" style="font-size: 2rem;"></i>
                            <p class="text-muted mb-0">No patient location data available</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
