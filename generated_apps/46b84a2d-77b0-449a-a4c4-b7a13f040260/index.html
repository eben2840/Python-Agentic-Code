<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Location - Rose Hall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="patient-avatar me-3">
                                <i class="fas fa-user-circle text-muted"></i>
                            </div>
                            <div>
                                <h4 class="mb-1" id="patientName">Loading...</h4>
                                <p class="text-muted mb-0" id="patientInfo">Loading patient information...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Location Information -->
                <div class="card mb-4">
                    <div class="card-header bg-white border-bottom">
                        <h5 class="mb-0">
                            <i class="fas fa-map-marker-alt text-primary me-2"></i>
                            Current Location
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="location-item">
                                    <div class="location-icon">
                                        <i class="fas fa-hospital text-teal"></i>
                                    </div>
                                    <div class="location-details">
                                        <h6 class="mb-1">Ward</h6>
                                        <p class="mb-0" id="wardInfo">No data available</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="location-item">
                                    <div class="location-icon">
                                        <i class="fas fa-door-open text-blue"></i>
                                    </div>
                                    <div class="location-details">
                                        <h6 class="mb-1">Room</h6>
                                        <p class="mb-0" id="roomInfo">No data available</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Current Encounter -->
                <div class="card mb-4">
                    <div class="card-header bg-white border-bottom">
                        <h5 class="mb-0">
                            <i class="fas fa-calendar-check text-green me-2"></i>
                            Current Encounter
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="encounterInfo">
                            <div class="d-flex justify-content-center py-4">
                                <div class="spinner-border text-muted" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Additional Context -->
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h5 class="mb-0">
                            <i class="fas fa-info-circle text-muted me-2"></i>
                            Additional Information
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="additionalInfo">
                            <p class="text-muted mb-0">Loading additional context...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
