<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Patient Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="patient-avatar me-3">
                                <i class="fas fa-user-circle text-muted"></i>
                            </div>
                            <div>
                                <h1 class="mb-1" id="patientName">Loading...</h1>
                                <p class="text-muted mb-0" id="patientInfo">Patient ID: Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard Grid -->
        <div class="row g-4">
            <!-- Conditions -->
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-stethoscope text-danger me-2"></i>
                            <h2 class="mb-0">Conditions</h2>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="conditionsContainer">
                            <div class="text-center text-muted py-3">
                                <i class="fas fa-spinner fa-spin"></i>
                                <p class="mb-0 mt-2">Loading conditions...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Medications -->
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-pills text-primary me-2"></i>
                            <h2 class="mb-0">Medications</h2>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="medicationsContainer">
                            <div class="text-center text-muted py-3">
                                <i class="fas fa-spinner fa-spin"></i>
                                <p class="mb-0 mt-2">Loading medications...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Observations -->
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-chart-line text-success me-2"></i>
                            <h2 class="mb-0">Recent Observations</h2>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="observationsContainer">
                            <div class="text-center text-muted py-3">
                                <i class="fas fa-spinner fa-spin"></i>
                                <p class="mb-0 mt-2">Loading observations...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
