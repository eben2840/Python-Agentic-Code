<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalTrack Pro - Elias Abbott</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="container-fluid">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-heartbeat header-icon me-3"></i>
                            <div>
                                <h1 class="app-title mb-0">VitalTrack Pro</h1>
                                <p class="patient-info mb-0">Elias Abbott • ID: 851a7b59</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 text-end">
                        <div class="header-actions">
                            <button class="btn btn-outline-light me-2" id="exportBtn">
                                <i class="fas fa-download me-2"></i>Export
                            </button>
                            <button class="btn btn-light" id="shareBtn">
                                <i class="fas fa-share-alt me-2"></i>Share
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="container-fluid main-content">
            <div class="row">
                <!-- Sidebar -->
                <div class="col-lg-3 sidebar">
                    <!-- Time Range Selector -->
                    <div class="card control-card mb-4">
                        <div class="card-header">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-clock me-2"></i>Time Range
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Quick Select</label>
                                <div class="btn-group-vertical w-100" role="group">
                                    <button type="button" class="btn btn-outline-primary time-btn active" data-range="24h">Last 24 Hours</button>
                                    <button type="button" class="btn btn-outline-primary time-btn" data-range="7d">Last Week</button>
                                    <button type="button" class="btn btn-outline-primary time-btn" data-range="30d">Last Month</button>
                                    <button type="button" class="btn btn-outline-primary time-btn" data-range="90d">Last 3 Months</button>
                                    <button type="button" class="btn btn-outline-primary time-btn" data-range="1y">Last Year</button>
                                </div>
                            </div>
                            <div class="custom-range">
                                <label class="form-label">Custom Range</label>
                                <div class="row">
                                    <div class="col-6">
                                        <input type="date" class="form-control form-control-sm" id="startDate">
                                    </div>
                                    <div class="col-6">
                                        <input type="date" class="form-control form-control-sm" id="endDate">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Vital Signs Toggle -->
                    <div class="card control-card mb-4">
                        <div class="card-header">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-eye me-2"></i>Vital Signs
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="vital-toggle mb-2">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="bloodPressure" checked>
                                    <label class="form-check-label" for="bloodPressure">
                                        <span class="vital-indicator bp"></span>Blood Pressure
                                    </label>
                                </div>
                            </div>
                            <div class="vital-toggle mb-2">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="heartRate" checked>
                                    <label class="form-check-label" for="heartRate">
                                        <span class="vital-indicator hr"></span>Heart Rate
                                    </label>
                                </div>
                            </div>
                            <div class="vital-toggle mb-2">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="temperature" checked>
                                    <label class="form-check-label" for="temperature">
                                        <span class="vital-indicator temp"></span>Temperature
                                    </label>
                                </div>
                            </div>
                            <div class="vital-toggle mb-2">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="respiratory" checked>
                                    <label class="form-check-label" for="respiratory">
                                        <span class="vital-indicator resp"></span>Respiratory Rate
                                    </label>
                                </div>
                            </div>
                            <div class="vital-toggle">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="oxygen" checked>
                                    <label class="form-check-label" for="oxygen">
                                        <span class="vital-indicator o2"></span>Oxygen Saturation
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Alert Status -->
                    <div class="card alert-card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-exclamation-triangle me-2"></i>Alert Status
                            </h5>
                        </div>
                        <div class="card-body">
                            <div id="alertList">
                                <!-- Alerts will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Main Chart Area -->
                <div class="col-lg-9 chart-area">
                    <!-- Chart Controls -->
                    <div class="chart-controls mb-3">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <h3 class="chart-title mb-0">Vital Signs Monitoring</h3>
                                <p class="chart-subtitle mb-0">Real-time and historical vital sign patterns</p>
                            </div>
                            <div class="col-md-6 text-end">
                                <div class="btn-group" role="group">
                                    <button type="button" class="btn btn-outline-secondary btn-sm" id="zoomIn">
                                        <i class="fas fa-search-plus"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm" id="zoomOut">
                                        <i class="fas fa-search-minus"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm" id="resetZoom">
                                        <i class="fas fa-expand-arrows-alt"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Main Chart -->
                    <div class="card chart-card">
                        <div class="card-body">
                            <div class="chart-container">
                                <canvas id="vitalSignsChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Trend Analysis Panel -->
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card trend-card">
                                <div class="card-header">
                                    <h5 class="card-title mb-0">
                                        <i class="fas fa-chart-line me-2"></i>Trend Analysis
                                    </h5>
                                </div>
                                <div class="card-body">
                                    <div class="row" id="trendStats">
                                        <!-- Trend statistics will be populated by JavaScript -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3">Loading vital signs data...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
