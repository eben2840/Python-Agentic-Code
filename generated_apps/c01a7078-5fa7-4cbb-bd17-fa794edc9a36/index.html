<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Patient Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-hospital-alt text-primary me-3" style="font-size: 2rem;"></i>
                        <div>
                            <h1 class="mb-1">Ward Patient Management</h1>
                            <p class="text-muted mb-0">Patient conditions organized by ward location</p>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-item">
                            <i class="fas fa-building text-teal"></i>
                            <div>
                                <div class="stat-number" id="totalWards">0</div>
                                <div class="stat-label">Wards</div>
                            </div>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-users text-blue"></i>
                            <div>
                                <div class="stat-number" id="totalPatients">0</div>
                                <div class="stat-label">Patients</div>
                            </div>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-clipboard-list text-green"></i>
                            <div>
                                <div class="stat-number" id="totalConditions">0</div>
                                <div class="stat-label">Conditions</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="wardsContainer">
            <!-- Ward cards will be dynamically inserted here -->
        </div>

        <div class="row" id="noDataContainer" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <i class="fas fa-hospital text-muted mb-3" style="font-size: 3rem;"></i>
                    <h3>No Ward Data Available</h3>
                    <p class="text-muted">No patient location or ward information found in the current dataset.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
