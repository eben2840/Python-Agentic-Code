<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Conditions & Observations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-user-md text-primary me-3"></i>
                        <div>
                            <h1 class="mb-0" id="patientName">Loading...</h1>
                            <p class="text-muted mb-0" id="patientInfo">Loading patient information...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Conditions Section -->
            <div class="col-lg-6">
                <div class="data-card">
                    <div class="card-header">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-stethoscope text-danger me-2"></i>
                            <h5 class="mb-0">Medical Conditions</h5>
                            <span class="badge bg-light text-dark ms-auto" id="conditionsCount">0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="conditionsList">
                            <div class="text-center py-4">
                                <i class="fas fa-spinner fa-spin text-muted"></i>
                                <p class="text-muted mt-2">Loading conditions...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Observations Section -->
            <div class="col-lg-6">
                <div class="data-card">
                    <div class="card-header">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-chart-line text-success me-2"></i>
                            <h5 class="mb-0">Clinical Observations</h5>
                            <span class="badge bg-light text-dark ms-auto" id="observationsCount">0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="observationsList">
                            <div class="text-center py-4">
                                <i class="fas fa-spinner fa-spin text-muted"></i>
                                <p class="text-muted mt-2">Loading observations...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- All Patients View -->
        <div class="row" id="allPatientsView" style="display: none;">
            <div class="col-12">
                <div class="data-card">
                    <div class="card-header">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-users text-primary me-2"></i>
                            <h5 class="mb-0">All Patients - Conditions & Observations</h5>
                            <span class="badge bg-light text-dark ms-auto" id="totalPatientsCount">0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="allPatientsList">
                            <div class="text-center py-4">
                                <i class="fas fa-spinner fa-spin text-muted"></i>
                                <p class="text-muted mt-2">Loading all patients...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
