<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Locations Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body text-center py-4">
                        <div class="icon-large mb-3">
                            <i class="fas fa-map-marker-alt text-teal"></i>
                        </div>
                        <h1 class="h3 mb-2">Hospital Locations Overview</h1>
                        <p class="text-muted mb-0">Complete inventory of all hospital locations and facilities</p>
                    </div>
                </div>

                <!-- Summary Stats -->
                <div class="row mb-4">
                    <div class="col-md-4 mb-3">
                        <div class="card stat-card">
                            <div class="card-body text-center">
                                <div class="stat-icon mb-2">
                                    <i class="fas fa-building text-blue"></i>
                                </div>
                                <h3 class="h4 mb-1" id="total-locations">0</h3>
                                <p class="text-muted mb-0 small">Total Locations</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card stat-card">
                            <div class="card-body text-center">
                                <div class="stat-icon mb-2">
                                    <i class="fas fa-hospital text-green"></i>
                                </div>
                                <h3 class="h4 mb-1" id="active-locations">0</h3>
                                <p class="text-muted mb-0 small">Active Locations</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card stat-card">
                            <div class="card-body text-center">
                                <div class="stat-icon mb-2">
                                    <i class="fas fa-door-open text-teal"></i>
                                </div>
                                <h3 class="h4 mb-1" id="unique-wards">0</h3>
                                <p class="text-muted mb-0 small">Unique Wards</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Locations List -->
                <div class="card">
                    <div class="card-header d-flex align-items-center justify-content-between">
                        <h5 class="mb-0">
                            <i class="fas fa-list me-2 text-teal"></i>
                            All Hospital Locations
                        </h5>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-secondary" id="sort-name">
                                <i class="fas fa-sort-alpha-down me-1"></i>Name
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" id="sort-ward">
                                <i class="fas fa-sort me-1"></i>Ward
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="border-0 ps-4">
                                            <i class="fas fa-map-marker-alt me-2 text-muted"></i>
                                            Location Name
                                        </th>
                                        <th class="border-0">
                                            <i class="fas fa-hospital me-2 text-muted"></i>
                                            Ward/Department
                                        </th>
                                        <th class="border-0">
                                            <i class="fas fa-info-circle me-2 text-muted"></i>
                                            Status
                                        </th>
                                    </tr>
                                </thead>
                                <tbody id="locations-table-body">
                                    <!-- Locations will be populated here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- No Data Message -->
                <div class="card d-none" id="no-data-card">
                    <div class="card-body text-center py-5">
                        <div class="icon-large mb-3 text-muted">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <h5 class="text-muted">No Location Data Available</h5>
                        <p class="text-muted mb-0">Unable to load hospital location information at this time.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
