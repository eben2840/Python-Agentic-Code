<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Room Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="mb-1"><i class="fas fa-hospital-alt text-danger me-2"></i>Emergency Room</h1>
                        <p class="text-muted mb-0">Real-time patient monitoring and vital signs</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-primary btn-sm" onclick="refreshPatients()">
                            <i class="fas fa-sync-alt me-1"></i>Refresh
                        </button>
                        <span class="badge bg-light text-dark px-3 py-2">
                            <i class="fas fa-users me-1"></i><span id="patientCount">0</span> Patients
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Emergency Info Form -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h3 class="mb-0"><i class="fas fa-exclamation-triangle text-warning me-2"></i>Emergency Information</h3>
                    </div>
                    <div class="card-body">
                        <form id="emergencyForm">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">Emergency Type</label>
                                    <select class="form-select" id="emergencyType" required>
                                        <option value="">Select type...</option>
                                        <option value="cardiac">Cardiac Emergency</option>
                                        <option value="respiratory">Respiratory Distress</option>
                                        <option value="trauma">Trauma</option>
                                        <option value="neurological">Neurological</option>
                                        <option value="poisoning">Poisoning</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Priority Level</label>
                                    <select class="form-select" id="priorityLevel" required>
                                        <option value="">Select priority...</option>
                                        <option value="critical">Critical (Red)</option>
                                        <option value="urgent">Urgent (Yellow)</option>
                                        <option value="standard">Standard (Green)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Attending Physician</label>
                                    <input type="text" class="form-control" id="attendingPhysician" placeholder="Dr. Name" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Emergency Notes</label>
                                    <textarea class="form-control" id="emergencyNotes" rows="3" placeholder="Describe the emergency situation..."></textarea>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-danger">
                                        <i class="fas fa-save me-1"></i>Save Emergency Info
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vital Signs Capture -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h3 class="mb-0"><i class="fas fa-heartbeat text-danger me-2"></i>Vital Signs Capture</h3>
                    </div>
                    <div class="card-body">
                        <form id="vitalSignsForm">
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label class="form-label">Blood Pressure</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="systolic" placeholder="120">
                                        <span class="input-group-text">/</span>
                                        <input type="number" class="form-control" id="diastolic" placeholder="80">
                                        <span class="input-group-text">mmHg</span>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Heart Rate</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="heartRate" placeholder="72">
                                        <span class="input-group-text">bpm</span>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Temperature</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="temperature" placeholder="98.6" step="0.1">
                                        <span class="input-group-text">°F</span>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Oxygen Saturation</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="oxygenSat" placeholder="98">
                                        <span class="input-group-text">%</span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Respiratory Rate</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="respiratoryRate" placeholder="16">
                                        <span class="input-group-text">breaths/min</span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Pain Scale (0-10)</label>
                                    <input type="range" class="form-range" id="painScale" min="0" max="10" value="0" oninput="updatePainValue(this.value)">
                                    <div class="d-flex justify-content-between">
                                        <small>No Pain</small>
                                        <span id="painValue" class="badge bg-light text-dark">0</span>
                                        <small>Severe</small>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-plus me-1"></i>Record Vital Signs
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient List -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h3 class="mb-0"><i class="fas fa-users text-primary me-2"></i>Emergency Room Patients</h3>
                    </div>
                    <div class="card-body p-0">
                        <div id="patientsList" class="table-responsive">
                            <div class="text-center py-5">
                                <i class="fas fa-spinner fa-spin text-muted fa-2x mb-3"></i>
                                <p class="text-muted">Loading patient data...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
