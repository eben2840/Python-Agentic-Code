<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Emergency Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-exclamation-triangle text-warning me-3" style="font-size: 2rem;"></i>
                        <div>
                            <h1 class="mb-1">Clinical Emergency Review</h1>
                            <p class="text-muted mb-0">24-72 hour urgent concern assessment</p>
                        </div>
                    </div>
                    <div class="mt-3">
                        <span class="badge bg-danger me-2">Critical</span>
                        <span class="badge bg-warning me-2">High</span>
                        <span class="badge bg-info">Monitor</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div id="emergency-alerts" class="emergency-container">
                    <!-- Emergency alerts will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="summary-card">
                    <h5 class="mb-3"><i class="fas fa-chart-bar me-2"></i>Summary</h5>
                    <div class="row">
                        <div class="col-md-3 col-6">
                            <div class="stat-item">
                                <div class="stat-number text-danger" id="critical-count">0</div>
                                <div class="stat-label">Critical</div>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-item">
                                <div class="stat-number text-warning" id="high-count">0</div>
                                <div class="stat-label">High Priority</div>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-item">
                                <div class="stat-number text-info" id="monitor-count">0</div>
                                <div class="stat-label">Monitor</div>
                            </div>
                        </div>
                        <div class="col-md-3 col-6">
                            <div class="stat-item">
                                <div class="stat-number text-success" id="total-reviewed">0</div>
                                <div class="stat-label">Total Reviewed</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
