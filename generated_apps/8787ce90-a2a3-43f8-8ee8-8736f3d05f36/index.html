<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Care Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="container-fluid">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h1 class="dashboard-title">
                            <i class="fas fa-heartbeat me-2"></i>
                            Critical Care Dashboard
                        </h1>
                    </div>
                    <div class="col-md-6 text-end">
                        <div class="patient-count-badge">
                            <i class="fas fa-users me-1"></i>
                            <span id="totalPatients">0</span> Patients Under Care
                        </div>
                        <button class="btn btn-outline-primary btn-sm ms-2" id="refreshBtn">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Filters and Controls -->
        <div class="filters-section">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-8">
                        <div class="filter-controls">
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-search"></i>
                                </span>
                                <input type="text" class="form-control" id="searchInput" placeholder="Search by patient name or condition...">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="sort-controls">
                            <select class="form-select" id="sortSelect">
                                <option value="severity">Sort by Severity</option>
                                <option value="name">Sort by Name</option>
                                <option value="date">Sort by Last Encounter</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="container-fluid">
                <!-- Summary Cards -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="summary-card critical">
                            <div class="summary-icon">
                                <i class="fas fa-exclamation-triangle"></i>
                            </div>
                            <div class="summary-content">
                                <h3 id="criticalCount">0</h3>
                                <p>Critical Conditions</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="summary-card serious">
                            <div class="summary-icon">
                                <i class="fas fa-exclamation-circle"></i>
                            </div>
                            <div class="summary-content">
                                <h3 id="seriousCount">0</h3>
                                <p>Serious Conditions</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="summary-card monitoring">
                            <div class="summary-icon">
                                <i class="fas fa-eye"></i>
                            </div>
                            <div class="summary-content">
                                <h3 id="monitoringCount">0</h3>
                                <p>Monitoring Required</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="summary-card active-meds">
                            <div class="summary-icon">
                                <i class="fas fa-pills"></i>
                            </div>
                            <div class="summary-content">
                                <h3 id="activeMedsCount">0</h3>
                                <p>Active Medications</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Patient Grid -->
                <div class="patient-grid" id="patientGrid">
                    <!-- Patient cards will be dynamically generated here -->
                </div>

                <!-- No Data Message -->
                <div class="no-data-message" id="noDataMessage" style="display: none;">
                    <div class="text-center py-5">
                        <i class="fas fa-clipboard-list fa-3x text-muted mb-3"></i>
                        <h4 class="text-muted">No Critical Care Patients Found</h4>
                        <p class="text-muted">No patients with serious conditions are currently in the system.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Patient Detail Modal -->
    <div class="modal fade" id="patientModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalPatientName">Patient Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- Patient details will be populated here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Schedule Follow-up</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
