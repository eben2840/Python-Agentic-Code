<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missing Care Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h1 class="page-title mb-1">
                                <i class="fas fa-exclamation-triangle text-warning me-2"></i>
                                Missing Care Overview
                            </h1>
                            <p class="text-muted mb-0">Care activities not completed yesterday</p>
                        </div>
                        <div class="date-badge">
                            <i class="fas fa-calendar-day me-1"></i>
                            <span id="yesterdayDate"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="d-flex align-items-center">
                        <div class="summary-icon bg-danger">
                            <i class="fas fa-times"></i>
                        </div>
                        <div>
                            <div class="summary-number" id="totalMissing">0</div>
                            <div class="summary-label">Total Missing</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="d-flex align-items-center">
                        <div class="summary-icon bg-warning">
                            <i class="fas fa-user-injured"></i>
                        </div>
                        <div>
                            <div class="summary-number" id="affectedPatients">0</div>
                            <div class="summary-label">Affected Patients</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="d-flex align-items-center">
                        <div class="summary-icon bg-info">
                            <i class="fas fa-pills"></i>
                        </div>
                        <div>
                            <div class="summary-number" id="missedMedications">0</div>
                            <div class="summary-label">Missed Medications</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="d-flex align-items-center">
                        <div class="summary-icon bg-secondary">
                            <i class="fas fa-stethoscope"></i>
                        </div>
                        <div>
                            <div class="summary-number" id="missedObservations">0</div>
                            <div class="summary-label">Missed Observations</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="filter-card">
                    <div class="row align-items-center">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label class="form-label">Filter by Care Type</label>
                                <select class="form-select" id="careTypeFilter">
                                    <option value="">All Care Types</option>
                                    <option value="medication">Medications</option>
                                    <option value="observation">Observations</option>
                                    <option value="vital_signs">Vital Signs</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label class="form-label">Priority Level</label>
                                <select class="form-select" id="priorityFilter">
                                    <option value="">All Priorities</option>
                                    <option value="high">High Priority</option>
                                    <option value="medium">Medium Priority</option>
                                    <option value="low">Low Priority</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label class="form-label">Search Patient</label>
                                <input type="text" class="form-control" id="patientSearch" placeholder="Search by patient name...">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Missing Care List -->
        <div class="row">
            <div class="col-12">
                <div class="main-card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-list-ul me-2"></i>
                            Missing Care Activities
                        </h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="missingCareList">
                            <!-- Missing care items will be populated here -->
                        </div>
                        <div id="noDataMessage" class="text-center py-5" style="display: none;">
                            <i class="fas fa-check-circle text-success mb-3" style="font-size: 3rem;"></i>
                            <h5>No Missing Care Activities</h5>
                            <p class="text-muted">All care activities were completed yesterday or no data available.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
