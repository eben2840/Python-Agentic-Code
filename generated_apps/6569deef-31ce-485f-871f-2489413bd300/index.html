<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Management Assessment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-shield-alt text-danger me-3" style="font-size: 2rem;"></i>
                        <div>
                            <h1 class="mb-0">Risk Management Assessment</h1>
                            <p class="text-muted mb-0">Critical Condition Monitoring & Risk Analysis</p>
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <div class="stat-card bg-danger">
                                <div class="stat-value" id="criticalCount">0</div>
                                <div class="stat-label">Critical Patients</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card bg-warning">
                                <div class="stat-value" id="highRiskCount">0</div>
                                <div class="stat-label">High Risk</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card bg-info">
                                <div class="stat-value" id="moderateRiskCount">0</div>
                                <div class="stat-label">Moderate Risk</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card bg-success">
                                <div class="stat-value" id="lowRiskCount">0</div>
                                <div class="stat-label">Low Risk</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="assessment-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2><i class="fas fa-users me-2"></i>Patient Risk Assessments</h2>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-primary active" id="allFilter">All</button>
                            <button type="button" class="btn btn-outline-danger" id="criticalFilter">Critical</button>
                            <button type="button" class="btn btn-outline-warning" id="highFilter">High Risk</button>
                        </div>
                    </div>
                    <div id="patientsContainer" class="row g-4">
                        <!-- Patient cards will be dynamically generated here -->
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="assessment-card">
                    <h2 class="mb-4"><i class="fas fa-chart-line me-2"></i>Risk Distribution Analysis</h2>
                    <div id="riskAnalysis" class="risk-analysis-container">
                        <!-- Risk analysis will be generated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
