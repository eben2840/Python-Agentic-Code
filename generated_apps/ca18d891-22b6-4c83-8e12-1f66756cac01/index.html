<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Observations - John Smith</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="patient-avatar me-3">
                                <i class="fas fa-user-circle text-muted"></i>
                            </div>
                            <div>
                                <h4 class="mb-1" id="patientName">Loading...</h4>
                                <div class="text-muted small" id="patientInfo">
                                    <span id="patientGender"></span> • <span id="patientAge"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Observations Section -->
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-chart-line text-primary me-2"></i>
                            <h5 class="mb-0">Observations</h5>
                            <span class="badge bg-light text-dark ms-2" id="observationCount">0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="observationsContainer">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- No Data Message -->
                <div id="noDataMessage" class="card mt-4" style="display: none;">
                    <div class="card-body text-center py-5">
                        <i class="fas fa-info-circle text-muted mb-3" style="font-size: 2rem;"></i>
                        <h6 class="text-muted">No observations available</h6>
                        <p class="text-muted small mb-0">No observation data found for this patient.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
