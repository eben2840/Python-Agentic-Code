<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT Ward Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-hospital-user text-primary me-3"></i>
                        <h1 class="mb-0">ENT Ward Dashboard</h1>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6 col-lg-3">
                            <div class="stat-card">
                                <div class="stat-icon">
                                    <i class="fas fa-users"></i>
                                </div>
                                <div class="stat-content">
                                    <div class="stat-number" id="entPatientCount">0</div>
                                    <div class="stat-label">Patients in ENT Ward</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 col-lg-3">
                            <div class="stat-card">
                                <div class="stat-icon">
                                    <i class="fas fa-stethoscope"></i>
                                </div>
                                <div class="stat-content">
                                    <div class="stat-number" id="totalConditions">0</div>
                                    <div class="stat-label">Total Conditions</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 col-lg-3">
                            <div class="stat-card">
                                <div class="stat-icon">
                                    <i class="fas fa-pills"></i>
                                </div>
                                <div class="stat-content">
                                    <div class="stat-number" id="activeMedications">0</div>
                                    <div class="stat-label">Active Medications</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 col-lg-3">
                            <div class="stat-card">
                                <div class="stat-icon">
                                    <i class="fas fa-chart-line"></i>
                                </div>
                                <div class="stat-content">
                                    <div class="stat-number" id="recentObservations">0</div>
                                    <div class="stat-label">Recent Observations</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="patients-card">
                    <div class="card-header">
                        <h3><i class="fas fa-bed me-2"></i>ENT Ward Patients</h3>
                    </div>
                    <div class="card-body">
                        <div id="entPatientsContainer">
                            <div class="text-center py-4">
                                <i class="fas fa-spinner fa-spin fa-2x text-muted"></i>
                                <p class="mt-2 text-muted">Loading patient data...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="conditions-card">
                    <div class="card-header">
                        <h3><i class="fas fa-clipboard-list me-2"></i>All Patient Conditions</h3>
                    </div>
                    <div class="card-body">
                        <div id="conditionsContainer">
                            <div class="text-center py-4">
                                <i class="fas fa-spinner fa-spin fa-2x text-muted"></i>
                                <p class="mt-2 text-muted">Loading conditions...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
