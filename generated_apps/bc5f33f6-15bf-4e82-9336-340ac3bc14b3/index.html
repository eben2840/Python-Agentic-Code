<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT Ward - Patient Observations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-hospital-user text-teal me-3"></i>
                        <div>
                            <h1 class="mb-1">ENT Ward Patients</h1>
                            <p class="text-muted mb-0">Patient observations and status overview</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ward Summary -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="summary-card">
                    <div class="d-flex align-items-center">
                        <div class="summary-icon bg-teal">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="ms-3">
                            <h3 class="mb-0" id="totalPatients">0</h3>
                            <p class="text-muted mb-0">Total Patients</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="summary-card">
                    <div class="d-flex align-items-center">
                        <div class="summary-icon bg-blue">
                            <i class="fas fa-stethoscope"></i>
                        </div>
                        <div class="ms-3">
                            <h3 class="mb-0" id="totalObservations">0</h3>
                            <p class="text-muted mb-0">Observations</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="summary-card">
                    <div class="d-flex align-items-center">
                        <div class="summary-icon bg-green">
                            <i class="fas fa-bed"></i>
                        </div>
                        <div class="ms-3">
                            <h3 class="mb-0">ENT Ward</h3>
                            <p class="text-muted mb-0">Active Ward</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patients List -->
        <div class="row">
            <div class="col-12">
                <div class="patients-card">
                    <div class="card-header">
                        <h2 class="mb-0">
                            <i class="fas fa-clipboard-list text-teal me-2"></i>
                            ENT Ward Patients & Observations
                        </h2>
                    </div>
                    <div class="card-body">
                        <div id="patientsContainer">
                            <div class="text-center py-4">
                                <i class="fas fa-spinner fa-spin text-muted"></i>
                                <p class="text-muted mt-2">Loading patients...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
