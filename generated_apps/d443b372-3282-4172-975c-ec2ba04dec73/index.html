<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Count Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body text-center py-4">
                        <div class="icon-large mb-3">
                            <i class="fas fa-hospital text-primary"></i>
                        </div>
                        <h1 class="h3 mb-2">Ward Count Analysis</h1>
                        <p class="text-muted mb-0">System-wide ward distribution and capacity overview</p>
                    </div>
                </div>

                <!-- Ward Count Summary -->
                <div class="row mb-4">
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card stat-card">
                            <div class="card-body text-center">
                                <div class="stat-icon mb-2">
                                    <i class="fas fa-building text-teal"></i>
                                </div>
                                <div class="stat-number" id="totalWards">-</div>
                                <div class="stat-label">Total Wards</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card stat-card">
                            <div class="card-body text-center">
                                <div class="stat-icon mb-2">
                                    <i class="fas fa-bed text-blue"></i>
                                </div>
                                <div class="stat-number" id="totalRooms">-</div>
                                <div class="stat-label">Total Rooms</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card stat-card">
                            <div class="card-body text-center">
                                <div class="stat-icon mb-2">
                                    <i class="fas fa-users text-green"></i>
                                </div>
                                <div class="stat-number" id="totalPatients">-</div>
                                <div class="stat-label">Total Patients</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ward Details -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-list-ul me-2"></i>
                            Ward Details
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="wardsList">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="text-muted mt-2">Loading ward data...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- No Data Message -->
                <div id="noDataMessage" class="card d-none">
                    <div class="card-body text-center py-5">
                        <div class="icon-large mb-3">
                            <i class="fas fa-exclamation-circle text-warning"></i>
                        </div>
                        <h5 class="mb-2">No Ward Data Available</h5>
                        <p class="text-muted mb-0">No location or ward information found in the system.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
