<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Conditions Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-hospital-alt me-3 text-primary"></i>
                        <div>
                            <h1 class="mb-1">Hospital Conditions Overview</h1>
                            <p class="text-muted mb-0">All active conditions across all patients</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="stats-row mb-4">
                    <div class="stat-card">
                        <i class="fas fa-users text-teal"></i>
                        <div>
                            <div class="stat-number" id="totalPatients">0</div>
                            <div class="stat-label">Total Patients</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-stethoscope text-blue"></i>
                        <div>
                            <div class="stat-number" id="totalConditions">0</div>
                            <div class="stat-label">Active Conditions</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-chart-pie text-green"></i>
                        <div>
                            <div class="stat-number" id="uniqueConditions">0</div>
                            <div class="stat-label">Unique Conditions</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="condition-summary-card">
                    <h3><i class="fas fa-list-ul me-2"></i>Condition Summary</h3>
                    <div id="conditionSummary" class="condition-list">
                        <div class="no-data">No data available</div>
                    </div>
                </div>
            </div>
            <div class="col-lg-8 col-md-6 mb-4">
                <div class="patient-conditions-card">
                    <h3><i class="fas fa-user-md me-2"></i>Patient Conditions</h3>
                    <div id="patientConditions" class="patient-list">
                        <div class="no-data">No data available</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
