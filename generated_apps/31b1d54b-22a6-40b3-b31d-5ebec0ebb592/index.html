<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asthma Patients Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="header-section">
                    <div class="d-flex align-items-center mb-4">
                        <i class="fas fa-lungs text-primary me-3" style="font-size: 2rem;"></i>
                        <div>
                            <h1 class="mb-0">Asthma Patients Dashboard</h1>
                            <p class="text-muted mb-0">Monitoring patients with asthma conditions</p>
                        </div>
                    </div>
                </div>

                <div class="stats-section mb-4">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="stat-icon">
                                    <i class="fas fa-users"></i>
                                </div>
                                <div class="stat-content">
                                    <h3 id="totalPatients">0</h3>
                                    <p>Total Asthma Patients</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="stat-icon">
                                    <i class="fas fa-stethoscope"></i>
                                </div>
                                <div class="stat-content">
                                    <h3 id="activeConditions">0</h3>
                                    <p>Active Conditions</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="stat-icon">
                                    <i class="fas fa-pills"></i>
                                </div>
                                <div class="stat-content">
                                    <h3 id="activeMedications">0</h3>
                                    <p>Active Medications</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card">
                                <div class="stat-icon">
                                    <i class="fas fa-chart-line"></i>
                                </div>
                                <div class="stat-content">
                                    <h3 id="recentObservations">0</h3>
                                    <p>Recent Observations</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="patients-section">
                    <div class="section-header mb-3">
                        <h2><i class="fas fa-list me-2"></i>Asthma Patients</h2>
                    </div>
                    
                    <div id="patientsContainer">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-3 text-muted">Loading patient data...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
