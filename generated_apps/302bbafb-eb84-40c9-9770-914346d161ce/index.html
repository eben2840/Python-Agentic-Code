<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Patients Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="header-section">
                    <h1><i class="fas fa-heartbeat text-primary me-3"></i>Diabetes Patients Dashboard</h1>
                    <p class="lead">Patients with diabetes conditions aged 30 and above</p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="stats-card">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="stat-item">
                                <i class="fas fa-users text-primary"></i>
                                <div>
                                    <h3 id="totalPatients">0</h3>
                                    <span>Total Patients</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="stat-item">
                                <i class="fas fa-calendar text-success"></i>
                                <div>
                                    <h3 id="avgAge">0</h3>
                                    <span>Average Age</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="stat-item">
                                <i class="fas fa-chart-line text-warning"></i>
                                <div>
                                    <h3 id="activeConditions">0</h3>
                                    <span>Active Conditions</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="patients-section">
                    <h2><i class="fas fa-list me-2"></i>Patient List</h2>
                    <div id="patientsContainer">
                        <!-- Patients will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
