<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Encounter - Healthcare Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Header -->
                <div class="card header-card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="icon-wrapper me-3">
                                <i class="fas fa-user-md"></i>
                            </div>
                            <div>
                                <h1 class="card-title mb-1" id="patientName">Loading...</h1>
                                <p class="text-muted mb-0" id="patientInfo">Loading patient information...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Encounter Details -->
                <div class="card encounter-card">
                    <div class="card-header">
                        <div class="d-flex align-items-center">
                            <div class="icon-wrapper me-3">
                                <i class="fas fa-calendar-check"></i>
                            </div>
                            <h2 class="card-title mb-0">Current Encounter</h2>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="encounterContent">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-2 text-muted">Loading encounter details...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Related Information -->
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card info-card">
                            <div class="card-header">
                                <div class="d-flex align-items-center">
                                    <div class="icon-wrapper me-2">
                                        <i class="fas fa-map-marker-alt"></i>
                                    </div>
                                    <h3 class="card-title mb-0">Location</h3>
                                </div>
                            </div>
                            <div class="card-body" id="locationContent">
                                <p class="text-muted">Loading location...</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card info-card">
                            <div class="card-header">
                                <div class="d-flex align-items-center">
                                    <div class="icon-wrapper me-2">
                                        <i class="fas fa-stethoscope"></i>
                                    </div>
                                    <h3 class="card-title mb-0">Active Conditions</h3>
                                </div>
                            </div>
                            <div class="card-body" id="conditionsContent">
                                <p class="text-muted">Loading conditions...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
