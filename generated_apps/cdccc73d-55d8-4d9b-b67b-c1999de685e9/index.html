<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Wards & Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-hospital-alt me-3 text-primary"></i>
                        <div>
                            <h1 class="mb-1">Hospital Wards & Rooms</h1>
                            <p class="text-muted mb-0">Real-time facility status and occupancy overview</p>
                        </div>
                    </div>
                    <div class="stats-row mt-3">
                        <div class="stat-item">
                            <span class="stat-number" id="totalWards">0</span>
                            <span class="stat-label">Total Wards</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="totalRooms">0</span>
                            <span class="stat-label">Total Rooms</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="occupiedRooms">0</span>
                            <span class="stat-label">Occupied</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="availableRooms">0</span>
                            <span class="stat-label">Available</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="filter-card">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Filter by Ward</label>
                            <select class="form-select" id="wardFilter">
                                <option value="">All Wards</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Filter by Status</label>
                            <select class="form-select" id="statusFilter">
                                <option value="">All Status</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Search Rooms</label>
                            <input type="text" class="form-control" id="searchInput" placeholder="Search by room name...">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Wards Grid -->
        <div class="row" id="wardsContainer">
            <!-- Dynamic content will be inserted here -->
        </div>

        <!-- No Data Message -->
        <div class="row" id="noDataMessage" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <i class="fas fa-hospital-alt mb-3"></i>
                    <h3>No facility data available</h3>
                    <p>Unable to load hospital wards and rooms information.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
