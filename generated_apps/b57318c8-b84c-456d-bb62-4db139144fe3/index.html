<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBAR Handover Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-clipboard-list text-primary me-3"></i>
                        <div>
                            <h1 class="mb-0">SBAR Handover Summary</h1>
                            <p class="text-muted mb-0" id="patient-header">Loading patient information...</p>
                        </div>
                    </div>
                    <div class="timestamp">
                        <i class="fas fa-clock me-2"></i>
                        <span id="handover-time"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4" id="sbar-content">
            <!-- SBAR sections will be populated here -->
        </div>

        <div class="row mt-4" id="all-patients-view" style="display: none;">
            <div class="col-12">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle me-2"></i>
                    Please select a specific patient to generate an SBAR handover summary. SBAR format requires individual patient focus for clinical safety.
                </div>
                <div class="patient-list-card">
                    <h3 class="mb-3">Available Patients</h3>
                    <div id="patient-list" class="row g-3">
                        <!-- Patient cards will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
