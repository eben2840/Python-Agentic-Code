<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vital Signs Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex align-items-center mb-3">
                    <i class="fas fa-heartbeat text-danger me-3" style="font-size: 1.5rem;"></i>
                    <h1 class="mb-0">Vitalzeichen Dashboard</h1>
                </div>
                <div id="patientInfo" class="card mb-4">
                    <div class="card-body py-3">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-user-circle text-muted me-2"></i>
                            <span id="patientName" class="fw-medium">Patient wird geladen...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="vitalSignsGrid">
            <!-- Vital signs cards will be inserted here -->
        </div>

        <div class="row mt-4" id="noDataMessage" style="display: none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-body text-center py-5">
                        <i class="fas fa-chart-line text-muted mb-3" style="font-size: 3rem;"></i>
                        <h3 class="text-muted">Keine Vitalzeichen verfügbar</h3>
                        <p class="text-muted">Für diesen Patienten sind derzeit keine Vitalzeichen-Daten vorhanden.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
