<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronic Disease Patients (Age 30+)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-heartbeat text-danger me-3"></i>
                        <div>
                            <h1 class="mb-1">Chronic Disease Patients</h1>
                            <p class="text-muted mb-0">Patients aged 30 years and older with chronic conditions</p>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-item">
                            <span class="stat-number" id="totalPatients">0</span>
                            <span class="stat-label">Total Patients</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="avgAge">0</span>
                            <span class="stat-label">Average Age</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="uniqueConditions">0</span>
                            <span class="stat-label">Unique Conditions</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="filter-card">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h5 class="mb-0">
                            <i class="fas fa-filter text-primary me-2"></i>
                            Filters
                        </h5>
                        <button class="btn btn-outline-secondary btn-sm" id="clearFilters">
                            <i class="fas fa-times me-1"></i>Clear All
                        </button>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Age Range</label>
                            <select class="form-select" id="ageFilter">
                                <option value="">All Ages (30+)</option>
                                <option value="30-40">30-40 years</option>
                                <option value="41-50">41-50 years</option>
                                <option value="51-60">51-60 years</option>
                                <option value="60+">60+ years</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Gender</label>
                            <select class="form-select" id="genderFilter">
                                <option value="">All Genders</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Condition Type</label>
                            <select class="form-select" id="conditionFilter">
                                <option value="">All Conditions</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Patient Name</label>
                            <select class="form-select" id="nameFilter">
                                <option value="">All Patients</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="patientsContainer">
            <!-- Patient cards will be inserted here -->
        </div>

        <div class="row" id="noDataMessage" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <i class="fas fa-search text-muted mb-3"></i>
                    <h5>No chronic disease patients found</h5>
                    <p class="text-muted">No patients aged 30+ with chronic conditions match the current filters.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Patient Detail Modal -->
    <div class="modal fade" id="patientDetailModal" tabindex="-1" aria-labelledby="patientDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="patientDetailModalLabel">
                        <i class="fas fa-user-injured text-danger me-2"></i>
                        Patient Details
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="patientDetailBody">
                    <!-- Patient details will be inserted here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
