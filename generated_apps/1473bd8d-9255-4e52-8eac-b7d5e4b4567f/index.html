<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Observations Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-chart-line text-primary me-3"></i>
                        <div>
                            <h1 class="mb-0">Hospital Observations Dashboard</h1>
                            <p class="text-muted mb-0">All patient observations across the facility</p>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-item">
                            <span class="stat-number" id="totalObservations">0</span>
                            <span class="stat-label">Total Observations</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="totalPatients">0</span>
                            <span class="stat-label">Patients</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="recentObservations">0</span>
                            <span class="stat-label">Recent (24h)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="filter-card">
                    <div class="d-flex flex-wrap align-items-center gap-3">
                        <div class="filter-group">
                            <label class="filter-label">Filter by Type:</label>
                            <select class="form-select" id="typeFilter">
                                <option value="">All Types</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Search Patient:</label>
                            <input type="text" class="form-control" id="patientSearch" placeholder="Enter patient name...">
                        </div>
                        <button class="btn btn-outline-secondary" id="clearFilters">
                            <i class="fas fa-times me-1"></i>Clear
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="observationsContainer">
            <!-- Observations will be populated here -->
        </div>

        <div class="row" id="noDataContainer" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <i class="fas fa-chart-line text-muted mb-3"></i>
                    <h3>No Observations Available</h3>
                    <p class="text-muted">No observation data found for the selected criteria.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
