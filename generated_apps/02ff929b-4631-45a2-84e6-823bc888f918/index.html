<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronic Disease Patients (30+)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center">
                        <div class="icon-wrapper me-3">
                            <i class="fas fa-heartbeat"></i>
                        </div>
                        <div>
                            <h1 class="mb-1">Chronic Disease Patients</h1>
                            <p class="text-muted mb-0">Patients over 30 with chronic conditions</p>
                        </div>
                    </div>
                    <div class="stats-badge" id="patientCount">
                        <span class="count">0</span> patients
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="filter-card">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Age Range</label>
                            <select class="form-select" id="ageFilter">
                                <option value="30+">30+ years</option>
                                <option value="40+">40+ years</option>
                                <option value="50+">50+ years</option>
                                <option value="60+">60+ years</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Condition Type</label>
                            <select class="form-select" id="conditionFilter">
                                <option value="all">All Chronic Conditions</option>
                                <option value="cardiovascular">Cardiovascular</option>
                                <option value="respiratory">Respiratory</option>
                                <option value="metabolic">Metabolic</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Gender</label>
                            <select class="form-select" id="genderFilter">
                                <option value="all">All Genders</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient List -->
        <div class="row" id="patientList">
            <!-- Patients will be populated here -->
        </div>

        <!-- No Data Message -->
        <div class="row d-none" id="noDataMessage">
            <div class="col-12">
                <div class="no-data-card">
                    <div class="text-center">
                        <i class="fas fa-search mb-3"></i>
                        <h5>No patients found</h5>
                        <p class="text-muted">No patients match the current filter criteria</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Patient Detail Modal -->
    <div class="modal fade" id="patientDetailModal" tabindex="-1" aria-labelledby="patientDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="patientDetailModalLabel">Patient Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="patientDetailContent">
                    <!-- Patient details will be populated here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
