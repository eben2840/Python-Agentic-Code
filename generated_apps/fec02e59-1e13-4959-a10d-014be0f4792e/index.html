<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex align-items-center mb-4">
                    <div class="icon-circle me-3">
                        <i class="fas fa-chart-line text-primary"></i>
                    </div>
                    <div>
                        <h1 class="mb-0">Observation Dashboard</h1>
                        <p class="text-muted mb-0" id="patientName">Loading patient...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Patient Overview Card -->
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <div class="icon-circle-sm me-2">
                                <i class="fas fa-user text-teal"></i>
                            </div>
                            <h3 class="mb-0">Patient Overview</h3>
                        </div>
                        <div id="patientInfo">
                            <div class="info-row">
                                <span class="info-label">Name:</span>
                                <span id="patientFullName">-</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Gender:</span>
                                <span id="patientGender">-</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Birth Date:</span>
                                <span id="patientBirth">-</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Patient ID:</span>
                                <span id="patientId" class="text-muted">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Observations Summary -->
            <div class="col-lg-8">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <div class="d-flex align-items-center">
                                <div class="icon-circle-sm me-2">
                                    <i class="fas fa-stethoscope text-blue"></i>
                                </div>
                                <h3 class="mb-0">Clinical Observations</h3>
                            </div>
                            <span class="badge bg-light text-dark" id="obsCount">0 observations</span>
                        </div>
                        <div id="observationsList">
                            <div class="text-center py-4 text-muted">
                                <i class="fas fa-search fa-2x mb-2"></i>
                                <p>Loading observations...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Conditions Card -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <div class="icon-circle-sm me-2">
                                <i class="fas fa-heartbeat text-red"></i>
                            </div>
                            <h3 class="mb-0">Active Conditions</h3>
                        </div>
                        <div id="conditionsList">
                            <div class="text-center py-3 text-muted">
                                <p>Loading conditions...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Medications Card -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <div class="icon-circle-sm me-2">
                                <i class="fas fa-pills text-green"></i>
                            </div>
                            <h3 class="mb-0">Current Medications</h3>
                        </div>
                        <div id="medicationsList">
                            <div class="text-center py-3 text-muted">
                                <p>Loading medications...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
