<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Room Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <!-- Patient Header -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="icon-wrapper me-3">
                                <i class="fas fa-user-circle text-primary"></i>
                            </div>
                            <div>
                                <h4 class="mb-1" id="patientName">Loading...</h4>
                                <div class="text-muted small">
                                    <span id="patientGender">-</span> • 
                                    <span id="patientAge">-</span> • 
                                    ID: <span id="patientId">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Room Information -->
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex align-items-center">
                            <div class="icon-wrapper me-2">
                                <i class="fas fa-door-open text-teal"></i>
                            </div>
                            <h5 class="mb-0">Current Room Assignment</h5>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="roomInfo" class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
