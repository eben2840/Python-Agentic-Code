<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Conditions Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h1 class="mb-1">
                                <i class="fas fa-heartbeat text-danger me-2"></i>
                                Patient Conditions Dashboard
                            </h1>
                            <p class="text-muted mb-0">Monitor and filter patient conditions by severity</p>
                        </div>
                        <div class="stats-summary">
                            <div class="stat-item">
                                <span class="stat-number" id="totalPatients">0</span>
                                <span class="stat-label">Total Patients</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-number critical" id="criticalCount">0</span>
                                <span class="stat-label">Critical</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="filter-card">
                    <div class="d-flex align-items-center gap-3 flex-wrap">
                        <div class="filter-group">
                            <label class="filter-label">
                                <i class="fas fa-filter me-1"></i>
                                Severity Filter:
                            </label>
                            <select id="severityFilter" class="form-select">
                                <option value="all">All Patients</option>
                                <option value="critical">Critical Only</option>
                                <option value="low">Low Risk Only</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">
                                <i class="fas fa-search me-1"></i>
                                Search:
                            </label>
                            <input type="text" id="searchInput" class="form-control" placeholder="Search by name or condition...">
                        </div>
                        <button id="clearFilters" class="btn btn-outline-secondary">
                            <i class="fas fa-times me-1"></i>
                            Clear
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient Conditions Grid -->
        <div class="row" id="patientsGrid">
            <!-- Patient cards will be dynamically inserted here -->
        </div>

        <!-- No Results Message -->
        <div id="noResults" class="text-center py-5" style="display: none;">
            <i class="fas fa-search text-muted mb-3" style="font-size: 3rem;"></i>
            <h4 class="text-muted">No patients found</h4>
            <p class="text-muted">Try adjusting your filters or search criteria</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
