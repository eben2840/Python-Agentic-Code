<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Care Patient Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-0">
        <!-- Header -->
        <div class="header-bar">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <i class="fas fa-heartbeat text-danger me-3 fs-4"></i>
                    <h1 class="mb-0 fs-4 fw-bold">Critical Care Monitor</h1>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="alert-counter">
                        <i class="fas fa-bell text-warning"></i>
                        <span class="badge bg-danger" id="alertCount">0</span>
                    </div>
                    <div class="last-update text-muted small">
                        Last updated: <span id="lastUpdate">--:--</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row g-0 main-content">
            <!-- Patient List Panel -->
            <div class="col-lg-8 patient-list-panel">
                <div class="panel-header">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="fs-5 mb-0">Critical Patients <span class="badge bg-danger" id="criticalCount">0</span></h2>
                        <div class="d-flex gap-2">
                            <select class="form-select form-select-sm" id="sortBy">
                                <option value="severity">Sort by Severity</option>
                                <option value="name">Sort by Name</option>
                                <option value="room">Sort by Room</option>
                                <option value="admission">Sort by Admission</option>
                            </select>
                            <button class="btn btn-outline-primary btn-sm" id="refreshBtn">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Patient Grid -->
                <div class="patient-grid" id="patientGrid">
                    <!-- Patient cards will be dynamically generated -->
                </div>
            </div>

            <!-- Patient Detail Panel -->
            <div class="col-lg-4 patient-detail-panel">
                <div class="detail-panel-content" id="detailPanel">
                    <div class="empty-state text-center py-5">
                        <i class="fas fa-user-md text-muted mb-3" style="font-size: 3rem;"></i>
                        <h3 class="text-muted">Select a Patient</h3>
                        <p class="text-muted">Click on a patient card to view detailed information</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Critical Metrics Dashboard -->
        <div class="metrics-dashboard" id="metricsDashboard">
            <div class="row g-3">
                <div class="col-md-3">
                    <div class="metric-card">
                        <div class="metric-icon bg-danger">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div class="metric-content">
                            <div class="metric-value" id="highRiskCount">0</div>
                            <div class="metric-label">High Risk</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="metric-card">
                        <div class="metric-icon bg-warning">
                            <i class="fas fa-eye"></i>
                        </div>
                        <div class="metric-content">
                            <div class="metric-value" id="monitoringCount">0</div>
                            <div class="metric-label">Monitoring</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="metric-card">
                        <div class="metric-icon bg-info">
                            <i class="fas fa-bed"></i>
                        </div>
                        <div class="metric-content">
                            <div class="metric-value" id="totalPatientsCount">0</div>
                            <div class="metric-label">Total Patients</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="metric-card">
                        <div class="metric-icon bg-success">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="metric-content">
                            <div class="metric-value" id="avgResponseTime">--</div>
                            <div class="metric-label">Avg Response</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
