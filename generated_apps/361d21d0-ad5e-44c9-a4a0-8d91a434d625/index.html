<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT Ward - Patient Observations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-stethoscope text-teal me-3"></i>
                        <div>
                            <h1 class="mb-0">ENT Ward</h1>
                            <p class="text-muted mb-0">Patient Observations Dashboard</p>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-item">
                            <span class="stat-number" id="totalPatients">0</span>
                            <span class="stat-label">Total Patients</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="withObservations">0</span>
                            <span class="stat-label">With Observations</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="patientsContainer">
            <!-- Patient cards will be dynamically inserted here -->
        </div>

        <div class="row" id="noDataMessage" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <i class="fas fa-search text-muted mb-3"></i>
                    <h5>No ENT Ward Patients Found</h5>
                    <p class="text-muted">No patients with ENT-related conditions or observations were found in the current dataset.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
