<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Triage System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <!-- Patient Info Sidebar -->
            <div class="col-md-3">
                <div class="card mb-4">
                    <div class="card-header bg-white border-bottom">
                        <h3 class="mb-0"><i class="fas fa-user text-primary me-2"></i>Patient Info</h3>
                    </div>
                    <div class="card-body">
                        <div id="patientInfo">
                            <p class="text-muted">Loading patient data...</p>
                        </div>
                    </div>
                </div>

                <!-- Triage Priority -->
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h3 class="mb-0"><i class="fas fa-exclamation-triangle text-warning me-2"></i>Triage Level</h3>
                    </div>
                    <div class="card-body">
                        <div id="triagePriority" class="text-center">
                            <span class="badge bg-secondary fs-6 px-3 py-2">Not Assessed</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9">
                <!-- Emergency Assessment Form -->
                <div class="card mb-4">
                    <div class="card-header bg-white border-bottom">
                        <h2 class="mb-0"><i class="fas fa-clipboard-list text-danger me-2"></i>Emergency Assessment</h2>
                    </div>
                    <div class="card-body">
                        <form id="triageForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Chief Complaint</label>
                                    <textarea class="form-control" id="chiefComplaint" rows="3" placeholder="Primary reason for visit..."></textarea>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Pain Level (0-10)</label>
                                    <select class="form-select" id="painLevel">
                                        <option value="">Select pain level</option>
                                        <option value="0">0 - No pain</option>
                                        <option value="1-3">1-3 - Mild</option>
                                        <option value="4-6">4-6 - Moderate</option>
                                        <option value="7-8">7-8 - Severe</option>
                                        <option value="9-10">9-10 - Worst possible</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Onset</label>
                                    <select class="form-select" id="onset">
                                        <option value="">Select onset</option>
                                        <option value="sudden">Sudden</option>
                                        <option value="gradual">Gradual</option>
                                        <option value="chronic">Chronic</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Consciousness</label>
                                    <select class="form-select" id="consciousness">
                                        <option value="">Select level</option>
                                        <option value="alert">Alert</option>
                                        <option value="confused">Confused</option>
                                        <option value="drowsy">Drowsy</option>
                                        <option value="unconscious">Unconscious</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-semibold">Breathing</label>
                                    <select class="form-select" id="breathing">
                                        <option value="">Select status</option>
                                        <option value="normal">Normal</option>
                                        <option value="labored">Labored</option>
                                        <option value="shallow">Shallow</option>
                                        <option value="absent">Absent</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Additional Notes</label>
                                <textarea class="form-control" id="additionalNotes" rows="2" placeholder="Any additional observations..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Update Triage Assessment
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Vital Signs Section -->
                <div class="card">
                    <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center">
                        <h2 class="mb-0"><i class="fas fa-heartbeat text-danger me-2"></i>Vital Signs</h2>
                        <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#vitalSignsModal">
                            <i class="fas fa-plus me-1"></i>Add Vitals
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="vitalSignsList">
                            <div class="row" id="existingVitals"></div>
                            <div id="newVitalsList" class="row"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vital Signs Modal -->
    <div class="modal fade" id="vitalSignsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-white border-bottom">
                    <h3 class="modal-title"><i class="fas fa-stethoscope text-primary me-2"></i>Capture Vital Signs</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="vitalSignsForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Blood Pressure (Systolic)</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="systolic" placeholder="120">
                                    <span class="input-group-text">mmHg</span>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Blood Pressure (Diastolic)</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="diastolic" placeholder="80">
                                    <span class="input-group-text">mmHg</span>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">Heart Rate</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="heartRate" placeholder="72">
                                    <span class="input-group-text">bpm</span>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">Temperature</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" class="form-control" id="temperature" placeholder="98.6">
                                    <span class="input-group-text">°F</span>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">Oxygen Saturation</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="oxygenSat" placeholder="98">
                                    <span class="input-group-text">%</span>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Respiratory Rate</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="respiratoryRate" placeholder="16">
                                    <span class="input-group-text">breaths/min</span>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Weight</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" class="form-control" id="weight" placeholder="70">
                                    <span class="input-group-text">kg</span>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-white border-top">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveVitals">
                        <i class="fas fa-save me-2"></i>Save Vital Signs
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
