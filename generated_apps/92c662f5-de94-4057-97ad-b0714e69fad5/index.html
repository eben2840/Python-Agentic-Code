<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Lee - Patient Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="patient-header">
                    <div class="d-flex align-items-center">
                        <div class="patient-avatar me-3">
                            <i class="fas fa-user-circle text-muted"></i>
                        </div>
                        <div>
                            <h1 class="patient-name mb-1" id="patientName">Loading...</h1>
                            <div class="patient-info">
                                <span class="badge bg-light text-dark me-2" id="patientGender">
                                    <i class="fas fa-venus-mars me-1"></i>Loading...
                                </span>
                                <span class="badge bg-light text-dark me-2" id="patientAge">
                                    <i class="fas fa-calendar me-1"></i>Loading...
                                </span>
                                <span class="badge bg-light text-dark" id="patientId">
                                    <i class="fas fa-id-card me-1"></i>Loading...
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Analytics Overview -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="analytics-card">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-danger-subtle">
                            <i class="fas fa-stethoscope text-danger"></i>
                        </div>
                        <div class="ms-3">
                            <div class="analytics-value" id="conditionsCount">0</div>
                            <div class="analytics-label">Active Conditions</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="analytics-card">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-primary-subtle">
                            <i class="fas fa-chart-line text-primary"></i>
                        </div>
                        <div class="ms-3">
                            <div class="analytics-value" id="observationsCount">0</div>
                            <div class="analytics-label">Observations</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="analytics-card">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-success-subtle">
                            <i class="fas fa-pills text-success"></i>
                        </div>
                        <div class="ms-3">
                            <div class="analytics-value" id="medicationsCount">0</div>
                            <div class="analytics-label">Medications</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="analytics-card">
                    <div class="d-flex align-items-center">
                        <div class="analytics-icon bg-warning-subtle">
                            <i class="fas fa-hospital text-warning"></i>
                        </div>
                        <div class="ms-3">
                            <div class="analytics-value" id="encountersCount">0</div>
                            <div class="analytics-label">Encounters</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row">
            <!-- Left Column -->
            <div class="col-lg-8">
                <!-- Conditions & Observations -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="data-card">
                            <div class="card-header">
                                <h5 class="mb-0">
                                    <i class="fas fa-exclamation-triangle text-danger me-2"></i>
                                    Active Conditions
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="conditionsList">
                                    <div class="text-muted">No data available</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="data-card">
                            <div class="card-header">
                                <h5 class="mb-0">
                                    <i class="fas fa-chart-bar text-primary me-2"></i>
                                    Latest Observations
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="observationsList">
                                    <div class="text-muted">No data available</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Encounters Timeline -->
                <div class="data-card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-clock text-warning me-2"></i>
                            Encounter Timeline
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="encountersList">
                            <div class="text-muted">No data available</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="col-lg-4">
                <!-- Medications -->
                <div class="data-card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-prescription-bottle text-success me-2"></i>
                            Current Medications
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="medicationsList">
                            <div class="text-muted">No data available</div>
                        </div>
                    </div>
                </div>

                <!-- Vital Signs -->
                <div class="data-card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-heartbeat text-danger me-2"></i>
                            Vital Signs
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="vitalSignsList">
                            <div class="text-muted">No data available</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
