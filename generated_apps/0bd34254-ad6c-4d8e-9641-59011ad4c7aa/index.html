<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward & Room Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-hospital-alt me-3 text-primary"></i>
                        <div>
                            <h1 class="mb-0">Ward & Room Directory</h1>
                            <p class="text-muted mb-0">Hospital facility locations and room assignments</p>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-item">
                            <span class="stat-number" id="totalLocations">0</span>
                            <span class="stat-label">Total Locations</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="totalWards">0</span>
                            <span class="stat-label">Wards</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="totalRooms">0</span>
                            <span class="stat-label">Rooms</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="filter-card">
                    <div class="d-flex flex-wrap align-items-center gap-3">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="Search locations..." class="form-control">
                        </div>
                        <div class="filter-buttons">
                            <button class="btn btn-filter active" data-filter="all">
                                <i class="fas fa-list me-2"></i>All
                            </button>
                            <button class="btn btn-filter" data-filter="ward">
                                <i class="fas fa-building me-2"></i>Wards
                            </button>
                            <button class="btn btn-filter" data-filter="room">
                                <i class="fas fa-door-open me-2"></i>Rooms
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="locationsContainer">
            <!-- Locations will be populated here -->
        </div>

        <div class="row" id="noDataMessage" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <i class="fas fa-search-location"></i>
                    <h3>No locations found</h3>
                    <p>Try adjusting your search or filter criteria</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
