<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Encounter Timeline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="patient-avatar me-3">
                                <i class="fas fa-user-circle text-muted"></i>
                            </div>
                            <div>
                                <h1 class="mb-1" id="patientName">Loading...</h1>
                                <p class="text-muted mb-0" id="patientInfo">Patient ID: Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard Stats -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body text-center">
                        <i class="fas fa-calendar-check stat-icon text-primary"></i>
                        <h3 class="mb-1" id="totalEncounters">0</h3>
                        <p class="text-muted mb-0">Total Encounters</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body text-center">
                        <i class="fas fa-stethoscope stat-icon text-success"></i>
                        <h3 class="mb-1" id="activeConditions">0</h3>
                        <p class="text-muted mb-0">Active Conditions</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body text-center">
                        <i class="fas fa-pills stat-icon text-warning"></i>
                        <h3 class="mb-1" id="activeMedications">0</h3>
                        <p class="text-muted mb-0">Active Medications</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body text-center">
                        <i class="fas fa-chart-line stat-icon text-info"></i>
                        <h3 class="mb-1" id="recentObservations">0</h3>
                        <p class="text-muted mb-0">Recent Observations</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Timeline Diagram -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h2 class="mb-0">
                            <i class="fas fa-project-diagram text-primary me-2"></i>
                            Encounter Timeline
                        </h2>
                    </div>
                    <div class="card-body">
                        <div class="timeline-container">
                            <div class="timeline-line"></div>
                            <div id="timelineContent">
                                <div class="text-center py-5">
                                    <i class="fas fa-spinner fa-spin text-muted"></i>
                                    <p class="text-muted mt-2">Loading encounter data...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Encounter Details -->
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-list-ul text-success me-2"></i>
                            Recent Conditions
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="conditionsList">
                            <p class="text-muted">Loading conditions...</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-prescription-bottle text-warning me-2"></i>
                            Current Medications
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="medicationsList">
                            <p class="text-muted">Loading medications...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
