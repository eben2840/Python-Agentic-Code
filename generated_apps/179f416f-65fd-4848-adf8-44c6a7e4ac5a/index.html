<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBAR Handover Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center">
                        <div class="icon-wrapper me-3">
                            <i class="fas fa-clipboard-list"></i>
                        </div>
                        <div>
                            <h1 class="mb-1">SBAR Handover Summary</h1>
                            <p class="text-muted mb-0" id="patient-info">Loading patient information...</p>
                        </div>
                    </div>
                </div>

                <div id="sbar-content">
                    <!-- SBAR sections will be populated by JavaScript -->
                </div>

                <div id="no-data" class="text-center py-5" style="display: none;">
                    <div class="icon-wrapper mb-3">
                        <i class="fas fa-exclamation-circle text-warning"></i>
                    </div>
                    <h3>No Patient Data Available</h3>
                    <p class="text-muted">Unable to generate SBAR handover summary without patient data.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
