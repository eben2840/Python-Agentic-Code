<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBAR Handover Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <h1 class="h4 mb-1">
                                    <i class="fas fa-clipboard-list text-primary me-2"></i>
                                    SBAR Handover Summary
                                </h1>
                                <p class="text-muted mb-0" id="patient-header">Loading patient information...</p>
                            </div>
                            <div class="text-end">
                                <small class="text-muted d-block">Generated</small>
                                <small class="text-muted" id="timestamp"></small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SBAR Sections -->
                <div class="row g-4">
                    <!-- Situation -->
                    <div class="col-12 col-md-6">
                        <div class="card h-100">
                            <div class="card-header bg-danger bg-opacity-10 border-danger border-opacity-25">
                                <h5 class="card-title mb-0">
                                    <i class="fas fa-exclamation-circle text-danger me-2"></i>
                                    Situation
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="situation-content">
                                    <div class="text-center text-muted py-4">
                                        <i class="fas fa-spinner fa-spin"></i>
                                        <p class="mb-0 mt-2">Loading situation...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Background -->
                    <div class="col-12 col-md-6">
                        <div class="card h-100">
                            <div class="card-header bg-info bg-opacity-10 border-info border-opacity-25">
                                <h5 class="card-title mb-0">
                                    <i class="fas fa-history text-info me-2"></i>
                                    Background
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="background-content">
                                    <div class="text-center text-muted py-4">
                                        <i class="fas fa-spinner fa-spin"></i>
                                        <p class="mb-0 mt-2">Loading background...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Assessment -->
                    <div class="col-12 col-md-6">
                        <div class="card h-100">
                            <div class="card-header bg-warning bg-opacity-10 border-warning border-opacity-25">
                                <h5 class="card-title mb-0">
                                    <i class="fas fa-stethoscope text-warning me-2"></i>
                                    Assessment
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="assessment-content">
                                    <div class="text-center text-muted py-4">
                                        <i class="fas fa-spinner fa-spin"></i>
                                        <p class="mb-0 mt-2">Loading assessment...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Recommendation -->
                    <div class="col-12 col-md-6">
                        <div class="card h-100">
                            <div class="card-header bg-success bg-opacity-10 border-success border-opacity-25">
                                <h5 class="card-title mb-0">
                                    <i class="fas fa-tasks text-success me-2"></i>
                                    Recommendation
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="recommendation-content">
                                    <div class="text-center text-muted py-4">
                                        <i class="fas fa-spinner fa-spin"></i>
                                        <p class="mb-0 mt-2">Loading recommendations...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- All Patients View -->
                <div id="all-patients-view" class="d-none">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        Select a specific patient to generate SBAR handover summary
                    </div>
                    <div class="row g-3" id="patient-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
