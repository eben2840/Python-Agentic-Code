<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Condition Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="dashboard-header">
                    <h1 class="dashboard-title">
                        <i class="fas fa-stethoscope me-3"></i>
                        Patient Condition Dashboard
                    </h1>
                    <p class="dashboard-subtitle">Centralized view of medical conditions across your patient population</p>
                </div>
            </div>
        </div>

        <!-- Search and Filters -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="search-panel">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="search-box">
                                <i class="fas fa-search search-icon"></i>
                                <input type="text" id="searchInput" class="form-control" placeholder="Search patients, conditions, or severity...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select id="statusFilter" class="form-select">
                                <option value="">All Statuses</option>
                                <option value="active">Active</option>
                                <option value="resolved">Resolved</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select id="categoryFilter" class="form-select">
                                <option value="">All Categories</option>
                                <option value="chronic">Chronic</option>
                                <option value="acute">Acute</option>
                                <option value="preventive">Preventive</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Overview Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="overview-card">
                    <div class="overview-icon teal">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="overview-content">
                        <h3 id="totalPatients">0</h3>
                        <p>Total Patients</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="overview-card">
                    <div class="overview-icon blue">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <div class="overview-content">
                        <h3 id="totalConditions">0</h3>
                        <p>Total Conditions</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="overview-card">
                    <div class="overview-icon green">
                        <i class="fas fa-heartbeat"></i>
                    </div>
                    <div class="overview-content">
                        <h3 id="activeConditions">0</h3>
                        <p>Active Conditions</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="overview-card">
                    <div class="overview-icon orange">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="overview-content">
                        <h3 id="criticalConditions">0</h3>
                        <p>High Priority</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row">
            <!-- Patient List -->
            <div class="col-lg-8">
                <div class="main-card">
                    <div class="card-header">
                        <h5 class="card-title">
                            <i class="fas fa-table me-2"></i>
                            Patient Condition Overview
                        </h5>
                        <div class="card-actions">
                            <button class="btn btn-outline-primary btn-sm" id="exportBtn">
                                <i class="fas fa-download me-1"></i>
                                Export
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="patientTable" class="patient-table">
                            <!-- Patient rows will be populated here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Analytics Panel -->
            <div class="col-lg-4">
                <div class="main-card mb-4">
                    <div class="card-header">
                        <h5 class="card-title">
                            <i class="fas fa-chart-pie me-2"></i>
                            Condition Distribution
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="conditionChart" class="chart-container">
                            <!-- Chart will be rendered here -->
                        </div>
                    </div>
                </div>

                <div class="main-card">
                    <div class="card-header">
                        <h5 class="card-title">
                            <i class="fas fa-list me-2"></i>
                            Top Conditions
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="topConditions" class="condition-list">
                            <!-- Top conditions will be listed here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient Detail Modal -->
        <div class="modal fade" id="patientModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalPatientName">Patient Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="patientTimeline" class="timeline-container">
                            <!-- Timeline will be rendered here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
