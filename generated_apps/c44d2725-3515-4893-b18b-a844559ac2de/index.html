<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vital Signs Monitor Pro - Elias Abbott</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="container-fluid">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h1 class="app-title">
                            <i class="fas fa-heartbeat me-3"></i>
                            Vital Signs Monitor Pro
                        </h1>
                        <div class="patient-info">
                            <span class="patient-name">Elias Abbott</span>
                            <span class="patient-id">ID: 851a7b59-feb4-4b4c-9f48-8cf5fad54213</span>
                        </div>
                    </div>
                    <div class="col-md-6 text-end">
                        <div class="header-controls">
                            <button class="btn btn-outline-light me-2" id="refreshBtn">
                                <i class="fas fa-sync-alt"></i> Refresh
                            </button>
                            <button class="btn btn-light" id="exportBtn">
                                <i class="fas fa-download"></i> Export Report
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container-fluid">
                <!-- Alert Center -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="alert-center" id="alertCenter">
                            <!-- Dynamic alerts will be inserted here -->
                        </div>
                    </div>
                </div>

                <!-- Vital Signs Dashboard -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="dashboard-card">
                            <div class="card-header">
                                <h2><i class="fas fa-tachometer-alt me-2"></i>Current Vital Signs</h2>
                                <span class="last-updated" id="lastUpdated">Last updated: --</span>
                            </div>
                            <div class="vital-signs-grid" id="vitalSignsGrid">
                                <!-- Vital signs tiles will be dynamically generated -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="dashboard-card">
                            <div class="card-header">
                                <h2><i class="fas fa-chart-line me-2"></i>Trend Analysis</h2>
                                <div class="chart-controls">
                                    <select class="form-select" id="timeRangeSelect">
                                        <option value="24h">Last 24 Hours</option>
                                        <option value="7d" selected>Last 7 Days</option>
                                        <option value="30d">Last 30 Days</option>
                                        <option value="6m">Last 6 Months</option>
                                    </select>
                                    <select class="form-select ms-2" id="vitalTypeSelect">
                                        <option value="all">All Vitals</option>
                                        <option value="blood-pressure">Blood Pressure</option>
                                        <option value="heart-rate">Heart Rate</option>
                                        <option value="temperature">Temperature</option>
                                        <option value="respiratory-rate">Respiratory Rate</option>
                                        <option value="oxygen-saturation">Oxygen Saturation</option>
                                    </select>
                                </div>
                            </div>
                            <div class="chart-container">
                                <canvas id="trendsChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Clinical Context -->
                <div class="row mb-4">
                    <div class="col-lg-8">
                        <div class="dashboard-card">
                            <div class="card-header">
                                <h2><i class="fas fa-timeline me-2"></i>Clinical Timeline</h2>
                            </div>
                            <div class="timeline-container" id="clinicalTimeline">
                                <!-- Timeline items will be dynamically generated -->
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="dashboard-card">
                            <div class="card-header">
                                <h2><i class="fas fa-exclamation-triangle me-2"></i>Risk Factors</h2>
                            </div>
                            <div class="risk-factors" id="riskFactors">
                                <!-- Risk factors will be dynamically generated -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Data Summary -->
                <div class="row">
                    <div class="col-12">
                        <div class="dashboard-card">
                            <div class="card-header">
                                <h2><i class="fas fa-table me-2"></i>Detailed Readings</h2>
                                <div class="table-controls">
                                    <input type="text" class="form-control" id="searchInput" placeholder="Search readings...">
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover" id="readingsTable">
                                    <thead>
                                        <tr>
                                            <th>Date/Time</th>
                                            <th>Vital Sign</th>
                                            <th>Value</th>
                                            <th>Status</th>
                                            <th>Source</th>
                                        </tr>
                                    </thead>
                                    <tbody id="readingsTableBody">
                                        <!-- Table rows will be dynamically generated -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <i class="fas fa-heartbeat fa-pulse"></i>
            <p>Loading vital signs data...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
