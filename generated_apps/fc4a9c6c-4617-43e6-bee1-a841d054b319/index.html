<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row">
            <!-- Patient List Sidebar -->
            <div class="col-md-4 col-lg-3">
                <div class="card h-100">
                    <div class="card-header bg-white border-bottom">
                        <h3 class="mb-0"><i class="fas fa-users text-primary me-2"></i>Patients</h3>
                        <div class="mt-3">
                            <input type="text" class="form-control form-control-sm" id="patientSearch" placeholder="Search patients...">
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="patientList" class="list-group list-group-flush">
                            <!-- Patients will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="col-md-8 col-lg-9">
                <!-- Patient Details -->
                <div class="card mb-4" id="patientDetails" style="display: none;">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex justify-content-between align-items-center">
                            <h3 class="mb-0" id="patientName">Select a Patient</h3>
                            <span class="badge bg-light text-dark" id="patientId"></span>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4">
                                <small class="text-muted">Gender:</small>
                                <div id="patientGender">-</div>
                            </div>
                            <div class="col-md-4">
                                <small class="text-muted">Birth Date:</small>
                                <div id="patientBirth">-</div>
                            </div>
                            <div class="col-md-4">
                                <small class="text-muted">Age:</small>
                                <div id="patientAge">-</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Encounter Chat -->
                <div class="card" id="encounterChat" style="display: none;">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex justify-content-between align-items-center">
                            <h3 class="mb-0"><i class="fas fa-comments text-success me-2"></i>Encounter Chat</h3>
                            <div class="d-flex gap-2">
                                <select class="form-select form-select-sm" id="filterType">
                                    <option value="all">All Records</option>
                                    <option value="observations">Observations</option>
                                    <option value="conditions">Conditions</option>
                                    <option value="medications">Medications</option>
                                    <option value="allergies">Allergies</option>
                                    <option value="vital_signs">Vital Signs</option>
                                </select>
                                <button class="btn btn-sm btn-outline-primary" id="clearChat">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="chatMessages" class="chat-container mb-3">
                            <!-- Chat messages will appear here -->
                        </div>
                        <div class="input-group">
                            <input type="text" class="form-control" id="chatInput" placeholder="Ask about patient data or type a message...">
                            <button class="btn btn-primary" id="sendMessage">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Welcome Message -->
                <div class="card text-center" id="welcomeMessage">
                    <div class="card-body py-5">
                        <i class="fas fa-user-md text-muted mb-3" style="font-size: 3rem;"></i>
                        <h3 class="text-muted">Welcome to Healthcare Dashboard</h3>
                        <p class="text-muted">Select a patient from the sidebar to view their details and start an encounter chat.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
