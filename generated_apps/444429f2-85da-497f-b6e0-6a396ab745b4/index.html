<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Observations - Rose Hall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center">
                        <div class="patient-avatar me-3">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <div>
                            <h1 class="patient-name mb-1" id="patientName">Loading...</h1>
                            <div class="patient-details">
                                <span class="detail-item" id="patientGender">
                                    <i class="fas fa-venus-mars me-1"></i>
                                    <span>Loading...</span>
                                </span>
                                <span class="detail-item" id="patientAge">
                                    <i class="fas fa-calendar me-1"></i>
                                    <span>Loading...</span>
                                </span>
                                <span class="detail-item" id="patientId">
                                    <i class="fas fa-id-card me-1"></i>
                                    <span>Loading...</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Observations Section -->
        <div class="row">
            <div class="col-12">
                <div class="section-card">
                    <div class="section-header">
                        <h2 class="section-title">
                            <i class="fas fa-chart-line me-2"></i>
                            Observations
                        </h2>
                    </div>
                    <div class="section-content" id="observationsContent">
                        <div class="loading-state">
                            <i class="fas fa-spinner fa-spin me-2"></i>
                            Loading observations...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
