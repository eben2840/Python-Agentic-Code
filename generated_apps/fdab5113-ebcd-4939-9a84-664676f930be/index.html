<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Assessment Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <h1 class="mb-1">Patient Assessment Tasks</h1>
                                <p class="text-muted mb-0" id="patientInfo">Loading patient information...</p>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-light text-dark px-3 py-2">
                                    <i class="fas fa-clock text-primary me-2"></i>
                                    <span id="currentTime"></span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Task Categories -->
                <div class="row">
                    <!-- Critical/Urgent Tasks -->
                    <div class="col-md-6 mb-4">
                        <div class="card h-100">
                            <div class="card-header bg-white border-bottom">
                                <h2 class="mb-0">
                                    <i class="fas fa-exclamation-triangle text-danger me-2"></i>
                                    Critical & Urgent
                                </h2>
                            </div>
                            <div class="card-body">
                                <div id="criticalTasks" class="task-list">
                                    <!-- Tasks will be populated by JavaScript -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Important Tasks -->
                    <div class="col-md-6 mb-4">
                        <div class="card h-100">
                            <div class="card-header bg-white border-bottom">
                                <h2 class="mb-0">
                                    <i class="fas fa-star text-warning me-2"></i>
                                    Important
                                </h2>
                            </div>
                            <div class="card-body">
                                <div id="importantTasks" class="task-list">
                                    <!-- Tasks will be populated by JavaScript -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Routine Tasks -->
                    <div class="col-md-6 mb-4">
                        <div class="card h-100">
                            <div class="card-header bg-white border-bottom">
                                <h2 class="mb-0">
                                    <i class="fas fa-clipboard-list text-primary me-2"></i>
                                    Routine
                                </h2>
                            </div>
                            <div class="card-body">
                                <div id="routineTasks" class="task-list">
                                    <!-- Tasks will be populated by JavaScript -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Optional Tasks -->
                    <div class="col-md-6 mb-4">
                        <div class="card h-100">
                            <div class="card-header bg-white border-bottom">
                                <h2 class="mb-0">
                                    <i class="fas fa-circle text-muted me-2"></i>
                                    Optional
                                </h2>
                            </div>
                            <div class="card-body">
                                <div id="optionalTasks" class="task-list">
                                    <!-- Tasks will be populated by JavaScript -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Progress Summary -->
                <div class="card">
                    <div class="card-body">
                        <h3 class="mb-3">Assessment Progress</h3>
                        <div class="row text-center">
                            <div class="col-3">
                                <div class="progress-stat">
                                    <div class="h4 mb-1 text-danger" id="criticalCount">0</div>
                                    <small class="text-muted">Critical</small>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="progress-stat">
                                    <div class="h4 mb-1 text-warning" id="importantCount">0</div>
                                    <small class="text-muted">Important</small>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="progress-stat">
                                    <div class="h4 mb-1 text-primary" id="routineCount">0</div>
                                    <small class="text-muted">Routine</small>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="progress-stat">
                                    <div class="h4 mb-1 text-muted" id="optionalCount">0</div>
                                    <small class="text-muted">Optional</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
