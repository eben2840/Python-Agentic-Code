<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jane Doe - Patient Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Patient Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card patient-header">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="patient-avatar me-3">
                                <i class="fas fa-user-circle text-muted"></i>
                            </div>
                            <div>
                                <h4 class="mb-1" id="patientName">Loading...</h4>
                                <div class="patient-info">
                                    <span class="badge bg-light text-dark me-2" id="patientGender">
                                        <i class="fas fa-venus-mars me-1"></i>
                                        Loading...
                                    </span>
                                    <span class="badge bg-light text-dark" id="patientDOB">
                                        <i class="fas fa-calendar me-1"></i>
                                        Loading...
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row">
            <!-- Observations -->
            <div class="col-lg-4 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-chart-line text-primary me-2"></i>
                            Observations
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="observationsList">
                            <div class="text-center text-muted py-3">
                                <i class="fas fa-spinner fa-spin"></i>
                                Loading observations...
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Encounters -->
            <div class="col-lg-4 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-hospital text-success me-2"></i>
                            Encounters
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="encountersList">
                            <div class="text-center text-muted py-3">
                                <i class="fas fa-spinner fa-spin"></i>
                                Loading encounters...
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Medications -->
            <div class="col-lg-4 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-pills text-warning me-2"></i>
                            Medications
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="medicationsList">
                            <div class="text-center text-muted py-3">
                                <i class="fas fa-spinner fa-spin"></i>
                                Loading medications...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient Not Found Alert -->
        <div class="row" id="patientNotFound" style="display: none;">
            <div class="col-12">
                <div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    Patient named "Jane" not found in the system.
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
