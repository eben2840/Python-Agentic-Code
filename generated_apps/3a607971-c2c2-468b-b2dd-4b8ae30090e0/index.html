<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Assessment & Triage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <h1><i class="fas fa-stethoscope text-primary me-2"></i>Assessment & Triage Center</h1>
                    <p class="text-muted mb-0">Comprehensive patient evaluation and documentation</p>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Patient List & Assessment Panel -->
            <div class="col-lg-8">
                <!-- Quick Stats -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-primary">
                                <i class="fas fa-users"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="totalPatients">0</div>
                                <div class="stat-label">Total Patients</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-danger">
                                <i class="fas fa-exclamation-triangle"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="criticalPatients">0</div>
                                <div class="stat-label">Critical</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-warning">
                                <i class="fas fa-clock"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="pendingAssessments">0</div>
                                <div class="stat-label">Pending</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-success">
                                <i class="fas fa-check-circle"></i>
                            </div>
                            <div class="stat-content">
                                <div class="stat-number" id="completedAssessments">0</div>
                                <div class="stat-label">Completed</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Patient Assessment List -->
                <div class="assessment-card">
                    <div class="card-header">
                        <h5><i class="fas fa-clipboard-list me-2"></i>Patient Assessment Queue</h5>
                        <div class="header-controls">
                            <select class="form-select form-select-sm" id="priorityFilter">
                                <option value="">All Priorities</option>
                                <option value="critical">Critical</option>
                                <option value="urgent">Urgent</option>
                                <option value="routine">Routine</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="patientAssessmentList">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Documentation Form -->
            <div class="col-lg-4">
                <div class="documentation-card">
                    <div class="card-header">
                        <h5><i class="fas fa-file-medical me-2"></i>Assessment Documentation</h5>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="clearForm">
                            <i class="fas fa-refresh me-1"></i>Clear
                        </button>
                    </div>
                    <div class="card-body">
                        <form id="assessmentForm">
                            <!-- Patient Selection -->
                            <div class="mb-3">
                                <label class="form-label">Patient</label>
                                <select class="form-select" id="selectedPatient" required>
                                    <option value="">Select patient...</option>
                                </select>
                            </div>

                            <!-- Triage Priority -->
                            <div class="mb-3">
                                <label class="form-label">Triage Priority</label>
                                <select class="form-select" id="triagePriority" required>
                                    <option value="">Select priority...</option>
                                    <option value="critical">Critical - Immediate</option>
                                    <option value="urgent">Urgent - 30 minutes</option>
                                    <option value="routine">Routine - 2 hours</option>
                                </select>
                            </div>

                            <!-- Chief Complaint -->
                            <div class="mb-3">
                                <label class="form-label">Chief Complaint</label>
                                <textarea class="form-control" id="chiefComplaint" rows="2" placeholder="Primary reason for visit..."></textarea>
                            </div>

                            <!-- Vital Signs -->
                            <div class="mb-3">
                                <label class="form-label">Current Vital Signs</label>
                                <div class="vital-signs-grid">
                                    <input type="text" class="form-control" id="bloodPressure" placeholder="BP (e.g., 120/80)">
                                    <input type="text" class="form-control" id="heartRate" placeholder="HR (bpm)">
                                    <input type="text" class="form-control" id="temperature" placeholder="Temp (°C)">
                                    <input type="text" class="form-control" id="oxygenSat" placeholder="O2 Sat (%)">
                                </div>
                            </div>

                            <!-- Assessment -->
                            <div class="mb-3">
                                <label class="form-label">Clinical Assessment</label>
                                <textarea class="form-control" id="clinicalAssessment" rows="3" placeholder="Clinical findings and assessment..."></textarea>
                            </div>

                            <!-- Plan -->
                            <div class="mb-3">
                                <label class="form-label">Treatment Plan</label>
                                <textarea class="form-control" id="treatmentPlan" rows="3" placeholder="Immediate actions and treatment plan..."></textarea>
                            </div>

                            <!-- Follow-up -->
                            <div class="mb-3">
                                <label class="form-label">Follow-up Required</label>
                                <select class="form-select" id="followupRequired">
                                    <option value="none">No follow-up needed</option>
                                    <option value="24h">24 hours</option>
                                    <option value="48h">48 hours</option>
                                    <option value="1week">1 week</option>
                                    <option value="specialist">Specialist referral</option>
                                </select>
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>Save Assessment
                                </button>
                                <button type="button" class="btn btn-outline-success" id="completeAssessment">
                                    <i class="fas fa-check me-2"></i>Complete & Discharge
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Recent Assessments -->
                <div class="recent-assessments-card mt-4">
                    <div class="card-header">
                        <h6><i class="fas fa-history me-2"></i>Recent Assessments</h6>
                    </div>
                    <div class="card-body">
                        <div id="recentAssessments">
                            <p class="text-muted text-center">No recent assessments</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
