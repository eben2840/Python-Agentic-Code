<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Dashboard - Sienna Adams</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row">
            <div class="col-12">
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="patient-avatar me-3">
                                <i class="fas fa-user-circle text-muted"></i>
                            </div>
                            <div>
                                <h1 class="mb-1" id="patientName">Loading...</h1>
                                <p class="text-muted mb-0" id="patientId">Patient ID: Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-stethoscope text-danger me-2"></i>
                            Medical Conditions
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="conditionsList">
                            <div class="text-center text-muted">
                                <i class="fas fa-spinner fa-spin"></i>
                                Loading conditions...
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-pills text-primary me-2"></i>
                            Medications
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="medicationsList">
                            <div class="text-center text-muted">
                                <i class="fas fa-spinner fa-spin"></i>
                                Loading medications...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-clipboard-list text-warning me-2"></i>
                            Clinical Observations
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="observationsList">
                            <div class="text-center text-muted">
                                <i class="fas fa-spinner fa-spin"></i>
                                Loading observations...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
