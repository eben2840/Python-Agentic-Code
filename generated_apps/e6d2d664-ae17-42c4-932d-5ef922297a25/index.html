<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard - Rose Hall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Patient Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="patient-header-card">
                    <div class="d-flex align-items-center">
                        <div class="patient-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="ms-3">
                            <h1 class="patient-name mb-1" id="patientName">Loading...</h1>
                            <div class="patient-details">
                                <span class="detail-item" id="patientGender">
                                    <i class="fas fa-venus-mars me-1"></i>Loading...
                                </span>
                                <span class="detail-item" id="patientAge">
                                    <i class="fas fa-calendar me-1"></i>Loading...
                                </span>
                                <span class="detail-item" id="patientId">
                                    <i class="fas fa-id-card me-1"></i>Loading...
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Observations Section -->
            <div class="col-lg-6 mb-4">
                <div class="data-card">
                    <div class="card-header">
                        <i class="fas fa-chart-line text-teal me-2"></i>
                        <h5 class="mb-0">Observations</h5>
                    </div>
                    <div class="card-body">
                        <div id="observationsContent">
                            <div class="loading-state">
                                <i class="fas fa-spinner fa-spin me-2"></i>Loading observations...
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Encounters Section -->
            <div class="col-lg-6 mb-4">
                <div class="data-card">
                    <div class="card-header">
                        <i class="fas fa-hospital text-blue me-2"></i>
                        <h5 class="mb-0">Encounters</h5>
                    </div>
                    <div class="card-body">
                        <div id="encountersContent">
                            <div class="loading-state">
                                <i class="fas fa-spinner fa-spin me-2"></i>Loading encounters...
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Medications Section -->
            <div class="col-lg-6 mb-4">
                <div class="data-card">
                    <div class="card-header">
                        <i class="fas fa-pills text-green me-2"></i>
                        <h5 class="mb-0">Medications</h5>
                    </div>
                    <div class="card-body">
                        <div id="medicationsContent">
                            <div class="loading-state">
                                <i class="fas fa-spinner fa-spin me-2"></i>Loading medications...
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ward & Room Section -->
            <div class="col-lg-6 mb-4">
                <div class="data-card">
                    <div class="card-header">
                        <i class="fas fa-bed text-purple me-2"></i>
                        <h5 class="mb-0">Ward & Room Information</h5>
                    </div>
                    <div class="card-body">
                        <div id="wardRoomContent">
                            <div class="loading-state">
                                <i class="fas fa-spinner fa-spin me-2"></i>Loading location data...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Current Conditions -->
        <div class="row">
            <div class="col-12">
                <div class="data-card">
                    <div class="card-header">
                        <i class="fas fa-stethoscope text-red me-2"></i>
                        <h5 class="mb-0">Current Conditions</h5>
                    </div>
                    <div class="card-body">
                        <div id="conditionsContent">
                            <div class="loading-state">
                                <i class="fas fa-spinner fa-spin me-2"></i>Loading conditions...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
