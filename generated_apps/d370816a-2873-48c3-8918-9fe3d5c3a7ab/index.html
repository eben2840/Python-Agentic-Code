<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Intake & Output Chart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <h1 class="card-title mb-1">
                                    <i class="fas fa-tint text-primary me-2"></i>
                                    Fluid Intake & Output Chart
                                </h1>
                                <p class="text-muted mb-0">Monitor fluid balance across all patients</p>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-outline-primary btn-sm" id="refreshBtn">
                                    <i class="fas fa-sync-alt me-1"></i>
                                    Refresh
                                </button>
                                <button class="btn btn-primary btn-sm" id="addEntryBtn">
                                    <i class="fas fa-plus me-1"></i>
                                    Add Entry
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row mb-4" id="summaryCards">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="summary-icon intake">
                            <i class="fas fa-arrow-down"></i>
                        </div>
                        <h3 class="mb-1" id="totalIntake">0 mL</h3>
                        <p class="text-muted mb-0">Total Intake</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="summary-icon output">
                            <i class="fas fa-arrow-up"></i>
                        </div>
                        <h3 class="mb-1" id="totalOutput">0 mL</h3>
                        <p class="text-muted mb-0">Total Output</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="summary-icon balance">
                            <i class="fas fa-balance-scale"></i>
                        </div>
                        <h3 class="mb-1" id="netBalance">0 mL</h3>
                        <p class="text-muted mb-0">Net Balance</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="summary-icon patients">
                            <i class="fas fa-users"></i>
                        </div>
                        <h3 class="mb-1" id="activePatients">0</h3>
                        <p class="text-muted mb-0">Active Patients</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Filter by Patient</label>
                                <select class="form-select" id="patientFilter">
                                    <option value="">All Patients</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Entry Type</label>
                                <select class="form-select" id="typeFilter">
                                    <option value="">All Types</option>
                                    <option value="intake">Intake Only</option>
                                    <option value="output">Output Only</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Date Range</label>
                                <select class="form-select" id="dateFilter">
                                    <option value="today">Today</option>
                                    <option value="week">This Week</option>
                                    <option value="month">This Month</option>
                                    <option value="all">All Time</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient Charts -->
        <div class="row" id="patientCharts">
            <!-- Charts will be populated by JavaScript -->
        </div>

        <!-- No Data Message -->
        <div class="row" id="noDataMessage" style="display: none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-body text-center py-5">
                        <i class="fas fa-chart-line text-muted mb-3" style="font-size: 3rem;"></i>
                        <h4 class="text-muted">No fluid data available</h4>
                        <p class="text-muted">No fluid intake or output records found for the selected criteria.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Entry Modal -->
    <div class="modal fade" id="addEntryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Fluid Entry</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addEntryForm">
                        <div class="mb-3">
                            <label class="form-label">Patient</label>
                            <select class="form-select" id="entryPatient" required>
                                <option value="">Select Patient</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Type</label>
                            <select class="form-select" id="entryType" required>
                                <option value="">Select Type</option>
                                <option value="intake">Intake</option>
                                <option value="output">Output</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Volume (mL)</label>
                            <input type="number" class="form-control" id="entryVolume" min="0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <input type="text" class="form-control" id="entryDescription" placeholder="e.g., Water, Urine, IV Fluid">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Time</label>
                            <input type="datetime-local" class="form-control" id="entryTime" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveEntryBtn">Save Entry</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
