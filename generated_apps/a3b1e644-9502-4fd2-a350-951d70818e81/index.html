<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT Ward Patient Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="icon-circle me-3">
                                <i class="fas fa-user-md"></i>
                            </div>
                            <div>
                                <h1 class="h3 mb-1">ENT Ward Patient Overview</h1>
                                <p class="text-muted mb-0">Patient census and condition summary</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Summary Stats -->
                <div class="row mb-4">
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card stat-card">
                            <div class="card-body text-center">
                                <div class="stat-icon mb-2">
                                    <i class="fas fa-hospital-user"></i>
                                </div>
                                <h3 class="stat-number mb-1" id="totalPatients">0</h3>
                                <p class="text-muted mb-0">Total ENT Patients</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card stat-card">
                            <div class="card-body text-center">
                                <div class="stat-icon mb-2">
                                    <i class="fas fa-stethoscope"></i>
                                </div>
                                <h3 class="stat-number mb-1" id="totalConditions">0</h3>
                                <p class="text-muted mb-0">Active Conditions</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card stat-card">
                            <div class="card-body text-center">
                                <div class="stat-icon mb-2">
                                    <i class="fas fa-bed"></i>
                                </div>
                                <h3 class="stat-number mb-1" id="entRooms">0</h3>
                                <p class="text-muted mb-0">ENT Rooms</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Patient List -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-users me-2"></i>
                            ENT Ward Patients & Conditions
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="patientList" class="row">
                            <!-- Patients will be populated here -->
                        </div>
                        <div id="noData" class="text-center py-5" style="display: none;">
                            <i class="fas fa-info-circle text-muted mb-3" style="font-size: 3rem;"></i>
                            <h5 class="text-muted">No ENT Ward patients found</h5>
                            <p class="text-muted">No patients are currently assigned to ENT ward rooms.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
