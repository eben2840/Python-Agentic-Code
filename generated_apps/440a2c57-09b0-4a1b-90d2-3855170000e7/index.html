<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Vitals Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body d-flex align-items-center">
                        <div class="me-3">
                            <i class="fas fa-heartbeat text-danger fs-3"></i>
                        </div>
                        <div>
                            <h1 class="mb-1">Patient Vitals Dashboard</h1>
                            <p class="text-muted mb-0" id="patientInfo">Loading patient information...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vital Signs Grid -->
        <div class="row g-3" id="vitalsGrid">
            <!-- Vitals will be populated here -->
        </div>

        <!-- Recent Observations -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h3 class="mb-0">
                            <i class="fas fa-chart-line text-primary me-2"></i>
                            Recent Observations
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Measurement</th>
                                        <th>Value</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="observationsTable">
                                    <!-- Observations will be populated here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
