<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Conditions - Healthcare App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body py-3">
                        <div class="d-flex align-items-center">
                            <div class="icon-circle me-3">
                                <i class="fas fa-user-injured text-primary"></i>
                            </div>
                            <div>
                                <h5 class="mb-1" id="patientName">Loading...</h5>
                                <p class="text-muted mb-0">Medical Conditions Overview</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Conditions List -->
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center">
                                <i class="fas fa-list-ul text-danger me-2"></i>
                                <h6 class="mb-0">All Conditions (High to Low Severity)</h6>
                            </div>
                            <span class="badge bg-light text-dark" id="conditionsCount">0 conditions</span>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="conditionsList" class="conditions-container">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="text-muted mt-2">Loading conditions...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
