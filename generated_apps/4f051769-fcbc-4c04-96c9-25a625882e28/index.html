<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-user-md text-primary me-3" style="font-size: 1.5rem;"></i>
                            <div>
                                <h1 class="mb-1" id="patientName">Patient Dashboard</h1>
                                <p class="text-muted mb-0" id="patientInfo">Loading patient information...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-heartbeat text-danger mb-3" style="font-size: 2rem;"></i>
                        <h3>Vital Signs</h3>
                        <div id="vitalSigns" class="mt-3">
                            <div class="text-muted">No vital signs data</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-stethoscope text-info mb-3" style="font-size: 2rem;"></i>
                        <h3>Conditions</h3>
                        <div id="conditions" class="mt-3">
                            <div class="text-muted">No conditions data</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-pills text-success mb-3" style="font-size: 2rem;"></i>
                        <h3>Medications</h3>
                        <div id="medications" class="mt-3">
                            <div class="text-muted">No medications data</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-3">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-exclamation-triangle text-warning mb-3" style="font-size: 2rem;"></i>
                        <h3>Allergies</h3>
                        <div id="allergies" class="mt-3">
                            <div class="text-muted">No allergies data</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-chart-line text-primary me-2"></i>
                            Recent Observations
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="observations" class="table-responsive">
                            <div class="text-muted text-center py-4">No observations data available</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
