<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wounds & Vitals Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex align-items-center mb-3">
                    <i class="fas fa-user-injured text-danger me-3" style="font-size: 1.5rem;"></i>
                    <div>
                        <h1 class="mb-0" id="patientName">Patient Dashboard</h1>
                        <p class="text-muted mb-0" id="patientInfo">Loading patient information...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Wounds Section -->
            <div class="col-lg-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-bandage text-danger me-2"></i>
                            <h2 class="mb-0">Wounds & Injuries</h2>
                            <span class="badge bg-light text-dark ms-auto" id="woundCount">0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="woundsContainer">
                            <div class="text-center text-muted py-4">
                                <i class="fas fa-search fa-2x mb-2 opacity-50"></i>
                                <p>Loading wound data...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Vital Signs Section -->
            <div class="col-lg-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-heartbeat text-danger me-2"></i>
                            <h2 class="mb-0">Vital Signs</h2>
                            <span class="badge bg-light text-dark ms-auto" id="vitalCount">0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="vitalsContainer">
                            <div class="text-center text-muted py-4">
                                <i class="fas fa-search fa-2x mb-2 opacity-50"></i>
                                <p>Loading vital signs...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Observations -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-clipboard-list text-primary me-2"></i>
                            <h2 class="mb-0">All Observations</h2>
                            <span class="badge bg-light text-dark ms-auto" id="obsCount">0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="observationsContainer">
                            <div class="text-center text-muted py-4">
                                <i class="fas fa-search fa-2x mb-2 opacity-50"></i>
                                <p>Loading observations...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
