<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Patient Conditions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-stethoscope text-teal me-3"></i>
                        <h1 class="mb-0">All Patient Conditions</h1>
                    </div>
                    <p class="text-muted mb-0">Complete overview of conditions across all patients</p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="summary-card mb-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="stat-item">
                                <i class="fas fa-users text-blue"></i>
                                <div>
                                    <div class="stat-number" id="totalPatients">0</div>
                                    <div class="stat-label">Total Patients</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="stat-item">
                                <i class="fas fa-clipboard-list text-green"></i>
                                <div>
                                    <div class="stat-number" id="totalConditions">0</div>
                                    <div class="stat-label">Total Conditions</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="stat-item">
                                <i class="fas fa-exclamation-triangle text-warning"></i>
                                <div>
                                    <div class="stat-number" id="activeConditions">0</div>
                                    <div class="stat-label">Active Conditions</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="conditionsContainer">
            <!-- Patient condition cards will be dynamically inserted here -->
        </div>

        <div class="row" id="noDataContainer" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <i class="fas fa-clipboard-list text-muted"></i>
                    <h3>No Conditions Available</h3>
                    <p>No condition data found for any patients.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
