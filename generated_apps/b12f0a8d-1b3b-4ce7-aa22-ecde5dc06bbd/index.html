<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward and Room Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-hospital-alt me-3 text-primary"></i>
                        <div>
                            <h1 class="mb-0">Ward and Room Directory</h1>
                            <p class="text-muted mb-0">Hospital facility locations</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="stats-row mb-4">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-door-open"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-number" id="totalLocations">0</div>
                            <div class="stat-label">Total Locations</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-hospital"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-number" id="totalWards">0</div>
                            <div class="stat-label">Wards</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-bed"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-number" id="totalRooms">0</div>
                            <div class="stat-label">Rooms</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-6 mb-4">
                <div class="location-card">
                    <div class="card-header">
                        <h3><i class="fas fa-hospital me-2"></i>Wards</h3>
                    </div>
                    <div class="card-body">
                        <div id="wardsList" class="locations-list">
                            <div class="no-data">No ward data available</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 mb-4">
                <div class="location-card">
                    <div class="card-header">
                        <h3><i class="fas fa-bed me-2"></i>Rooms</h3>
                    </div>
                    <div class="card-body">
                        <div id="roomsList" class="locations-list">
                            <div class="no-data">No room data available</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="location-card">
                    <div class="card-header">
                        <h3><i class="fas fa-list me-2"></i>All Locations</h3>
                    </div>
                    <div class="card-body">
                        <div id="allLocationsList" class="locations-grid">
                            <div class="no-data">No location data available</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
