<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Information - Rose Hall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <!-- Patient Header -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="icon-circle me-3">
                                <i class="fas fa-user-md text-primary"></i>
                            </div>
                            <div>
                                <h4 class="mb-1" id="patientName">Loading...</h4>
                                <div class="text-muted small" id="patientDetails">Loading patient information...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <!-- Patient Words/Information -->
                    <div class="col-12 col-lg-8 mb-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">
                                    <i class="fas fa-notes-medical text-teal me-2"></i>
                                    Patient Information
                                </h5>
                            </div>
                            <div class="card-body">
                                <!-- Conditions -->
                                <div class="info-section mb-4">
                                    <h6 class="section-title">
                                        <i class="fas fa-stethoscope text-danger me-2"></i>
                                        Current Conditions
                                    </h6>
                                    <div id="conditionsContent">
                                        <div class="loading-text">Loading conditions...</div>
                                    </div>
                                </div>

                                <!-- Medications -->
                                <div class="info-section mb-4">
                                    <h6 class="section-title">
                                        <i class="fas fa-pills text-success me-2"></i>
                                        Current Medications
                                    </h6>
                                    <div id="medicationsContent">
                                        <div class="loading-text">Loading medications...</div>
                                    </div>
                                </div>

                                <!-- Recent Observations -->
                                <div class="info-section">
                                    <h6 class="section-title">
                                        <i class="fas fa-chart-line text-info me-2"></i>
                                        Recent Test Results
                                    </h6>
                                    <div id="observationsContent">
                                        <div class="loading-text">Loading observations...</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Room Information -->
                    <div class="col-12 col-lg-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">
                                    <i class="fas fa-map-marker-alt text-primary me-2"></i>
                                    Current Location
                                </h5>
                            </div>
                            <div class="card-body text-center">
                                <div id="roomContent">
                                    <div class="loading-text">Loading room information...</div>
                                </div>
                            </div>
                        </div>

                        <!-- Encounter Status -->
                        <div class="card mt-4">
                            <div class="card-header">
                                <h5 class="mb-0">
                                    <i class="fas fa-calendar-check text-warning me-2"></i>
                                    Visit Status
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="encounterContent">
                                    <div class="loading-text">Loading encounter status...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
