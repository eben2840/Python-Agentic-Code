<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Ward Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-hospital text-primary me-3 fs-2"></i>
                        <div>
                            <h1 class="mb-1">Hospital Ward Directory</h1>
                            <p class="text-muted mb-0">Complete overview of all hospital wards and their current occupancy</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ward Overview Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="section-card">
                    <div class="section-header">
                        <h2><i class="fas fa-building text-primary me-2"></i>All Hospital Wards</h2>
                        <span id="totalWards" class="badge bg-primary">0</span>
                    </div>
                    <div id="wardsGrid" class="row g-3">
                        <!-- Wards will be populated here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Ward Statistics -->
        <div class="row mb-4">
            <div class="col-lg-8 mb-4">
                <div class="section-card">
                    <div class="section-header">
                        <h3><i class="fas fa-chart-bar text-success me-2"></i>Ward Occupancy Overview</h3>
                    </div>
                    <div id="wardOccupancy" class="ward-list">
                        <!-- Ward occupancy will be populated here -->
                    </div>
                </div>
            </div>
            <div class="col-lg-4 mb-4">
                <div class="section-card">
                    <div class="section-header">
                        <h3><i class="fas fa-info-circle text-info me-2"></i>Ward Summary</h3>
                    </div>
                    <div id="wardSummary" class="stats-container">
                        <!-- Ward summary will be populated here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient Distribution -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="section-card">
                    <div class="section-header">
                        <h3><i class="fas fa-users text-warning me-2"></i>Patient Distribution by Ward</h3>
                    </div>
                    <div id="patientDistribution" class="patients-by-ward">
                        <!-- Patient distribution will be populated here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Statistics -->
        <div class="row mt-4">
            <div class="col-md-3 mb-3">
                <div class="stat-card bg-primary">
                    <div class="stat-icon">
                        <i class="fas fa-building"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-number" id="totalWardsStat">0</div>
                        <div class="stat-label">Total Wards</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="stat-card bg-success">
                    <div class="stat-icon">
                        <i class="fas fa-user-friends"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-number" id="totalPatientsStat">0</div>
                        <div class="stat-label">Total Patients</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="stat-card bg-warning">
                    <div class="stat-icon">
                        <i class="fas fa-percentage"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-number" id="avgOccupancyStat">0%</div>
                        <div class="stat-label">Avg Occupancy</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="stat-card bg-info">
                    <div class="stat-icon">
                        <i class="fas fa-trophy"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-number" id="busiestWardStat">-</div>
                        <div class="stat-label">Busiest Ward</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
