<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Conditions - Patients 30+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center">
                        <div class="icon-wrapper me-3">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div>
                            <h1 class="mb-1">Critical Conditions</h1>
                            <p class="text-muted mb-0">Patients aged 30+ with high-priority conditions</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="summary-card mb-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="stat-item">
                                <div class="stat-value" id="totalPatients">-</div>
                                <div class="stat-label">Total Patients</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="stat-item">
                                <div class="stat-value" id="criticalConditions">-</div>
                                <div class="stat-label">Critical Conditions</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="stat-item">
                                <div class="stat-value" id="avgAge">-</div>
                                <div class="stat-label">Average Age</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="patientsContainer">
            <!-- Patient cards will be dynamically inserted here -->
        </div>

        <div class="row" id="noDataContainer" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <div class="text-center">
                        <i class="fas fa-info-circle mb-3"></i>
                        <h3>No Critical Conditions Found</h3>
                        <p class="text-muted">No patients aged 30+ with critical conditions were found in the current dataset.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
