<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Room - Vital Signs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h1 class="mb-1"><i class="fas fa-hospital-alt text-danger me-2"></i>Emergency Room</h1>
                            <p class="text-muted mb-0">Patient Vital Signs Management</p>
                        </div>
                        <div class="text-end">
                            <div class="badge bg-light text-dark fs-6 px-3 py-2">
                                <i class="fas fa-users me-1"></i>
                                <span id="patientCount">0</span> Patients
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ER Patient Board -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="main-card">
                    <div class="card-header d-flex align-items-center justify-content-between">
                        <h5 class="mb-0"><i class="fas fa-bed text-primary me-2"></i>ER Patient Board</h5>
                        <button class="btn btn-outline-primary btn-sm" onclick="refreshPatients()">
                            <i class="fas fa-sync-alt me-1"></i>Refresh
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div id="patientBoard" class="patient-board">
                            <!-- Patients will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vital Signs Input Modal -->
        <div class="modal fade" id="vitalSignsModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="fas fa-heartbeat text-danger me-2"></i>
                            Record Vital Signs - <span id="modalPatientName"></span>
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="vitalSignsForm">
                            <div class="row g-3">
                                <!-- Blood Pressure -->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        <i class="fas fa-tint text-danger me-1"></i>Blood Pressure
                                    </label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="systolic" placeholder="Systolic">
                                        <span class="input-group-text">/</span>
                                        <input type="number" class="form-control" id="diastolic" placeholder="Diastolic">
                                        <span class="input-group-text">mmHg</span>
                                    </div>
                                </div>

                                <!-- Heart Rate -->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        <i class="fas fa-heartbeat text-danger me-1"></i>Heart Rate
                                    </label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="heartRate" placeholder="80">
                                        <span class="input-group-text">bpm</span>
                                    </div>
                                </div>

                                <!-- Temperature -->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        <i class="fas fa-thermometer-half text-warning me-1"></i>Temperature
                                    </label>
                                    <div class="input-group">
                                        <input type="number" step="0.1" class="form-control" id="temperature" placeholder="36.5">
                                        <span class="input-group-text">°C</span>
                                    </div>
                                </div>

                                <!-- Respiratory Rate -->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        <i class="fas fa-lungs text-info me-1"></i>Respiratory Rate
                                    </label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="respiratoryRate" placeholder="16">
                                        <span class="input-group-text">breaths/min</span>
                                    </div>
                                </div>

                                <!-- Oxygen Saturation -->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        <i class="fas fa-wind text-primary me-1"></i>Oxygen Saturation
                                    </label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="oxygenSat" placeholder="98">
                                        <span class="input-group-text">%</span>
                                    </div>
                                </div>

                                <!-- Pain Scale -->
                                <div class="col-md-6">
                                    <label class="form-label">
                                        <i class="fas fa-exclamation-triangle text-warning me-1"></i>Pain Scale
                                    </label>
                                    <div class="input-group">
                                        <input type="number" min="0" max="10" class="form-control" id="painScale" placeholder="0">
                                        <span class="input-group-text">/10</span>
                                    </div>
                                </div>

                                <!-- Notes -->
                                <div class="col-12">
                                    <label class="form-label">
                                        <i class="fas fa-notes-medical text-secondary me-1"></i>Clinical Notes
                                    </label>
                                    <textarea class="form-control" id="clinicalNotes" rows="3" placeholder="Additional observations or notes..."></textarea>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="saveVitalSigns()">
                            <i class="fas fa-save me-1"></i>Save Vital Signs
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Success Alert -->
        <div id="successAlert" class="alert alert-success alert-dismissible fade" role="alert" style="display: none;">
            <i class="fas fa-check-circle me-2"></i>
            <span id="successMessage"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
