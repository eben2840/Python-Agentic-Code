<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="patient-avatar me-3">
                                <i class="fas fa-user-circle text-muted"></i>
                            </div>
                            <div>
                                <h1 class="mb-1" id="patientName">Sienna Adams</h1>
                                <p class="text-muted mb-0">Patient ID: <span id="patientId">17a4369b-2ea2-4b63-9681-4660498aafdc</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Dashboard Column -->
            <div class="col-lg-8 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-chart-line text-primary me-2"></i>Patient Dashboard</h2>
                    </div>
                    <div class="card-body">
                        <!-- Conditions Section -->
                        <div class="mb-4">
                            <h3 class="mb-3"><i class="fas fa-stethoscope text-danger me-2"></i>Active Conditions</h3>
                            <div id="conditionsContainer" class="row">
                                <!-- Conditions will be populated here -->
                            </div>
                        </div>

                        <!-- Medications Section -->
                        <div class="mb-4">
                            <h3 class="mb-3"><i class="fas fa-pills text-success me-2"></i>Medications</h3>
                            <div id="medicationsContainer" class="row">
                                <!-- Medications will be populated here -->
                            </div>
                        </div>

                        <!-- Observations Section -->
                        <div class="mb-4">
                            <h3 class="mb-3"><i class="fas fa-clipboard-list text-info me-2"></i>Recent Observations</h3>
                            <div id="observationsContainer" class="row">
                                <!-- Observations will be populated here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Wound Assessment Form Column -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-band-aid text-warning me-2"></i>Wound Assessment</h2>
                    </div>
                    <div class="card-body">
                        <form id="woundForm">
                            <div class="mb-3">
                                <label for="woundLocation" class="form-label">Wound Location</label>
                                <select class="form-select" id="woundLocation" required>
                                    <option value="">Select location...</option>
                                    <option value="left-leg">Left Leg</option>
                                    <option value="right-leg">Right Leg</option>
                                    <option value="left-arm">Left Arm</option>
                                    <option value="right-arm">Right Arm</option>
                                    <option value="chest">Chest</option>
                                    <option value="back">Back</option>
                                    <option value="abdomen">Abdomen</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="woundType" class="form-label">Wound Type</label>
                                <select class="form-select" id="woundType" required>
                                    <option value="">Select type...</option>
                                    <option value="pressure-ulcer">Pressure Ulcer</option>
                                    <option value="surgical">Surgical Wound</option>
                                    <option value="traumatic">Traumatic Wound</option>
                                    <option value="diabetic-ulcer">Diabetic Ulcer</option>
                                    <option value="venous-ulcer">Venous Ulcer</option>
                                </select>
                            </div>

                            <div class="row mb-3">
                                <div class="col-6">
                                    <label for="woundLength" class="form-label">Length (cm)</label>
                                    <input type="number" class="form-control" id="woundLength" step="0.1" min="0">
                                </div>
                                <div class="col-6">
                                    <label for="woundWidth" class="form-label">Width (cm)</label>
                                    <input type="number" class="form-control" id="woundWidth" step="0.1" min="0">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="woundDepth" class="form-label">Depth (cm)</label>
                                <input type="number" class="form-control" id="woundDepth" step="0.1" min="0">
                            </div>

                            <div class="mb-3">
                                <label for="woundStage" class="form-label">Wound Stage</label>
                                <select class="form-select" id="woundStage">
                                    <option value="">Select stage...</option>
                                    <option value="stage-1">Stage 1</option>
                                    <option value="stage-2">Stage 2</option>
                                    <option value="stage-3">Stage 3</option>
                                    <option value="stage-4">Stage 4</option>
                                    <option value="unstageable">Unstageable</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="woundDrainage" class="form-label">Drainage</label>
                                <select class="form-select" id="woundDrainage">
                                    <option value="none">None</option>
                                    <option value="minimal">Minimal</option>
                                    <option value="moderate">Moderate</option>
                                    <option value="heavy">Heavy</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="woundNotes" class="form-label">Assessment Notes</label>
                                <textarea class="form-control" id="woundNotes" rows="3" placeholder="Enter assessment notes..."></textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>Save Assessment
                                </button>
                            </div>
                        </form>

                        <!-- Recent Assessments -->
                        <div class="mt-4">
                            <h3 class="mb-3">Recent Assessments</h3>
                            <div id="recentAssessments" class="assessment-list">
                                <!-- Recent assessments will be populated here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
