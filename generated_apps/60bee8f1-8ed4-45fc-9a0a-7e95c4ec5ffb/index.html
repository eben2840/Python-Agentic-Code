<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Emergency Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-exclamation-triangle text-danger me-3" style="font-size: 1.5rem;"></i>
                        <div>
                            <h1 class="mb-1">Clinical Emergency Review</h1>
                            <p class="text-muted mb-0">24-72 Hour Risk Assessment</p>
                        </div>
                    </div>
                    <div class="alert-summary mt-3" id="alertSummary">
                        <div class="row text-center">
                            <div class="col-4">
                                <div class="summary-item critical">
                                    <div class="count" id="criticalCount">0</div>
                                    <div class="label">Critical</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="summary-item high">
                                    <div class="count" id="highCount">0</div>
                                    <div class="label">High</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="summary-item monitor">
                                    <div class="count" id="monitorCount">0</div>
                                    <div class="label">Monitor</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div id="emergencyAlerts"></div>
                <div id="noAlertsMessage" class="text-center py-5" style="display: none;">
                    <i class="fas fa-check-circle text-success mb-3" style="font-size: 3rem;"></i>
                    <h3 class="text-success">No Active Clinical Emergencies</h3>
                    <p class="text-muted">All patients appear stable with no urgent concerns identified for the next 24-72 hours.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
