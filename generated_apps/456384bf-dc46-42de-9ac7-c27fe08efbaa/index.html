<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Encounters Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex align-items-center mb-4">
                    <div class="icon-circle me-3">
                        <i class="fas fa-calendar-check text-primary"></i>
                    </div>
                    <div>
                        <h1 class="mb-0">Patient Encounters</h1>
                        <p class="text-muted mb-0">Healthcare visits and appointments</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <div class="stat-icon mb-2">
                            <i class="fas fa-hospital text-primary"></i>
                        </div>
                        <h3 class="mb-1" id="totalEncounters">0</h3>
                        <p class="text-muted mb-0">Total Encounters</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <div class="stat-icon mb-2">
                            <i class="fas fa-clock text-success"></i>
                        </div>
                        <h3 class="mb-1" id="recentEncounters">0</h3>
                        <p class="text-muted mb-0">This Month</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <div class="stat-icon mb-2">
                            <i class="fas fa-user-md text-teal"></i>
                        </div>
                        <h3 class="mb-1" id="uniqueProviders">0</h3>
                        <p class="text-muted mb-0">Providers</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <div class="stat-icon mb-2">
                            <i class="fas fa-stethoscope text-warning"></i>
                        </div>
                        <h3 class="mb-1" id="encounterTypes">0</h3>
                        <p class="text-muted mb-0">Visit Types</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex justify-content-between align-items-center">
                            <h2 class="mb-0">
                                <i class="fas fa-list-ul text-primary me-2"></i>
                                Encounter History
                            </h2>
                            <div class="d-flex gap-2">
                                <button class="btn btn-outline-secondary btn-sm" onclick="sortEncounters('date')">
                                    <i class="fas fa-sort-amount-down me-1"></i>Sort by Date
                                </button>
                                <button class="btn btn-outline-secondary btn-sm" onclick="sortEncounters('type')">
                                    <i class="fas fa-sort-alpha-down me-1"></i>Sort by Type
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="border-0 ps-4">Date</th>
                                        <th class="border-0">Type</th>
                                        <th class="border-0">Status</th>
                                        <th class="border-0">Provider</th>
                                        <th class="border-0">Location</th>
                                        <th class="border-0">Duration</th>
                                    </tr>
                                </thead>
                                <tbody id="encountersTable">
                                    <tr>
                                        <td colspan="6" class="text-center py-4 text-muted">
                                            <i class="fas fa-spinner fa-spin me-2"></i>Loading encounters...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
