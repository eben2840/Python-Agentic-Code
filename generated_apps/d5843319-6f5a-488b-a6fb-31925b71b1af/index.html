<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-4">
        <!-- Emergency Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card emergency-header">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h1 class="mb-1"><i class="fas fa-hospital-alt text-danger me-2"></i>Emergency Dashboard</h1>
                            <p class="mb-0 text-muted" id="patientInfo">Loading patient...</p>
                        </div>
                        <div class="emergency-status">
                            <span class="badge bg-danger-subtle text-danger fs-6 px-3 py-2">
                                <i class="fas fa-exclamation-triangle me-1"></i>ACTIVE
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Critical Vitals Row -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h2 class="mb-0"><i class="fas fa-heartbeat text-danger me-2"></i>Critical Vitals</h2>
                    </div>
                    <div class="card-body">
                        <div class="row" id="vitalsGrid">
                            <div class="col-12 text-center text-muted">
                                <i class="fas fa-spinner fa-spin me-2"></i>Loading vital signs...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Emergency Assessment Form -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h2 class="mb-0"><i class="fas fa-clipboard-check text-primary me-2"></i>Emergency Assessment</h2>
                    </div>
                    <div class="card-body">
                        <form id="emergencyForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Chief Complaint</label>
                                    <textarea class="form-control" rows="2" placeholder="Primary reason for visit..."></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Triage Level</label>
                                    <select class="form-select">
                                        <option>Level 1 - Resuscitation</option>
                                        <option>Level 2 - Emergent</option>
                                        <option>Level 3 - Urgent</option>
                                        <option>Level 4 - Less Urgent</option>
                                        <option>Level 5 - Non-Urgent</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Pain Scale (0-10)</label>
                                    <input type="range" class="form-range" min="0" max="10" value="5" id="painScale">
                                    <div class="text-center"><span id="painValue">5</span>/10</div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Consciousness</label>
                                    <select class="form-select">
                                        <option>Alert</option>
                                        <option>Verbal Response</option>
                                        <option>Pain Response</option>
                                        <option>Unresponsive</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Mobility</label>
                                    <select class="form-select">
                                        <option>Ambulatory</option>
                                        <option>Wheelchair</option>
                                        <option>Stretcher</option>
                                        <option>Immobile</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Immediate Actions Required</label>
                                <div class="row">
                                    <div class="col-md-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="oxygen">
                                            <label class="form-check-label" for="oxygen">Oxygen</label>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="ivAccess">
                                            <label class="form-check-label" for="ivAccess">IV Access</label>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="monitoring">
                                            <label class="form-check-label" for="monitoring">Cardiac Monitor</label>
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="isolation">
                                            <label class="form-check-label" for="isolation">Isolation</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-save me-1"></i>Save Assessment
                                </button>
                                <button type="button" class="btn btn-outline-primary">
                                    <i class="fas fa-print me-1"></i>Print Report
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h3 class="mb-0"><i class="fas fa-exclamation-circle text-warning me-2"></i>Active Conditions</h3>
                    </div>
                    <div class="card-body">
                        <div id="conditionsList">
                            <div class="text-center text-muted">
                                <i class="fas fa-spinner fa-spin me-2"></i>Loading conditions...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
