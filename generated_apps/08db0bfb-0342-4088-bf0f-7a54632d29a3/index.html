<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Meditation Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-lotus-position text-teal me-3"></i>
                        <h1 class="mb-0">Clinical Meditation Dashboard</h1>
                    </div>
                    <p class="text-muted mb-0">Mindfulness and stress management tracking for patient wellness</p>
                </div>
            </div>
        </div>

        <!-- Patient Overview -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title d-flex align-items-center">
                            <i class="fas fa-user-md text-blue me-2"></i>
                            Patient Overview
                        </h5>
                        <div id="patient-info" class="patient-info">
                            <!-- Patient data will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stress & Wellness Metrics -->
        <div class="row mb-4">
            <div class="col-lg-4 col-md-6 mb-3">
                <div class="metric-card">
                    <div class="metric-icon">
                        <i class="fas fa-heart-pulse text-teal"></i>
                    </div>
                    <div class="metric-content">
                        <h6>Stress Indicators</h6>
                        <div id="stress-metrics" class="metric-value">
                            <!-- Stress-related observations -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 mb-3">
                <div class="metric-card">
                    <div class="metric-icon">
                        <i class="fas fa-brain text-blue"></i>
                    </div>
                    <div class="metric-content">
                        <h6>Mental Health</h6>
                        <div id="mental-health-metrics" class="metric-value">
                            <!-- Mental health observations -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 mb-3">
                <div class="metric-card">
                    <div class="metric-icon">
                        <i class="fas fa-moon text-green"></i>
                    </div>
                    <div class="metric-content">
                        <h6>Sleep Quality</h6>
                        <div id="sleep-metrics" class="metric-value">
                            <!-- Sleep-related observations -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Meditation Recommendations -->
        <div class="row mb-4">
            <div class="col-lg-8 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title d-flex align-items-center">
                            <i class="fas fa-spa text-teal me-2"></i>
                            Recommended Meditation Practices
                        </h5>
                        <div id="meditation-recommendations" class="recommendations-grid">
                            <!-- Recommendations based on patient conditions -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title d-flex align-items-center">
                            <i class="fas fa-clock text-blue me-2"></i>
                            Session Tracker
                        </h5>
                        <div id="session-tracker" class="session-info">
                            <!-- Session tracking info -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient Conditions & Treatments -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title d-flex align-items-center">
                            <i class="fas fa-stethoscope text-green me-2"></i>
                            Clinical Context
                        </h5>
                        <div class="row">
                            <div class="col-lg-6 mb-3">
                                <h6 class="text-muted">Active Conditions</h6>
                                <div id="conditions-list" class="clinical-list">
                                    <!-- Conditions will be populated here -->
                                </div>
                            </div>
                            <div class="col-lg-6 mb-3">
                                <h6 class="text-muted">Current Medications</h6>
                                <div id="medications-list" class="clinical-list">
                                    <!-- Medications will be populated here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Observations -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title d-flex align-items-center">
                            <i class="fas fa-chart-line text-blue me-2"></i>
                            Recent Clinical Observations
                        </h5>
                        <div id="observations-timeline" class="observations-container">
                            <!-- Observations timeline -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
