<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Conditions - SMART on FHIR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center">
                        <div class="icon-wrapper me-3">
                            <i class="fas fa-stethoscope"></i>
                        </div>
                        <div>
                            <h1 class="mb-1">All Conditions</h1>
                            <p class="text-muted mb-0">Comprehensive view of patient conditions</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="summary-card mb-4">
                    <div class="row g-3">
                        <div class="col-6 col-md-3">
                            <div class="stat-item">
                                <div class="stat-value" id="totalPatients">0</div>
                                <div class="stat-label">Total Patients</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="stat-item">
                                <div class="stat-value" id="totalConditions">0</div>
                                <div class="stat-label">Total Conditions</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="stat-item">
                                <div class="stat-value" id="activeConditions">0</div>
                                <div class="stat-label">Active Conditions</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="stat-item">
                                <div class="stat-value" id="uniqueConditions">0</div>
                                <div class="stat-label">Unique Conditions</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="conditions-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="mb-0">Patient Conditions</h3>
                        <div class="search-wrapper">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" class="form-control" placeholder="Search conditions or patients...">
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="conditionsContainer">
                            <div class="no-data-message">
                                <i class="fas fa-clipboard-list"></i>
                                <p>No conditions data available</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
