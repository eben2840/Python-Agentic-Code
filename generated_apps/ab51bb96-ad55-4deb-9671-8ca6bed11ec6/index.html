<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Room Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h1 class="mb-1"><i class="fas fa-hospital-alt text-danger me-2"></i>Emergency Room Dashboard</h1>
                            <p class="text-muted mb-0">Real-time patient monitoring and vital signs capture</p>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#emergencyModal">
                                <i class="fas fa-plus me-1"></i>Emergency Info
                            </button>
                            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#vitalSignsModal">
                                <i class="fas fa-heartbeat me-1"></i>Capture Vitals
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Emergency Room Patients -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h2 class="mb-0"><i class="fas fa-users text-primary me-2"></i>Emergency Room Patients</h2>
                    </div>
                    <div class="card-body p-0">
                        <div id="patientsContainer" class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Patient</th>
                                        <th>Age</th>
                                        <th>Priority</th>
                                        <th>Chief Complaint</th>
                                        <th>Arrival Time</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="patientsTableBody">
                                    <!-- Patients will be populated here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Emergency Information Modal -->
    <div class="modal fade" id="emergencyModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-white border-bottom">
                    <h3 class="modal-title"><i class="fas fa-exclamation-triangle text-warning me-2"></i>Emergency Information</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="emergencyForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Patient ID</label>
                                <input type="text" class="form-control" id="patientId" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Priority Level</label>
                                <select class="form-select" id="priorityLevel" required>
                                    <option value="">Select Priority</option>
                                    <option value="Critical">Critical (Red)</option>
                                    <option value="Urgent">Urgent (Yellow)</option>
                                    <option value="Less Urgent">Less Urgent (Green)</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Chief Complaint</label>
                            <textarea class="form-control" id="chiefComplaint" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Allergies</label>
                                <input type="text" class="form-control" id="allergies" placeholder="None known">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Current Medications</label>
                                <input type="text" class="form-control" id="medications" placeholder="None">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Emergency Notes</label>
                            <textarea class="form-control" id="emergencyNotes" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning" onclick="saveEmergencyInfo()">
                        <i class="fas fa-save me-1"></i>Save Emergency Info
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Vital Signs Modal -->
    <div class="modal fade" id="vitalSignsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-white border-bottom">
                    <h3 class="modal-title"><i class="fas fa-heartbeat text-danger me-2"></i>Capture Vital Signs</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="vitalSignsForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Patient ID</label>
                                <input type="text" class="form-control" id="vitalPatientId" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Recorded By</label>
                                <input type="text" class="form-control" id="recordedBy" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Blood Pressure (mmHg)</label>
                                <input type="text" class="form-control" id="bloodPressure" placeholder="120/80">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Heart Rate (bpm)</label>
                                <input type="number" class="form-control" id="heartRate" placeholder="72">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Temperature (°F)</label>
                                <input type="number" step="0.1" class="form-control" id="temperature" placeholder="98.6">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Respiratory Rate</label>
                                <input type="number" class="form-control" id="respiratoryRate" placeholder="16">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Oxygen Saturation (%)</label>
                                <input type="number" class="form-control" id="oxygenSat" placeholder="98">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Pain Scale (0-10)</label>
                                <input type="number" min="0" max="10" class="form-control" id="painScale" placeholder="0">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Weight (lbs)</label>
                                <input type="number" class="form-control" id="weight" placeholder="150">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Additional Notes</label>
                            <textarea class="form-control" id="vitalNotes" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveVitalSigns()">
                        <i class="fas fa-save me-1"></i>Save Vital Signs
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
