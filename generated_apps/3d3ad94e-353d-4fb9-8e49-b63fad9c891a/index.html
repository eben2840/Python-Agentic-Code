<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Assessment Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="icon-circle me-3">
                                <i class="fas fa-user-md text-primary"></i>
                            </div>
                            <div>
                                <h1 class="mb-1" id="patientName">Patient Assessment</h1>
                                <p class="text-muted mb-0" id="patientInfo">Loading patient information...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Assessment Form -->
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h2 class="mb-0">
                            <i class="fas fa-clipboard-list text-teal me-2"></i>
                            Patient Observations & Assessment
                        </h2>
                    </div>
                    <div class="card-body">
                        <form id="assessmentForm">
                            <!-- Current Observations -->
                            <div class="mb-5">
                                <h3 class="mb-3">
                                    <i class="fas fa-heartbeat text-danger me-2"></i>
                                    Current Observations
                                </h3>
                                <div id="currentObservations" class="row g-3">
                                    <!-- Observations will be loaded here -->
                                </div>
                            </div>

                            <!-- Assessment Notes -->
                            <div class="mb-4">
                                <h3 class="mb-3">
                                    <i class="fas fa-notes-medical text-blue me-2"></i>
                                    Clinical Assessment
                                </h3>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Chief Complaint</label>
                                        <textarea class="form-control" rows="3" placeholder="Patient's primary concern..."></textarea>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Clinical Impression</label>
                                        <textarea class="form-control" rows="3" placeholder="Clinical assessment and findings..."></textarea>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label fw-semibold">Treatment Plan</label>
                                        <textarea class="form-control" rows="4" placeholder="Recommended treatment and follow-up..."></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- Additional Observations -->
                            <div class="mb-4">
                                <h3 class="mb-3">
                                    <i class="fas fa-plus-circle text-green me-2"></i>
                                    Additional Observations
                                </h3>
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">Pain Level (0-10)</label>
                                        <select class="form-select">
                                            <option value="">Select level</option>
                                            <option value="0">0 - No pain</option>
                                            <option value="1">1 - Minimal</option>
                                            <option value="2">2 - Mild</option>
                                            <option value="3">3 - Uncomfortable</option>
                                            <option value="4">4 - Moderate</option>
                                            <option value="5">5 - Distracting</option>
                                            <option value="6">6 - Distressing</option>
                                            <option value="7">7 - Unmanageable</option>
                                            <option value="8">8 - Intense</option>
                                            <option value="9">9 - Severe</option>
                                            <option value="10">10 - Unable to move</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">Mobility Status</label>
                                        <select class="form-select">
                                            <option value="">Select status</option>
                                            <option value="independent">Independent</option>
                                            <option value="assisted">Requires assistance</option>
                                            <option value="limited">Limited mobility</option>
                                            <option value="bedbound">Bedbound</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">Mental Status</label>
                                        <select class="form-select">
                                            <option value="">Select status</option>
                                            <option value="alert">Alert & oriented</option>
                                            <option value="confused">Confused</option>
                                            <option value="drowsy">Drowsy</option>
                                            <option value="unresponsive">Unresponsive</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-flex gap-2 justify-content-end">
                                <button type="button" class="btn btn-outline-secondary">
                                    <i class="fas fa-times me-1"></i>Cancel
                                </button>
                                <button type="button" class="btn btn-outline-primary">
                                    <i class="fas fa-save me-1"></i>Save Draft
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-check me-1"></i>Complete Assessment
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
