<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Assessment Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-clipboard-check text-primary me-3" style="font-size: 1.5rem;"></i>
                            <div>
                                <h1 class="mb-1">Clinical Assessment Form</h1>
                                <p class="text-muted mb-0" id="patientInfo">Loading patient information...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Assessment Form -->
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h2 class="mb-0"><i class="fas fa-stethoscope text-primary me-2"></i>Assessment Details</h2>
                    </div>
                    <div class="card-body">
                        <form id="assessmentForm">
                            <!-- Patient Overview -->
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <div class="card bg-light border-0">
                                        <div class="card-body">
                                            <h3 class="mb-3"><i class="fas fa-user text-teal me-2"></i>Patient Overview</h3>
                                            <div id="patientOverview">
                                                <div class="mb-2"><strong>Name:</strong> <span id="patientName">-</span></div>
                                                <div class="mb-2"><strong>Gender:</strong> <span id="patientGender">-</span></div>
                                                <div class="mb-2"><strong>Birth Date:</strong> <span id="patientBirth">-</span></div>
                                                <div class="mb-2"><strong>Age:</strong> <span id="patientAge">-</span></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card bg-light border-0">
                                        <div class="card-body">
                                            <h3 class="mb-3"><i class="fas fa-heartbeat text-danger me-2"></i>Latest Vitals</h3>
                                            <div id="latestVitals">Loading vitals...</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Chief Complaint -->
                            <div class="mb-4">
                                <label for="chiefComplaint" class="form-label fw-semibold">
                                    <i class="fas fa-exclamation-circle text-warning me-2"></i>Chief Complaint
                                </label>
                                <textarea class="form-control" id="chiefComplaint" rows="3" placeholder="Patient's primary concern or reason for visit..."></textarea>
                            </div>

                            <!-- History of Present Illness -->
                            <div class="mb-4">
                                <label for="presentIllness" class="form-label fw-semibold">
                                    <i class="fas fa-history text-info me-2"></i>History of Present Illness
                                </label>
                                <textarea class="form-control" id="presentIllness" rows="4" placeholder="Detailed description of current symptoms, onset, duration, severity..."></textarea>
                            </div>

                            <!-- Physical Examination -->
                            <div class="mb-4">
                                <h3 class="mb-3"><i class="fas fa-search text-success me-2"></i>Physical Examination</h3>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="generalAppearance" class="form-label">General Appearance</label>
                                        <select class="form-select" id="generalAppearance">
                                            <option value="">Select...</option>
                                            <option value="well-appearing">Well-appearing</option>
                                            <option value="ill-appearing">Ill-appearing</option>
                                            <option value="distressed">In distress</option>
                                            <option value="lethargic">Lethargic</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="consciousness" class="form-label">Level of Consciousness</label>
                                        <select class="form-select" id="consciousness">
                                            <option value="">Select...</option>
                                            <option value="alert">Alert and oriented</option>
                                            <option value="confused">Confused</option>
                                            <option value="drowsy">Drowsy</option>
                                            <option value="unresponsive">Unresponsive</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="physicalFindings" class="form-label">Additional Physical Findings</label>
                                    <textarea class="form-control" id="physicalFindings" rows="3" placeholder="Detailed physical examination findings..."></textarea>
                                </div>
                            </div>

                            <!-- Assessment & Plan -->
                            <div class="mb-4">
                                <h3 class="mb-3"><i class="fas fa-clipboard-list text-primary me-2"></i>Assessment & Plan</h3>
                                <div class="mb-3">
                                    <label for="clinicalAssessment" class="form-label">Clinical Assessment</label>
                                    <textarea class="form-control" id="clinicalAssessment" rows="3" placeholder="Primary and differential diagnoses..."></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="treatmentPlan" class="form-label">Treatment Plan</label>
                                    <textarea class="form-control" id="treatmentPlan" rows="4" placeholder="Medications, procedures, follow-up instructions..."></textarea>
                                </div>
                            </div>

                            <!-- Current Conditions Reference -->
                            <div class="mb-4" id="currentConditions" style="display: none;">
                                <h3 class="mb-3"><i class="fas fa-list-alt text-warning me-2"></i>Current Conditions</h3>
                                <div class="card bg-light border-0">
                                    <div class="card-body">
                                        <div id="conditionsList">No conditions on record</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-flex gap-3 justify-content-end">
                                <button type="button" class="btn btn-outline-secondary">
                                    <i class="fas fa-save me-2"></i>Save Draft
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-check me-2"></i>Complete Assessment
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
