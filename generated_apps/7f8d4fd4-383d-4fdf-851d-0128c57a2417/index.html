<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <h1 class="mb-1">Patient Dashboard</h1>
                        <p class="text-muted mb-0">Overview of all patients and their latest observations</p>
                    </div>
                    <div class="badge bg-light text-dark px-3 py-2">
                        <i class="fas fa-users text-primary me-2"></i>
                        <span id="patientCount">0</span> Patients
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-heartbeat text-danger mb-2"></i>
                        <h3 id="totalObservations" class="mb-1">0</h3>
                        <p class="text-muted mb-0">Total Observations</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-stethoscope text-success mb-2"></i>
                        <h3 id="totalConditions" class="mb-1">0</h3>
                        <p class="text-muted mb-0">Active Conditions</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-pills text-warning mb-2"></i>
                        <h3 id="totalMedications" class="mb-1">0</h3>
                        <p class="text-muted mb-0">Medications</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-exclamation-triangle text-danger mb-2"></i>
                        <h3 id="totalAllergies" class="mb-1">0</h3>
                        <p class="text-muted mb-0">Known Allergies</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white">
                        <h2 class="mb-0">
                            <i class="fas fa-user-md text-primary me-2"></i>
                            Patient Overview
                        </h2>
                    </div>
                    <div class="card-body p-0">
                        <div id="patientsList" class="patient-list">
                            <!-- Patients will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
