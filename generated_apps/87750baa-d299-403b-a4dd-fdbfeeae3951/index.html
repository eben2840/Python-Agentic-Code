<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose Hall - Patient Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="patient-avatar me-3">
                                <i class="fas fa-user-circle text-muted"></i>
                            </div>
                            <div>
                                <h4 class="mb-1" id="patientName">Loading...</h4>
                                <div class="text-muted small">
                                    <span id="patientGender">-</span> • 
                                    <span id="patientAge">-</span> • 
                                    DOB: <span id="patientDOB">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row">
            <!-- Encounters -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h6 class="mb-0">
                            <i class="fas fa-calendar-check text-primary me-2"></i>
                            Encounters
                        </h6>
                    </div>
                    <div class="card-body">
                        <div id="encountersContent">
                            <div class="text-muted small">Loading encounters...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Observations -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h6 class="mb-0">
                            <i class="fas fa-chart-line text-success me-2"></i>
                            Observations
                        </h6>
                    </div>
                    <div class="card-body">
                        <div id="observationsContent">
                            <div class="text-muted small">Loading observations...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Medications -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h6 class="mb-0">
                            <i class="fas fa-pills text-warning me-2"></i>
                            Medications
                        </h6>
                    </div>
                    <div class="card-body">
                        <div id="medicationsContent">
                            <div class="text-muted small">Loading medications...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
