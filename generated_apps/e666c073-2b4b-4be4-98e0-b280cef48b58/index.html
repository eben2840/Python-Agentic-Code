<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER Triage & Vitals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h1 class="mb-1"><i class="fas fa-hospital-alt text-danger me-2"></i>Emergency Room Triage</h1>
                            <p class="text-muted mb-0">Patient assessment and vital signs entry</p>
                        </div>
                        <div class="text-end">
                            <div class="badge bg-light text-dark fs-6" id="currentTime"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Patient Selection -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-user-injured text-primary me-2"></i>Patient Selection</h5>
                    </div>
                    <div class="card-body">
                        <select class="form-select mb-3" id="patientSelect">
                            <option value="">Select a patient...</option>
                        </select>
                        <div id="patientInfo" class="patient-info" style="display: none;">
                            <div class="d-flex align-items-center mb-2">
                                <i class="fas fa-user-circle text-muted me-2"></i>
                                <span id="patientName" class="fw-bold"></span>
                            </div>
                            <div class="row text-sm">
                                <div class="col-6">
                                    <span class="text-muted">Gender:</span><br>
                                    <span id="patientGender"></span>
                                </div>
                                <div class="col-6">
                                    <span class="text-muted">Age:</span><br>
                                    <span id="patientAge"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Current Conditions -->
                <div class="card mt-3">
                    <div class="card-header">
                        <h6 class="mb-0"><i class="fas fa-stethoscope text-info me-2"></i>Current Conditions</h6>
                    </div>
                    <div class="card-body">
                        <div id="currentConditions">
                            <p class="text-muted text-sm">Select a patient to view conditions</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Triage Form -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-clipboard-list text-warning me-2"></i>Triage Assessment</h5>
                    </div>
                    <div class="card-body">
                        <form id="triageForm">
                            <div class="mb-3">
                                <label class="form-label">Chief Complaint</label>
                                <textarea class="form-control" id="chiefComplaint" rows="2" placeholder="Primary reason for visit..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Pain Level (0-10)</label>
                                <div class="d-flex align-items-center">
                                    <input type="range" class="form-range me-3" id="painLevel" min="0" max="10" value="0">
                                    <span class="badge bg-light text-dark" id="painValue">0</span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Symptoms</label>
                                <div class="row">
                                    <div class="col-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="fever">
                                            <label class="form-check-label text-sm" for="fever">Fever</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="nausea">
                                            <label class="form-check-label text-sm" for="nausea">Nausea</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="dizziness">
                                            <label class="form-check-label text-sm" for="dizziness">Dizziness</label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="chestPain">
                                            <label class="form-check-label text-sm" for="chestPain">Chest Pain</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="shortBreath">
                                            <label class="form-check-label text-sm" for="shortBreath">Shortness of Breath</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="bleeding">
                                            <label class="form-check-label text-sm" for="bleeding">Bleeding</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Triage Priority</label>
                                <select class="form-select" id="triagePriority">
                                    <option value="">Select priority...</option>
                                    <option value="1">Level 1 - Immediate (Red)</option>
                                    <option value="2">Level 2 - Urgent (Orange)</option>
                                    <option value="3">Level 3 - Less Urgent (Yellow)</option>
                                    <option value="4">Level 4 - Non-Urgent (Green)</option>
                                    <option value="5">Level 5 - Fast Track (Blue)</option>
                                </select>
                            </div>

                            <div class="triage-result" id="triageResult" style="display: none;"></div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Vital Signs Entry -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-heartbeat text-danger me-2"></i>Vital Signs</h5>
                    </div>
                    <div class="card-body">
                        <form id="vitalsForm">
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label text-sm">Systolic BP</label>
                                    <input type="number" class="form-control" id="systolic" placeholder="120">
                                </div>
                                <div class="col-6">
                                    <label class="form-label text-sm">Diastolic BP</label>
                                    <input type="number" class="form-control" id="diastolic" placeholder="80">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label text-sm">Heart Rate</label>
                                    <input type="number" class="form-control" id="heartRate" placeholder="72">
                                </div>
                                <div class="col-6">
                                    <label class="form-label text-sm">Resp. Rate</label>
                                    <input type="number" class="form-control" id="respRate" placeholder="16">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label text-sm">Temperature (°C)</label>
                                    <input type="number" class="form-control" id="temperature" step="0.1" placeholder="36.5">
                                </div>
                                <div class="col-6">
                                    <label class="form-label text-sm">O2 Saturation (%)</label>
                                    <input type="number" class="form-control" id="oxygenSat" placeholder="98">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-sm">Weight (kg)</label>
                                <input type="number" class="form-control" id="weight" placeholder="70">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-primary" id="saveVitals">
                                    <i class="fas fa-save me-2"></i>Save Vital Signs
                                </button>
                                <button type="button" class="btn btn-success" id="completeTriage">
                                    <i class="fas fa-check-circle me-2"></i>Complete Triage
                                </button>
                            </div>
                        </form>

                        <!-- Current Vitals Display -->
                        <div id="currentVitals" class="mt-3" style="display: none;">
                            <h6 class="text-muted mb-2">Current Vitals:</h6>
                            <div id="vitalsDisplay" class="vitals-display"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Triage Summary -->
        <div class="row">
            <div class="col-12">
                <div class="card" id="triageSummary" style="display: none;">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-file-medical text-success me-2"></i>Triage Summary</h5>
                    </div>
                    <div class="card-body">
                        <div id="summaryContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
