<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Emergency Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center">
                        <div class="icon-wrapper me-3">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <div>
                            <h1 class="mb-1">Clinical Emergency Review</h1>
                            <p class="text-muted mb-0">24-72 Hour Risk Assessment</p>
                        </div>
                    </div>
                    <div class="mt-3">
                        <span class="badge bg-danger me-2">
                            <i class="fas fa-circle me-1"></i>Critical
                        </span>
                        <span class="badge bg-warning me-2">
                            <i class="fas fa-circle me-1"></i>High
                        </span>
                        <span class="badge bg-info">
                            <i class="fas fa-circle me-1"></i>Monitor
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div id="emergency-summary" class="summary-card mb-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-chart-line me-2"></i>
                        <span id="summary-text">Loading emergency assessment...</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="emergency-alerts">
            <!-- Emergency alerts will be populated here -->
        </div>

        <div class="row" id="no-emergencies" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <div class="text-center">
                        <i class="fas fa-shield-alt mb-3"></i>
                        <h3>No Active Clinical Emergencies</h3>
                        <p class="text-muted">All patients are currently stable with no urgent concerns identified for the next 24-72 hours.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
