<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Pressure Dashboard - Elias Abbott</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="patient-avatar me-3">
                                <i class="fas fa-user-circle text-muted"></i>
                            </div>
                            <div>
                                <h4 class="mb-1" id="patientName">Elias Abbott</h4>
                                <p class="text-muted mb-0" id="patientInfo">Patient ID: 851a7b59-feb4-4b4c-9f48-8cf5fad54213</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Blood Pressure Dashboard -->
            <div class="col-lg-8 mb-4">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-heartbeat text-danger me-2"></i>
                            <h5 class="mb-0">Blood Pressure Dashboard</h5>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row" id="bpReadings">
                            <!-- Blood pressure readings will be populated here -->
                        </div>
                        <div class="mt-4" id="bpChart">
                            <div class="text-center text-muted py-5">
                                <i class="fas fa-chart-line fa-3x mb-3"></i>
                                <p>Blood pressure readings will be displayed here</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Conditions Panel -->
            <div class="col-lg-4 mb-4">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-clipboard-list text-primary me-2"></i>
                            <h5 class="mb-0">Medical Conditions</h5>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="conditionsList">
                            <!-- Conditions will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vital Signs Overview -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-stethoscope text-success me-2"></i>
                            <h5 class="mb-0">Current Vital Signs</h5>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row" id="vitalSigns">
                            <!-- Vital signs will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Allergies Alert -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card border-warning">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-exclamation-triangle text-warning me-2"></i>
                            <h5 class="mb-0">Allergy Alerts</h5>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row" id="allergiesList">
                            <!-- Allergies will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
