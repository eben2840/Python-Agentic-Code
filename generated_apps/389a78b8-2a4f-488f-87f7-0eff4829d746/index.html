<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Medications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-6">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body text-center py-4">
                        <div class="icon-circle mb-3">
                            <i class="fas fa-pills text-primary"></i>
                        </div>
                        <h1 class="h3 mb-2" id="patientName">Loading...</h1>
                        <p class="text-muted mb-0">Current Medications</p>
                    </div>
                </div>

                <!-- Medications List -->
                <div id="medicationsContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>

                <!-- No Data Message -->
                <div id="noDataMessage" class="card d-none">
                    <div class="card-body text-center py-5">
                        <i class="fas fa-prescription-bottle-alt text-muted mb-3" style="font-size: 3rem;"></i>
                        <h4 class="text-muted">No Medications Available</h4>
                        <p class="text-muted mb-0">No medication data found for this patient.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
