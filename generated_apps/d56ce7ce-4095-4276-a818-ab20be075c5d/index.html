<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Location & Patient Overview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-hospital-alt me-3 text-primary"></i>
                        <div>
                            <h1 class="mb-1">Healthcare Overview</h1>
                            <p class="text-muted mb-0">Location Structure & Patient Conditions</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Location Structure -->
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-map-marker-alt me-2 text-teal"></i>
                            <h5 class="mb-0">Location Structure</h5>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="locationStructure">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Patient Overview -->
            <div class="col-lg-8 col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header">
                        <div class="d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center">
                                <i class="fas fa-users me-2 text-blue"></i>
                                <h5 class="mb-0">Patient Conditions</h5>
                            </div>
                            <span id="patientCount" class="badge bg-primary">0</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="patientConditions">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detailed Patient Cards -->
        <div class="row" id="patientCards">
            <!-- Patient cards will be dynamically generated here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
