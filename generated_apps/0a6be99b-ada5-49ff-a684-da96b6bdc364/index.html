<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h1 class="mb-1">Patient Dashboard</h1>
                            <p class="text-muted mb-0" id="patient-count">Loading patients...</p>
                        </div>
                        <div class="d-flex gap-2">
                            <i class="fas fa-users text-primary fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="filter-card">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Search Patients</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-search text-muted"></i></span>
                                <input type="text" class="form-control" id="search-input" placeholder="Search by name or condition...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Gender</label>
                            <select class="form-select" id="gender-filter">
                                <option value="">All Genders</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Age Range</label>
                            <select class="form-select" id="age-filter">
                                <option value="">All Ages</option>
                                <option value="0-18">0-18 years</option>
                                <option value="19-35">19-35 years</option>
                                <option value="36-65">36-65 years</option>
                                <option value="65+">65+ years</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-outline-secondary w-100" id="clear-filters">
                                <i class="fas fa-times me-1"></i>Clear
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="row mb-4" id="stats-row">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex align-items-center">
                        <div class="stat-icon bg-primary">
                            <i class="fas fa-users text-white"></i>
                        </div>
                        <div class="ms-3">
                            <div class="stat-value" id="total-patients">0</div>
                            <div class="stat-label">Total Patients</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex align-items-center">
                        <div class="stat-icon bg-success">
                            <i class="fas fa-stethoscope text-white"></i>
                        </div>
                        <div class="ms-3">
                            <div class="stat-value" id="active-conditions">0</div>
                            <div class="stat-label">Active Conditions</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex align-items-center">
                        <div class="stat-icon bg-warning">
                            <i class="fas fa-pills text-white"></i>
                        </div>
                        <div class="ms-3">
                            <div class="stat-value" id="active-medications">0</div>
                            <div class="stat-label">Active Medications</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="d-flex align-items-center">
                        <div class="stat-icon bg-info">
                            <i class="fas fa-chart-line text-white"></i>
                        </div>
                        <div class="ms-3">
                            <div class="stat-value" id="recent-observations">0</div>
                            <div class="stat-label">Recent Observations</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient Cards -->
        <div class="row" id="patients-container">
            <!-- Patient cards will be inserted here -->
        </div>

        <!-- No Results -->
        <div class="row d-none" id="no-results">
            <div class="col-12">
                <div class="text-center py-5">
                    <i class="fas fa-search text-muted mb-3" style="font-size: 3rem;"></i>
                    <h4 class="text-muted">No patients found</h4>
                    <p class="text-muted">Try adjusting your search criteria</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
