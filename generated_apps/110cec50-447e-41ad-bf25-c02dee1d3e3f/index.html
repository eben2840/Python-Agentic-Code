<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Risk Assessment Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-hospital-alt me-3 text-danger"></i>
                        <div>
                            <h1 class="mb-1">Ward Risk Assessment Dashboard</h1>
                            <p class="text-muted mb-0">High-risk patients by ward with condition severity ratings</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="stats-row">
                    <div class="stat-card">
                        <i class="fas fa-building text-primary"></i>
                        <div>
                            <div class="stat-number" id="total-wards">0</div>
                            <div class="stat-label">Total Wards</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-exclamation-triangle text-warning"></i>
                        <div>
                            <div class="stat-number" id="high-risk-patients">0</div>
                            <div class="stat-label">High-Risk Patients</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-chart-line text-success"></i>
                        <div>
                            <div class="stat-number" id="avg-severity">0%</div>
                            <div class="stat-label">Avg Severity</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div id="wards-container">
                    <div class="text-center py-5">
                        <i class="fas fa-spinner fa-spin fa-2x text-muted"></i>
                        <p class="text-muted mt-3">Loading ward data...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
