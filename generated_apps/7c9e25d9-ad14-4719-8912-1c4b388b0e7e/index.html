<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Observations - Elias Abbott</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2563eb;
            --secondary-blue: #3b82f6;
            --accent-green: #10b981;
            --light-blue: #eff6ff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --success: #059669;
            --warning: #d97706;
            --danger: #dc2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--light-blue) 0%, var(--gray-50) 100%);
            color: var(--gray-800);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-blue) 100%);
            color: white;
            padding: 2rem 0;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.15);
        }

        .patient-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .patient-avatar {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .patient-details h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .patient-id {
            opacity: 0.9;
            font-size: 0.875rem;
            font-family: 'Courier New', monospace;
        }

        .stats-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--gray-100);
            transition: all 0.3s ease;
            height: 100%;
        }

        .stats-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: var(--gray-600);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .chart-container {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--gray-100);
            margin-bottom: 2rem;
        }

        .chart-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .chart-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--gray-900);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--gray-200);
            background: white;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-600);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }

        .filter-btn.active {
            background: var(--primary-blue);
            border-color: var(--primary-blue);
            color: white;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
            margin-bottom: 1rem;
        }

        .observation-list {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--gray-100);
        }

        .observation-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--gray-100);
            transition: all 0.2s ease;
        }

        .observation-item:last-child {
            border-bottom: none;
        }

        .observation-item:hover {
            background: var(--gray-50);
            margin: 0 -1rem;
            padding: 1rem;
            border-radius: 8px;
        }

        .observation-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .observation-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .observation-details h6 {
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 0.25rem;
        }

        .observation-date {
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        .observation-value {
            text-align: right;
        }

        .value-number {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--gray-900);
        }

        .value-unit {
            font-size: 0.875rem;
            color: var(--gray-600);
            margin-left: 0.25rem;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .status-normal {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-high {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .status-critical {
            background: rgba(220, 38, 38, 0.1);
            color: var(--danger);
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--gray-200);
            border-top: 3px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header {
                padding: 1.5rem 0;
            }
            
            .patient-info {
                flex-direction: column;
                text-align: center;
                gap: 0.75rem;
            }
            
            .chart-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .chart-wrapper {
                height: 300px;
            }
            
            .observation-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
            
            .observation-value {
                text-align: left;
                width: 100%;
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="container">
            <div class="patient-info">
                <div class="patient-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="patient-details">
                    <h1>Elias Abbott</h1>
                    <div class="patient-id">ID: 851a7b59-feb4-4b4c-9f48-8cf5fad54213</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container py-4">
        <!-- Stats Cards -->
        <div class="row mb-4">
            <div class="col-md-3 col-6 mb-3">
                <div class="stats-card fade-in">
                    <div class="stat-icon" style="background: rgba(37, 99, 235, 0.1); color: var(--primary-blue);">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <div class="stat-number">25</div>
                    <div class="stat-label">Total Observations</div>
                </div>
            </div>
            <div class="col-md-3 col-6 mb-3">
                <div class="stats-card fade-in" style="animation-delay: 0.1s;">
                    <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: var(--accent-green);">
                        <i class="fas fa-heartbeat"></i>
                    </div>
                    <div class="stat-number">8</div>
                    <div class="stat-label">Vital Signs</div>
                </div>
            </div>
            <div class="col-md-3 col-6 mb-3">
                <div class="stats-card fade-in" style="animation-delay: 0.2s;">
                    <div class="stat-icon" style="background: rgba(217, 119, 6, 0.1); color: var(--warning);">
                        <i class="fas fa-flask"></i>
                    </div>
                    <div class="stat-number">12</div>
                    <div class="stat-label">Lab Results</div>
                </div>
            </div>
            <div class="col-md-3 col-6 mb-3">
                <div class="stats-card fade-in" style="animation-delay: 0.3s;">
                    <div class="stat-icon" style="background: rgba(139, 92, 246, 0.1); color: #8b5cf6;">
                        <i class="fas fa-calendar-check"></i>
                    </div>
                    <div class="stat-number">5</div>
                    <div class="stat-label">Recent (30d)</div>
                </div>
            </div>
        </div>

        <!-- Chart Container -->
        <div class="chart-container fade-in" style="animation-delay: 0.4s;">
            <div class="chart-header">
                <div class="chart-title">
                    <i class="fas fa-chart-area" style="color: var(--primary-blue);"></i>
                    Health Observations Timeline
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="vitals">Vitals</button>
                    <button class="filter-btn" data-filter="labs">Labs</button>
                    <button class="filter-btn" data-filter="recent">Recent</button>
                </div>
            </div>
            <div class="chart-wrapper">
                <canvas id="observationChart"></canvas>
            </div>
        </div>

        <!-- Observations List -->
        <div class="observation-list fade-in" style="animation-delay: 0.5s;">
            <div class="chart-title mb-4">
                <i class="fas fa-list-ul" style="color: var(--primary-blue);"></i>
                Recent Observations
            </div>
            <div id="observationsList">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Sample observation data for Elias Abbott
        const observationData = [
            { id: 1, type: 'Blood Pressure', value: '120/80', unit: 'mmHg', date: '2024-01-15', category: 'vitals', status: 'normal', icon: 'fas fa-heartbeat' },
            { id: 2, type: 'Heart Rate', value: '72', unit: 'bpm', date: '2024-01-15', category: 'vitals', status: 'normal', icon: 'fas fa-heart' },
            { id: 3, type: 'Temperature', value: '98.6', unit: '°F', date: '2024-01-15', category: 'vitals', status: 'normal', icon: 'fas fa-thermometer-half' },
            { id: 4, type: 'Cholesterol', value: '195', unit: 'mg/dL', date: '2024-01-14', category: 'labs', status: 'normal', icon: 'fas fa-flask' },
            { id: 5, type: 'Blood Glucose', value: '110', unit: 'mg/dL', date: '2024-01-14', category: 'labs', status: 'normal', icon: 'fas fa-tint' },
            { id: 6, type: 'Weight', value: '175', unit: 'lbs', date: '2024-01-13', category: 'vitals', status: 'normal', icon: 'fas fa-weight' },
            { id: 7, type: 'BMI', value: '24.2', unit: '', date: '2024-01-13', category: 'vitals', status: 'normal', icon: 'fas fa-calculator' },
            { id: 8, type: 'Hemoglobin', value: '14.5', unit: 'g/dL', date: '2024-01-12', category: 'labs', status: 'normal', icon: 'fas fa-flask' },
            { id: 9, type: 'White Blood Cell', value: '7200', unit: '/μL', date: '2024-01-12', category: 'labs', status: 'normal', icon: 'fas fa-microscope' },
            { id: 10, type: 'Oxygen Saturation', value: '98', unit: '%', date: '2024-01-11', category: 'vitals', status: 'normal', icon: 'fas fa-lungs' },
            { id: 11, type: 'Blood Pressure', value: '125/82', unit: 'mmHg', date: '2024-01-10', category: 'vitals', status: 'high', icon: 'fas fa-heartbeat' },
            { id: 12, type: 'Creatinine', value: '1.1', unit: 'mg/dL', date: '2024-01-09', category: 'labs', status: 'normal', icon: 'fas fa-kidney' },
            { id: 13, type: 'Potassium', value: '4.2', unit: 'mEq/L', date: '2024-01-08', category: 'labs', status: 'normal', icon: 'fas fa-flask' },
            { id: 14, type: 'Sodium', value: '140', unit: 'mEq/L', date: '2024-01-08', category: 'labs', status: 'normal', icon: 'fas fa-flask' },
            { id: 15, type: 'Heart Rate', value: '78', unit: 'bpm', date: '2024-01-07', category: 'vitals', status: 'normal', icon: 'fas fa-heart' },
            { id: 16, type: 'Respiratory Rate', value: '16', unit: '/min', date: '2024-01-06', category: 'vitals', status: 'normal', icon: 'fas fa-lungs' },
            { id: 17, type: 'Platelet Count', value: '250000', unit: '/μL', date: '2024-01-05', category: 'labs', status: 'normal', icon: 'fas fa-microscope' },
            { id: 18, type: 'Triglycerides', value: '150', unit: 'mg/dL', date: '2024-01-04', category: 'labs', status: 'normal', icon: 'fas fa-flask' },
            { id: 19, type: 'HDL Cholesterol', value: '45', unit: 'mg/dL', date: '2024-01-03', category: 'labs', status: 'normal', icon: 'fas fa-flask' },
            { id: 20, type: 'LDL Cholesterol', value: '120', unit: 'mg/dL', date: '2024-01-02', category: 'labs', status: 'normal', icon: 'fas fa-flask' },
            { id: 21, type: 'Blood Pressure', value: '118/76', unit: 'mmHg', date: '2024-01-01', category: 'vitals', status: 'normal', icon: 'fas fa-heartbeat' },
            { id: 22, type: 'Temperature', value: '99.1', unit: '°F', date: '2023-12-30', category: 'vitals', status: 'high', icon: 'fas fa-thermometer-half' },
            { id: 23, type: 'Blood Glucose', value: '105', unit: 'mg/dL', date: '2023-12-29', category: 'labs', status: 'normal', icon: 'fas fa-tint' },
            { id: 24, type: 'Heart Rate', value: '68', unit: 'bpm', date: '2023-12-28', category: 'vitals', status: 'normal', icon: 'fas fa-heart' },
            { id: 25, type: 'Weight', value: '173', unit: 'lbs', date: '2023-12-27', category: 'vitals', status: 'normal', icon: 'fas fa-weight' }
        ];

        let chart;
        let currentFilter = 'all';

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            initializeChart();
            renderObservationsList();
            setupFilterButtons();
        });

        function initializeChart() {
            const ctx = document.getElementById('observationChart').getContext('2d');
            
            // Prepare chart data
            const chartData = prepareChartData(observationData, currentFilter);
            
            chart = new Chart(ctx, {
                type: 'line',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 20,
                                font: {
                                    family: 'Inter',
                                    size: 12
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(255, 255, 255, 0.95)',
                            titleColor: '#1f2937',
                            bodyColor: '#4b5563',
                            borderColor: '#e5e7eb',
                            borderWidth: 1,
                            cornerRadius: 8,
                            displayColors: true,
                            font: {
                                family: 'Inter'
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                parser: 'YYYY-MM-DD',
                                displayFormats: {
                                    day: 'MMM DD'
                                }
                            },
                            grid: {
                                color: '#f3f4f6'
                            },
                            ticks: {
                                font: {
                                    family: 'Inter',
                                    size: 11
                                },
                                color: '#6b7280'
                            }
                        },
                        y: {
                            beginAtZero: false,
                            grid: {
                                color: '#f3f4f6'
                            },
                            ticks: {
                                font: {
                                    family: 'Inter',
                                    size: 11
                                },
                                color: '#6b7280'
                            }
                        }
                    },
                    elements: {
                        point: {
                            radius: 4,
                            hoverRadius: 6,
                            borderWidth: 2
                        },
                        line: {
                            borderWidth: 3,
                            tension: 0.4
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }

        function prepareChartData(data, filter) {
            let filteredData = data;
            
            if (filter === 'vitals') {
                filteredData = data.filter(obs => obs.category === 'vitals');
            } else if (filter === 'labs') {
                filteredData = data.filter(obs => obs.category === 'labs');
            } else if (filter === 'recent') {
                const thirtyDaysAgo = new Date();
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                filteredData = data.filter(obs => new Date(obs.date) >= thirtyDaysAgo);
            }

            // Group by observation type
            const groupedData = {};
            filteredData.forEach(obs => {
                if (!groupedData[obs.type]) {
                    groupedData[obs.type] = [];
                }
                groupedData[obs.type].push({
                    x: obs.date,
                    y: parseFloat(obs.value.split('/')[0]) // Handle blood pressure format
                });
            });

            // Create datasets
            const colors = [
                '#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6',
                '#06b6d4', '#84cc16', '#f97316', '#ec4899', '#6366f1'
            ];

            const datasets = Object.keys(groupedData).map((type, index) => ({
                label: type,
                data: groupedData[type].sort((a, b) => new Date(a.x) - new Date(b.x)),
                borderColor: colors[index % colors.length],
                backgroundColor: colors[index % colors.length] + '20',
                fill: false,
                tension: 0.4
            }));

            return { datasets };
        }

        function renderObservationsList() {
            const container = document.getElementById('observationsList');
            
            // Sort by date (most recent first)
            const sortedData = [...observationData].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            setTimeout(() => {
                container.innerHTML = sortedData.slice(0, 10).map(obs => `
                    <div class="observation-item">
                        <div class="observation-info">
                            <div class="observation-icon" style="background: ${getIconBackground(obs.category)}; color: ${getIconColor(obs.category)};">
                                <i class="${obs.icon}"></i>
                            </div>
                            <div class="observation-details">
                                <h6>${obs.type}</h6>
                                <div class="observation-date">${formatDate(obs.date)}</div>
                            </div>
                        </div>
                        <div class="observation-value">
                            <div class="value-number">
                                ${obs.value}
                                <span class="value-unit">${obs.unit}</span>
                            </div>
                            <div class="status-badge status-${obs.status}">${obs.status}</div>
                        </div>
                    </div>
                `).join('');
            }, 500);
        }

        function setupFilterButtons() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            
            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Update active state
                    filterButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Update filter and chart
                    currentFilter = this.dataset.filter;
                    updateChart();
                });
            });
        }

        function updateChart() {
            const newData = prepareChartData(observationData, currentFilter);
            chart.data = newData;
            chart.update('active');
        }

        function getIconBackground(category) {
            const backgrounds = {
                'vitals': 'rgba(16, 185, 129, 0.1)',
                'labs': 'rgba(37, 99, 235, 0.1)'
            };
            return backgrounds[category] || 'rgba(107, 114, 128, 0.1)';
        }

        function getIconColor(category) {
            const colors = {
                'vitals': '#10b981',
                'labs': '#2563eb'
            };
            return colors[category] || '#6b7280';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        // Add smooth scrolling for better UX
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
