<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Details - Leo Harris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center">
                        <div class="patient-avatar me-3">
                            <i class="fas fa-user"></i>
                        </div>
                        <div>
                            <h1 class="patient-name mb-1" id="patientName">Loading...</h1>
                            <div class="patient-info">
                                <span class="badge bg-light text-dark me-2" id="patientGender">-</span>
                                <span class="text-muted" id="patientAge">-</span>
                                <span class="text-muted ms-2" id="patientDob">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Current Location -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="detail-card">
                    <div class="card-header">
                        <i class="fas fa-map-marker-alt text-teal"></i>
                        <span>Current Location</span>
                    </div>
                    <div class="card-body" id="locationDetails">
                        <div class="no-data">No location data available</div>
                    </div>
                </div>
            </div>

            <!-- Active Conditions -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="detail-card">
                    <div class="card-header">
                        <i class="fas fa-stethoscope text-blue"></i>
                        <span>Active Conditions</span>
                    </div>
                    <div class="card-body" id="conditionDetails">
                        <div class="no-data">No condition data available</div>
                    </div>
                </div>
            </div>

            <!-- Current Encounter -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="detail-card">
                    <div class="card-header">
                        <i class="fas fa-calendar-check text-green"></i>
                        <span>Current Encounter</span>
                    </div>
                    <div class="card-body" id="encounterDetails">
                        <div class="no-data">No encounter data available</div>
                    </div>
                </div>
            </div>

            <!-- Medications -->
            <div class="col-12 col-lg-6">
                <div class="detail-card">
                    <div class="card-header">
                        <i class="fas fa-pills text-teal"></i>
                        <span>Active Medications</span>
                    </div>
                    <div class="card-body" id="medicationDetails">
                        <div class="no-data">No medication data available</div>
                    </div>
                </div>
            </div>

            <!-- Vital Signs & Observations -->
            <div class="col-12 col-lg-6">
                <div class="detail-card">
                    <div class="card-header">
                        <i class="fas fa-heartbeat text-blue"></i>
                        <span>Latest Observations</span>
                    </div>
                    <div class="card-body" id="observationDetails">
                        <div class="no-data">No observation data available</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
