<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <!-- Patient Header -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="icon-circle me-3">
                                <i class="fas fa-user-md text-primary"></i>
                            </div>
                            <div>
                                <h1 class="mb-1" id="patientName">Loading...</h1>
                                <p class="text-muted mb-0" id="patientInfo">Patient ID: Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Observations Section -->
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex align-items-center">
                            <div class="icon-circle-sm me-2">
                                <i class="fas fa-chart-line text-success"></i>
                            </div>
                            <h2 class="mb-0">All Observations</h2>
                            <span class="badge bg-light text-dark ms-auto" id="observationCount">0 items</span>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="border-0 ps-4">Observation</th>
                                        <th class="border-0">Value</th>
                                        <th class="border-0">Unit</th>
                                        <th class="border-0">Date</th>
                                        <th class="border-0 pe-4">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="observationsTable">
                                    <tr>
                                        <td colspan="5" class="text-center py-5 text-muted">
                                            <i class="fas fa-spinner fa-spin me-2"></i>Loading observations...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Summary Cards -->
                <div class="row mt-4" id="summaryCards">
                    <!-- Cards will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
