<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Medication Checklist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h1 class="page-title mb-1">
                                <i class="fas fa-pills text-primary me-2"></i>
                                Daily Medication Checklist
                            </h1>
                            <p class="text-muted mb-0">Track medication administration for all patients</p>
                        </div>
                        <div class="stats-summary">
                            <div class="stat-item">
                                <span class="stat-number" id="totalMeds">0</span>
                                <span class="stat-label">Total Medications</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-number text-success" id="completedMeds">0</span>
                                <span class="stat-label">Completed</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-number text-warning" id="pendingMeds">0</span>
                                <span class="stat-label">Pending</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="filter-card">
                    <div class="d-flex align-items-center gap-3">
                        <div class="filter-group">
                            <label class="filter-label">Filter by Status:</label>
                            <select class="form-select form-select-sm" id="statusFilter">
                                <option value="all">All Medications</option>
                                <option value="pending">Pending Only</option>
                                <option value="completed">Completed Only</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label">Search Patient:</label>
                            <input type="text" class="form-control form-control-sm" id="patientSearch" placeholder="Enter patient name...">
                        </div>
                        <button class="btn btn-outline-primary btn-sm" id="resetFilters">
                            <i class="fas fa-refresh me-1"></i>Reset
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="medicationList">
            <!-- Medication cards will be populated here -->
        </div>

        <div class="row" id="noDataMessage" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <i class="fas fa-pills text-muted mb-3"></i>
                    <h5 class="text-muted">No medication data available</h5>
                    <p class="text-muted mb-0">No active prescriptions found for any patients.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
