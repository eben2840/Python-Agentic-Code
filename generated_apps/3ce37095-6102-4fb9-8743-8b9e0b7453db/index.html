<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Alert Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-exclamation-triangle text-danger me-3" style="font-size: 1.5rem;"></i>
                        <div>
                            <h1 class="mb-0">Emergency Alert Dashboard</h1>
                            <p class="text-muted mb-0">24-72 Hour Clinical Risk Assessment</p>
                        </div>
                    </div>
                    <div class="alert-summary">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <div class="summary-card critical">
                                    <i class="fas fa-exclamation-circle"></i>
                                    <div>
                                        <div class="count" id="critical-count">0</div>
                                        <div class="label">Critical</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="summary-card high">
                                    <i class="fas fa-exclamation-triangle"></i>
                                    <div>
                                        <div class="count" id="high-count">0</div>
                                        <div class="label">High Priority</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="summary-card monitor">
                                    <i class="fas fa-eye"></i>
                                    <div>
                                        <div class="count" id="monitor-count">0</div>
                                        <div class="label">Monitor</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="summary-card stable">
                                    <i class="fas fa-check-circle"></i>
                                    <div>
                                        <div class="count" id="stable-count">0</div>
                                        <div class="label">Stable</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div id="alerts-container">
                    <!-- Dynamic alerts will be inserted here -->
                </div>
                
                <div id="no-alerts" class="text-center py-5" style="display: none;">
                    <i class="fas fa-check-circle text-success mb-3" style="font-size: 3rem;"></i>
                    <h3 class="text-success">No Active Emergencies</h3>
                    <p class="text-muted">All patients are stable with no urgent concerns identified for the next 24-72 hours.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
