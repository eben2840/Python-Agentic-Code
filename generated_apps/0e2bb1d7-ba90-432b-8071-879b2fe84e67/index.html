<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="dashboard-header">
                    <h1 class="dashboard-title">
                        <i class="fas fa-users text-primary me-2"></i>
                        Patient Dashboard
                    </h1>
                    <p class="text-muted mb-0">Comprehensive overview of all patients, observations, encounters, and locations</p>
                </div>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="filter-card">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Search Patients</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" class="form-control" id="searchInput" placeholder="Search by name or condition...">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Gender</label>
                            <select class="form-select" id="genderFilter">
                                <option value="">All Genders</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Condition</label>
                            <select class="form-select" id="conditionFilter">
                                <option value="">All Conditions</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">View Mode</label>
                            <select class="form-select" id="viewMode">
                                <option value="overview">Overview</option>
                                <option value="detailed">Detailed</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">&nbsp;</label>
                            <button class="btn btn-outline-secondary w-100" id="clearFilters">
                                <i class="fas fa-times me-1"></i>Clear
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Stats -->
        <div class="row mb-4" id="summaryStats">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-primary">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalPatients">0</h3>
                        <p>Total Patients</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-success">
                        <i class="fas fa-stethoscope"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalObservations">0</h3>
                        <p>Observations</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-info">
                        <i class="fas fa-calendar-check"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalEncounters">0</h3>
                        <p>Encounters</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-warning">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalLocations">0</h3>
                        <p>Active Locations</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient Cards -->
        <div class="row" id="patientContainer">
            <!-- Patient cards will be dynamically generated here -->
        </div>

        <!-- No Results Message -->
        <div class="row d-none" id="noResults">
            <div class="col-12">
                <div class="no-results-card">
                    <i class="fas fa-search text-muted mb-3"></i>
                    <h4>No patients found</h4>
                    <p class="text-muted">Try adjusting your search criteria or clearing the filters.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
