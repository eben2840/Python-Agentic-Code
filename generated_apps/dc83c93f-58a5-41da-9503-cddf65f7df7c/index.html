<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Assessment Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-center">
                            <div class="icon-circle me-3">
                                <i class="fas fa-clipboard-check text-primary"></i>
                            </div>
                            <div>
                                <h1 class="mb-1">Patient Assessment Form</h1>
                                <p class="text-muted mb-0" id="patientInfo">Loading patient information...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Assessment Form -->
                <form id="assessmentForm">
                    <!-- Current Health Status -->
                    <div class="card mb-4">
                        <div class="card-header bg-light">
                            <h3 class="mb-0">
                                <i class="fas fa-heartbeat text-danger me-2"></i>
                                Current Health Status
                            </h3>
                        </div>
                        <div class="card-body p-4">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Chief Complaint</label>
                                    <textarea class="form-control" rows="3" placeholder="Describe primary concern or symptoms"></textarea>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Pain Level (0-10)</label>
                                    <select class="form-select">
                                        <option value="">Select pain level</option>
                                        <option value="0">0 - No pain</option>
                                        <option value="1">1 - Minimal</option>
                                        <option value="2">2 - Mild</option>
                                        <option value="3">3 - Uncomfortable</option>
                                        <option value="4">4 - Moderate</option>
                                        <option value="5">5 - Distracting</option>
                                        <option value="6">6 - Distressing</option>
                                        <option value="7">7 - Unmanageable</option>
                                        <option value="8">8 - Intense</option>
                                        <option value="9">9 - Severe</option>
                                        <option value="10">10 - Unable to move</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Symptom Duration</label>
                                    <select class="form-select">
                                        <option value="">Select duration</option>
                                        <option value="hours">Hours</option>
                                        <option value="days">Days</option>
                                        <option value="weeks">Weeks</option>
                                        <option value="months">Months</option>
                                        <option value="years">Years</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Overall Well-being</label>
                                    <select class="form-select">
                                        <option value="">Rate overall feeling</option>
                                        <option value="excellent">Excellent</option>
                                        <option value="good">Good</option>
                                        <option value="fair">Fair</option>
                                        <option value="poor">Poor</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Vital Signs -->
                    <div class="card mb-4">
                        <div class="card-header bg-light">
                            <h3 class="mb-0">
                                <i class="fas fa-thermometer-half text-warning me-2"></i>
                                Vital Signs
                            </h3>
                        </div>
                        <div class="card-body p-4">
                            <div class="row">
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">Blood Pressure</label>
                                    <input type="text" class="form-control" placeholder="120/80">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">Heart Rate (bpm)</label>
                                    <input type="number" class="form-control" placeholder="72">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">Temperature (°F)</label>
                                    <input type="number" step="0.1" class="form-control" placeholder="98.6">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">Oxygen Saturation (%)</label>
                                    <input type="number" class="form-control" placeholder="98">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Symptoms Checklist -->
                    <div class="card mb-4">
                        <div class="card-header bg-light">
                            <h3 class="mb-0">
                                <i class="fas fa-list-check text-success me-2"></i>
                                Symptoms Checklist
                            </h3>
                        </div>
                        <div class="card-body p-4">
                            <div class="row" id="symptomsChecklist">
                                <!-- Symptoms will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>

                    <!-- Current Medications -->
                    <div class="card mb-4">
                        <div class="card-header bg-light">
                            <h3 class="mb-0">
                                <i class="fas fa-pills text-info me-2"></i>
                                Current Medications & Changes
                            </h3>
                        </div>
                        <div class="card-body p-4">
                            <div id="currentMedications" class="mb-3">
                                <!-- Current medications will be loaded here -->
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Medication Changes or New Symptoms</label>
                                <textarea class="form-control" rows="3" placeholder="Any changes in medications, side effects, or new symptoms since last visit"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Additional Notes -->
                    <div class="card mb-4">
                        <div class="card-header bg-light">
                            <h3 class="mb-0">
                                <i class="fas fa-notes-medical text-secondary me-2"></i>
                                Additional Information
                            </h3>
                        </div>
                        <div class="card-body p-4">
                            <div class="mb-3">
                                <label class="form-label">Additional Notes or Concerns</label>
                                <textarea class="form-control" rows="4" placeholder="Any other information you'd like to share with your healthcare provider"></textarea>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="urgentCare">
                                <label class="form-check-label" for="urgentCare">
                                    This requires urgent attention
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="card">
                        <div class="card-body p-4 text-center">
                            <button type="submit" class="btn btn-primary btn-lg px-5">
                                <i class="fas fa-paper-plane me-2"></i>
                                Submit Assessment
                            </button>
                            <p class="text-muted mt-2 mb-0">Your assessment will be reviewed by your healthcare provider</p>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
