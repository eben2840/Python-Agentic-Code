<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT Ward Patient Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <div class="icon-circle me-3">
                            <i class="fas fa-ear-listen"></i>
                        </div>
                        <div>
                            <h1 class="mb-1">ENT Ward Monitor</h1>
                            <p class="text-muted mb-0">Patient census and condition overview</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Census Card -->
            <div class="col-lg-4 col-md-6">
                <div class="stats-card">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h3 class="card-title">Ward Census</h3>
                        <div class="badge-circle bg-teal">
                            <i class="fas fa-users"></i>
                        </div>
                    </div>
                    <div class="stat-number" id="entPatientCount">0</div>
                    <div class="stat-label">Patients in ENT Ward</div>
                </div>
            </div>

            <!-- Ward Locations -->
            <div class="col-lg-8 col-md-6">
                <div class="data-card">
                    <h3 class="card-title mb-3">
                        <i class="fas fa-map-marker-alt me-2 text-blue"></i>
                        ENT Ward Locations
                    </h3>
                    <div id="entLocations" class="location-grid">
                        <!-- Locations will be populated here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient Conditions -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="data-card">
                    <h3 class="card-title mb-4">
                        <i class="fas fa-stethoscope me-2 text-green"></i>
                        Patient Conditions
                    </h3>
                    <div id="patientConditions" class="conditions-container">
                        <!-- Patient conditions will be populated here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- No Data State -->
        <div id="noDataState" class="row mt-4" style="display: none;">
            <div class="col-12">
                <div class="empty-state">
                    <div class="empty-icon">
                        <i class="fas fa-database"></i>
                    </div>
                    <h4>No Data Available</h4>
                    <p class="text-muted">No patient data or ENT ward information found.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
