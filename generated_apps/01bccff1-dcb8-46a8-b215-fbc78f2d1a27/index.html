<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Encounters Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="me-3">
                                <i class="fas fa-user-circle text-muted" style="font-size: 2.5rem;"></i>
                            </div>
                            <div>
                                <h1 class="mb-1" id="patientName">Loading...</h1>
                                <p class="text-muted mb-0" id="patientInfo">Patient ID: Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Encounters Overview -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h2 class="mb-0">
                            <i class="fas fa-calendar-check text-primary me-2"></i>
                            Encounters Overview
                        </h2>
                    </div>
                    <div class="card-body">
                        <div class="row" id="encounterStats">
                            <div class="col-md-3 mb-3">
                                <div class="stat-card">
                                    <div class="stat-icon">
                                        <i class="fas fa-clipboard-list text-primary"></i>
                                    </div>
                                    <div class="stat-content">
                                        <h3 class="stat-number" id="totalEncounters">0</h3>
                                        <p class="stat-label">Total Encounters</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <div class="stat-card">
                                    <div class="stat-icon">
                                        <i class="fas fa-check-circle text-success"></i>
                                    </div>
                                    <div class="stat-content">
                                        <h3 class="stat-number" id="finishedEncounters">0</h3>
                                        <p class="stat-label">Finished</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <div class="stat-card">
                                    <div class="stat-icon">
                                        <i class="fas fa-clock text-warning"></i>
                                    </div>
                                    <div class="stat-content">
                                        <h3 class="stat-number" id="inProgressEncounters">0</h3>
                                        <p class="stat-label">In Progress</p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <div class="stat-card">
                                    <div class="stat-icon">
                                        <i class="fas fa-calendar text-info"></i>
                                    </div>
                                    <div class="stat-content">
                                        <h3 class="stat-number" id="lastEncounter">-</h3>
                                        <p class="stat-label">Last Visit</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Encounters List -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <h2 class="mb-0">
                            <i class="fas fa-list text-primary me-2"></i>
                            Recent Encounters
                        </h2>
                    </div>
                    <div class="card-body p-0">
                        <div id="encountersList" class="list-group list-group-flush">
                            <div class="list-group-item text-center py-4">
                                <i class="fas fa-spinner fa-spin text-muted me-2"></i>
                                Loading encounters...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
