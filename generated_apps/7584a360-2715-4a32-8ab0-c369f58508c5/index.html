<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBAR Handover Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-clipboard-list text-primary me-3"></i>
                        <div>
                            <h1 class="mb-1">SBAR Handover Summary</h1>
                            <p class="text-muted mb-0" id="patient-header">Loading patient information...</p>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Situation -->
                    <div class="col-12 col-lg-6">
                        <div class="sbar-card situation-card">
                            <div class="sbar-header">
                                <i class="fas fa-info-circle"></i>
                                <h3>Situation</h3>
                            </div>
                            <div class="sbar-content" id="situation-content">
                                <div class="loading-state">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    <span>Loading situation...</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Background -->
                    <div class="col-12 col-lg-6">
                        <div class="sbar-card background-card">
                            <div class="sbar-header">
                                <i class="fas fa-history"></i>
                                <h3>Background</h3>
                            </div>
                            <div class="sbar-content" id="background-content">
                                <div class="loading-state">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    <span>Loading background...</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Assessment -->
                    <div class="col-12 col-lg-6">
                        <div class="sbar-card assessment-card">
                            <div class="sbar-header">
                                <i class="fas fa-stethoscope"></i>
                                <h3>Assessment</h3>
                            </div>
                            <div class="sbar-content" id="assessment-content">
                                <div class="loading-state">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    <span>Loading assessment...</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Recommendation -->
                    <div class="col-12 col-lg-6">
                        <div class="sbar-card recommendation-card">
                            <div class="sbar-header">
                                <i class="fas fa-tasks"></i>
                                <h3>Recommendation</h3>
                            </div>
                            <div class="sbar-content" id="recommendation-content">
                                <div class="loading-state">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    <span>Loading recommendations...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- All Patients View -->
                <div id="all-patients-view" class="d-none">
                    <div class="alert alert-info d-flex align-items-center mb-4">
                        <i class="fas fa-users me-2"></i>
                        <span>Viewing all patients - Select individual patients for detailed SBAR handover summaries</span>
                    </div>
                    <div class="row g-3" id="patients-grid">
                        <!-- Patient cards will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
