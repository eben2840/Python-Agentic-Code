<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex align-items-center mb-3">
                    <i class="fas fa-user-md text-primary me-3" style="font-size: 1.5rem;"></i>
                    <div>
                        <h1 class="mb-0" id="patientName">Patient Dashboard</h1>
                        <p class="text-muted mb-0" id="patientInfo">Loading patient information...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Patient Overview Card -->
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <i class="fas fa-id-card text-teal me-2"></i>
                            <h3 class="mb-0">Patient Overview</h3>
                        </div>
                        <div id="patientOverview">
                            <div class="d-flex justify-content-between py-2 border-bottom">
                                <span class="text-muted">Gender:</span>
                                <span id="patientGender">-</span>
                            </div>
                            <div class="d-flex justify-content-between py-2 border-bottom">
                                <span class="text-muted">Birth Date:</span>
                                <span id="patientBirth">-</span>
                            </div>
                            <div class="d-flex justify-content-between py-2">
                                <span class="text-muted">Patient ID:</span>
                                <span class="font-monospace small" id="patientId">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Vital Signs Card -->
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <i class="fas fa-heartbeat text-danger me-2"></i>
                            <h3 class="mb-0">Vital Signs</h3>
                        </div>
                        <div id="vitalSigns">
                            <p class="text-muted small">No vital signs data available</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Observations Card -->
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <i class="fas fa-chart-line text-success me-2"></i>
                            <h3 class="mb-0">Observations</h3>
                        </div>
                        <div id="observations">
                            <p class="text-muted small">No observations available</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Conditions Card -->
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <i class="fas fa-stethoscope text-warning me-2"></i>
                            <h3 class="mb-0">Conditions</h3>
                        </div>
                        <div id="conditions">
                            <p class="text-muted small">No conditions recorded</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Medications Card -->
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <i class="fas fa-pills text-info me-2"></i>
                            <h3 class="mb-0">Medications</h3>
                        </div>
                        <div id="medications">
                            <p class="text-muted small">No medications prescribed</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
