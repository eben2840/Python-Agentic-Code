<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Observations Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card mb-4">
                    <div class="d-flex align-items-center">
                        <div class="icon-wrapper me-3">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div>
                            <h1 class="mb-1">Hospital Observations Dashboard</h1>
                            <p class="text-muted mb-0">Real-time patient observations and vital signs</p>
                        </div>
                    </div>
                    <div class="stats-row mt-3">
                        <div class="stat-item">
                            <span class="stat-number" id="totalObservations">0</span>
                            <span class="stat-label">Total Observations</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="totalPatients">0</span>
                            <span class="stat-label">Patients</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="recentObservations">0</span>
                            <span class="stat-label">Recent (24h)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="observations-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="mb-0">
                            <i class="fas fa-stethoscope me-2 text-teal"></i>
                            All Patient Observations
                        </h3>
                        <div class="filter-controls">
                            <select class="form-select form-select-sm" id="filterType">
                                <option value="all">All Types</option>
                                <option value="vital_signs">Vital Signs</option>
                                <option value="observation">Lab Results</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="observationsContainer" class="observations-grid">
                            <div class="loading-state">
                                <i class="fas fa-spinner fa-spin"></i>
                                <p>Loading observations...</p>
                            </div>
                        </div>
                        <div id="noDataState" class="no-data-state d-none">
                            <i class="fas fa-chart-line"></i>
                            <h4>No Observations Available</h4>
                            <p>No patient observations found in the system.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
