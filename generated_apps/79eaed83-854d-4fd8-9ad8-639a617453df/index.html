<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Directory - SMART on FHIR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body text-center py-4">
                        <i class="fas fa-hospital-alt text-primary mb-3" style="font-size: 2.5rem;"></i>
                        <h1 class="h3 mb-2">Ward Directory</h1>
                        <p class="text-muted mb-0">Available hospital wards and locations</p>
                    </div>
                </div>

                <!-- Ward Statistics -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card stats-card">
                            <div class="card-body text-center">
                                <i class="fas fa-bed text-teal mb-2"></i>
                                <h3 class="h4 mb-1" id="totalWards">0</h3>
                                <p class="text-muted small mb-0">Total Wards</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stats-card">
                            <div class="card-body text-center">
                                <i class="fas fa-door-open text-blue mb-2"></i>
                                <h3 class="h4 mb-1" id="totalRooms">0</h3>
                                <p class="text-muted small mb-0">Total Rooms</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stats-card">
                            <div class="card-body text-center">
                                <i class="fas fa-check-circle text-green mb-2"></i>
                                <h3 class="h4 mb-1" id="activeLocations">0</h3>
                                <p class="text-muted small mb-0">Active Locations</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ward List -->
                <div class="card">
                    <div class="card-header bg-white border-bottom">
                        <div class="d-flex align-items-center justify-content-between">
                            <h2 class="h5 mb-0">
                                <i class="fas fa-list-ul me-2 text-primary"></i>
                                Ward Locations
                            </h2>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-outline-secondary" id="filterWards">
                                    <i class="fas fa-bed me-1"></i>Wards Only
                                </button>
                                <button class="btn btn-sm btn-outline-secondary" id="filterRooms">
                                    <i class="fas fa-door-open me-1"></i>Rooms Only
                                </button>
                                <button class="btn btn-sm btn-outline-primary" id="showAll">
                                    <i class="fas fa-eye me-1"></i>Show All
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="wardList" class="list-group list-group-flush">
                            <!-- Ward items will be populated by JavaScript -->
                        </div>
                        <div id="noDataMessage" class="text-center py-5 d-none">
                            <i class="fas fa-exclamation-circle text-muted mb-3" style="font-size: 2rem;"></i>
                            <h4 class="text-muted">No ward data available</h4>
                            <p class="text-muted">Location information could not be loaded.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
