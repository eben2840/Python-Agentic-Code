<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Blood Pressure Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex align-items-center mb-4">
                    <i class="fas fa-heartbeat text-danger me-3" style="font-size: 1.5rem;"></i>
                    <h1 class="mb-0">Blood Pressure Monitor</h1>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Patient Overview Card -->
            <div class="col-12 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <i class="fas fa-user-circle text-primary me-2"></i>
                            <h3 class="mb-0">Patient Information</h3>
                        </div>
                        <div id="patientInfo">
                            <p class="text-muted">Loading patient data...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Blood Pressure Readings -->
            <div class="col-12 col-lg-8">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <div class="d-flex align-items-center">
                                <i class="fas fa-chart-line text-danger me-2"></i>
                                <h3 class="mb-0">Blood Pressure Readings</h3>
                            </div>
                            <span id="bpStatus" class="badge bg-light text-dark">Analyzing...</span>
                        </div>
                        <div id="bpReadings">
                            <p class="text-muted">Loading blood pressure data...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- High Risk Observations -->
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <i class="fas fa-exclamation-triangle text-warning me-2"></i>
                            <h3 class="mb-0">High Risk Observations</h3>
                        </div>
                        <div id="highRiskObs">
                            <p class="text-muted">Analyzing observations...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Related Conditions -->
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <i class="fas fa-stethoscope text-success me-2"></i>
                            <h3 class="mb-0">Related Conditions</h3>
                        </div>
                        <div id="relatedConditions">
                            <p class="text-muted">Loading conditions...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
