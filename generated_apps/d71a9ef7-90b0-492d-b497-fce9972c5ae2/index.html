<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard - Jane Doe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Patient Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card patient-header">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="patient-avatar me-3">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <div>
                                <h4 class="mb-1" id="patientName">Loading...</h4>
                                <div class="patient-details">
                                    <span class="badge bg-light text-dark me-2" id="patientGender">
                                        <i class="fas fa-venus-mars me-1"></i>Loading...
                                    </span>
                                    <span class="text-muted" id="patientDob">
                                        <i class="fas fa-calendar me-1"></i>Loading...
                                    </span>
                                    <span class="text-muted ms-3" id="patientId">
                                        <i class="fas fa-id-card me-1"></i>Loading...
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="row g-4">
            <!-- Location & Room -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-map-marker-alt text-primary me-2"></i>
                            Current Location
                        </h5>
                    </div>
                    <div class="card-body" id="locationSection">
                        <div class="text-center py-3">
                            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                            <div class="mt-2 text-muted">Loading location...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Observations -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-chart-line text-success me-2"></i>
                            Latest Observations
                        </h5>
                    </div>
                    <div class="card-body" id="observationSection">
                        <div class="text-center py-3">
                            <div class="spinner-border spinner-border-sm text-success" role="status"></div>
                            <div class="mt-2 text-muted">Loading observations...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Medications -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-pills text-warning me-2"></i>
                            Current Medications
                        </h5>
                    </div>
                    <div class="card-body" id="medicationSection">
                        <div class="text-center py-3">
                            <div class="spinner-border spinner-border-sm text-warning" role="status"></div>
                            <div class="mt-2 text-muted">Loading medications...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Encounters -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-calendar-check text-info me-2"></i>
                            Recent Encounters
                        </h5>
                    </div>
                    <div class="card-body" id="encounterSection">
                        <div class="text-center py-3">
                            <div class="spinner-border spinner-border-sm text-info" role="status"></div>
                            <div class="mt-2 text-muted">Loading encounters...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
