<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronic Disease Patients (30+)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Patient Details Modal -->
    <div class="modal fade" id="patientModal" tabindex="-1" aria-labelledby="patientModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title" id="patientModalLabel">
                        <i class="fas fa-user-md text-primary me-2"></i>
                        Patient Health Overview
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalContent">
                    <!-- Patient details will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-user-injured text-danger me-3"></i>
                        <div>
                            <h1 class="mb-1">Chronic Disease Patients (Age 30+)</h1>
                            <p class="text-muted mb-0">Patients with long-term conditions requiring ongoing care</p>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-item">
                            <span class="stat-number" id="totalPatients">0</span>
                            <span class="stat-label">Total Patients</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="avgAge">0</span>
                            <span class="stat-label">Average Age</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number" id="totalConditions">0</span>
                            <span class="stat-label">Total Conditions</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="filter-card">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-filter text-primary me-2"></i>
                            <span class="fw-medium">Filters</span>
                        </div>
                        <div class="d-flex gap-3">
                            <select class="form-select form-select-sm" id="genderFilter">
                                <option value="">All Genders</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                            <select class="form-select form-select-sm" id="ageFilter">
                                <option value="">All Ages (30+)</option>
                                <option value="30-40">30-40 years</option>
                                <option value="40-50">40-50 years</option>
                                <option value="50+">50+ years</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="patientsContainer">
            <!-- Patient cards will be inserted here -->
        </div>

        <div class="row" id="noDataMessage" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <i class="fas fa-search text-muted mb-3"></i>
                    <h5 class="text-muted">No patients found</h5>
                    <p class="text-muted mb-0">No patients over 30 with chronic diseases match the current filters.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
