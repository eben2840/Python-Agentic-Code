<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Assessment Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid p-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex align-items-center mb-4">
                    <div class="icon-circle me-3">
                        <i class="fas fa-clipboard-check text-white"></i>
                    </div>
                    <div>
                        <h1 class="mb-0">Patient Assessment</h1>
                        <p class="text-muted mb-0">Comprehensive health evaluation</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Patient Overview -->
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-user me-2 text-primary"></i>
                            Patient Information
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="patientInfo">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Vital Signs Assessment -->
            <div class="col-lg-8">
                <div class="card h-100">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-heartbeat me-2 text-danger"></i>
                            Vital Signs
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="vitalSigns">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Current Conditions -->
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-stethoscope me-2 text-warning"></i>
                            Active Conditions
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="conditions">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Current Medications -->
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-pills me-2 text-success"></i>
                            Current Medications
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="medications">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Allergies & Alerts -->
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="mb-0">
                            <i class="fas fa-exclamation-triangle me-2 text-danger"></i>
                            Allergies & Alerts
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="allergies">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
