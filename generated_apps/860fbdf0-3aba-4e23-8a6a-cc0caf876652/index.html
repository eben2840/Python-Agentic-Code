<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delirium Risk Assessment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="header-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-brain text-warning me-3 fs-2"></i>
                        <div>
                            <h1 class="mb-1">Delirium Risk Assessment</h1>
                            <p class="text-muted mb-0">Patients at risk for delirium based on clinical indicators</p>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-item">
                            <span class="stat-number" id="totalPatients">0</span>
                            <span class="stat-label">Total Patients</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number text-danger" id="highRiskCount">0</span>
                            <span class="stat-label">High Risk</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number text-warning" id="moderateRiskCount">0</span>
                            <span class="stat-label">Moderate Risk</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number text-success" id="lowRiskCount">0</span>
                            <span class="stat-label">Low Risk</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="filter-card mb-4">
                    <div class="d-flex flex-wrap align-items-center gap-3">
                        <div class="filter-group">
                            <label class="form-label mb-1">Risk Level</label>
                            <select class="form-select" id="riskFilter">
                                <option value="all">All Risk Levels</option>
                                <option value="high">High Risk</option>
                                <option value="moderate">Moderate Risk</option>
                                <option value="low">Low Risk</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label class="form-label mb-1">Age Group</label>
                            <select class="form-select" id="ageFilter">
                                <option value="all">All Ages</option>
                                <option value="elderly">65+ Years</option>
                                <option value="adult">18-64 Years</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label class="form-label mb-1">Search</label>
                            <input type="text" class="form-control" id="searchInput" placeholder="Search patients...">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="patientsContainer">
            <!-- Patient cards will be dynamically inserted here -->
        </div>

        <div class="row" id="noDataContainer" style="display: none;">
            <div class="col-12">
                <div class="no-data-card">
                    <i class="fas fa-search text-muted mb-3"></i>
                    <h3>No Data Available</h3>
                    <p class="text-muted">No patient data available for delirium risk assessment.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
