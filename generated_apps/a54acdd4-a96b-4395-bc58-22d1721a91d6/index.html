<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Observations - Rose Hall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <!-- Header -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="patient-avatar me-3">
                                <i class="fas fa-user-circle text-muted"></i>
                            </div>
                            <div>
                                <h4 class="mb-1" id="patientName">Loading...</h4>
                                <div class="text-muted small">
                                    <span id="patientGender">-</span> • 
                                    <span id="patientAge">-</span> • 
                                    <span id="patientDob">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Navigation Pills -->
                <div class="card mb-4">
                    <div class="card-body p-0">
                        <ul class="nav nav-pills nav-fill" id="patientTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="observations-tab" data-bs-toggle="pill" data-bs-target="#observations" type="button" role="tab">
                                    <i class="fas fa-chart-line me-2"></i>Observations
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="encounters-tab" data-bs-toggle="pill" data-bs-target="#encounters" type="button" role="tab">
                                    <i class="fas fa-calendar-check me-2"></i>Encounters
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="medications-tab" data-bs-toggle="pill" data-bs-target="#medications" type="button" role="tab">
                                    <i class="fas fa-pills me-2"></i>Medications
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Tab Content -->
                <div class="tab-content" id="patientTabsContent">
                    <!-- Observations Tab -->
                    <div class="tab-pane fade show active" id="observations" role="tabpanel">
                        <div class="card">
                            <div class="card-header bg-white border-bottom">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-chart-line text-primary me-2"></i>
                                    <h5 class="mb-0">Patient Observations</h5>
                                </div>
                            </div>
                            <div class="card-body">
                                <div id="observationsContainer">
                                    <div class="text-center py-4">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                        <p class="text-muted mt-2">Loading observations...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Encounters Tab -->
                    <div class="tab-pane fade" id="encounters" role="tabpanel">
                        <div class="card">
                            <div class="card-header bg-white border-bottom">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-calendar-check text-primary me-2"></i>
                                    <h5 class="mb-0">Patient Encounters</h5>
                                </div>
                            </div>
                            <div class="card-body">
                                <div id="encountersContainer">
                                    <div class="text-center py-4">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                        <p class="text-muted mt-2">Loading encounters...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Medications Tab -->
                    <div class="tab-pane fade" id="medications" role="tabpanel">
                        <div class="card">
                            <div class="card-header bg-white border-bottom">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-pills text-primary me-2"></i>
                                    <h5 class="mb-0">Patient Medications</h5>
                                </div>
                            </div>
                            <div class="card-body">
                                <div id="medicationsContainer">
                                    <div class="text-center py-4">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                        <p class="text-muted mt-2">Loading medications...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
