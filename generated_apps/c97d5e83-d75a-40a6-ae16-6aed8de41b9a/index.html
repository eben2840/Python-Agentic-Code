<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <div class="icon-circle me-3">
                                <i class="fas fa-user-md text-primary"></i>
                            </div>
                            <div>
                                <h1 class="mb-1" id="patientName">Loading...</h1>
                                <p class="text-muted mb-0" id="patientInfo">Patient Dashboard</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard Cards -->
        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <div class="card stat-card">
                    <div class="card-body text-center">
                        <div class="icon-circle mx-auto mb-2">
                            <i class="fas fa-calendar-check text-success"></i>
                        </div>
                        <h3 class="mb-1" id="totalEncounters">0</h3>
                        <p class="text-muted mb-0">Total Encounters</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stat-card">
                    <div class="card-body text-center">
                        <div class="icon-circle mx-auto mb-2">
                            <i class="fas fa-chart-line text-info"></i>
                        </div>
                        <h3 class="mb-1" id="totalObservations">0</h3>
                        <p class="text-muted mb-0">Observations</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stat-card">
                    <div class="card-body text-center">
                        <div class="icon-circle mx-auto mb-2">
                            <i class="fas fa-pills text-warning"></i>
                        </div>
                        <h3 class="mb-1" id="totalMedications">0</h3>
                        <p class="text-muted mb-0">Medications</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stat-card">
                    <div class="card-body text-center">
                        <div class="icon-circle mx-auto mb-2">
                            <i class="fas fa-exclamation-triangle text-danger"></i>
                        </div>
                        <h3 class="mb-1" id="totalConditions">0</h3>
                        <p class="text-muted mb-0">Conditions</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Encounters Section -->
            <div class="col-lg-8 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h2 class="mb-0">
                            <i class="fas fa-hospital-user text-primary me-2"></i>
                            Patient Encounters
                        </h2>
                    </div>
                    <div class="card-body">
                        <div id="encountersList">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Observations Section -->
            <div class="col-lg-4 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h2 class="mb-0">
                            <i class="fas fa-chart-bar text-success me-2"></i>
                            Recent Observations
                        </h2>
                    </div>
                    <div class="card-body">
                        <div id="observationsList">
                            <div class="text-center py-4">
                                <div class="spinner-border text-success" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
